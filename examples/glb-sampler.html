<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tesserae · glb-sampler</title>
  <!--
    glb-sampler.html — form-reconstruction validation tool.

    Pipeline:   GLB  ->  sample surface  ->  generate tesserae  ->  InstancedMesh

    The question is NOT "how many cubes" — it's whether a tesserae cloud
    reconstructs the FORM of a model. Use the inspection modes to answer:
      · Does the silhouette hold?           -> ghost the original mesh and compare
      · Do curved surfaces read correctly?  -> orbit; try sphere/rounded primitives
      · Are normals oriented correctly?     -> NORMALS debug colours each tessera by normal
      · Does it still feel like the model?  -> try uniform vs MIXED primitives

    Primitive mixing (70% rounded / 20% sphere / 10% diamond) tests the core
    hypothesis: mixed primitives may preserve *perception* better than uniform
    ones, even when less geometrically faithful (the Chuck Close influence).

    Sampling math mirrors src/geometry/SurfaceSampler.ts + TesseraGenerator.ts;
    inlined here so the prototype runs by just opening the file (no build step).
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d7e0ea; }
    #app { position: fixed; inset: 0; } canvas { display: block; }
    #hud { position: fixed; top: env(safe-area-inset-top, 12px); left: 12px; padding: 12px 14px;
      border-radius: 10px; background: rgba(10,14,20,.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.08); min-width: 220px; user-select: none; -webkit-user-select: none; }
    #hud h1 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: #8aa0b6; font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 16px; } .row + .row { margin-top: 2px; }
    .k { color: #7e90a4; } .v { color: #eaf2fb; font-variant-numeric: tabular-nums; }
    #fps { font-size: 22px; font-weight: 700; }
    .fps-good { color: #5ad08a; } .fps-mid { color: #f0c761; } .fps-bad { color: #ef6f6f; }
    #controls { position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(10,14,20,.72);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; }
    .group .label { color: #7e90a4; align-self: center; padding: 0 4px; letter-spacing: .08em; }
    button { font: inherit; color: #cdd9e6; cursor: pointer; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12); padding: 7px 11px; border-radius: 7px; -webkit-tap-highlight-color: transparent; }
    button:hover { background: rgba(255,255,255,.1); } button.active { background: #2f6df0; border-color: #2f6df0; color: #fff; }
    #note { position: fixed; top: env(safe-area-inset-top, 12px); right: 12px; max-width: 240px; text-align: right; color: #65788c; }
    #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(7,9,13,.85); border: 2px dashed #2f6df0; z-index: 10; font-size: 18px; color: #cdd9e6; }
    #drop.show { display: flex; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="drop">drop a .glb / .gltf to reconstruct</div>

  <div id="hud">
    <h1>glb-sampler</h1>
    <div class="row"><span class="k">FPS</span><span id="fps" class="v">—</span></div>
    <div class="row"><span class="k">tesserae</span><span id="count" class="v">—</span></div>
    <div class="row"><span class="k">source tris</span><span id="srctris" class="v">—</span></div>
    <div class="row"><span class="k">primitive</span><span id="prim" class="v">—</span></div>
    <div class="row"><span class="k">tessera size</span><span id="size" class="v">—</span></div>
    <div class="row"><span class="k">draw calls</span><span id="calls" class="v">—</span></div>
  </div>

  <div id="note"><div id="model">loading model…</div></div>

  <div id="controls">
    <div class="group" id="count-group"><span class="label">TESSERAE</span></div>
    <div class="group" id="prim-group"><span class="label">PRIMITIVE</span></div>
    <div class="group" id="size-group"><span class="label">SIZE</span></div>
    <div class="group" id="debug-group"><span class="label">INSPECT</span></div>
    <div class="group" id="file-group"><span class="label">MODEL</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const COUNTS = [10000, 25000, 50000];
    const PRIMS = ['rounded', 'cube', 'sphere', 'diamond', 'mix'];
    const SIZES = { S: 1.1, M: 1.6, L: 2.3 };
    // 70% rounded / 20% sphere / 10% diamond — the procedural mix under test.
    const MIX = [['rounded', 0.7], ['sphere', 0.9], ['diamond', 1.0]];
    const DEFAULT_URL = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb';

    // ---- renderer / scene ----
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('app').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090d);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 5000);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(1, 1.4, 0.8); scene.add(key);
    const rim = new THREE.DirectionalLight(0x4f7bff, 0.7); rim.position.set(-1, -0.6, -1); scene.add(rim);

    // orbit / zoom / pan — drag to rotate, pinch or scroll to zoom, two-finger pan
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
    controls.minDistance = 0.001;
    function frameView() {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const dist = 1.3 * radius / Math.sin(Math.min(vFov, hFov) / 2);
      controls.target.copy(center);
      camera.position.set(center.x, center.y + radius * 0.12, center.z + dist);
      camera.near = Math.max(dist / 1000, 0.001); camera.far = dist * 20;
      camera.updateProjectionMatrix(); controls.update();
    }

    // ---- state ----
    let count = 25000, primitive = 'rounded', sizeMul = SIZES.M;
    let normalsDebug = false, showGhost = false;
    let meshes = [];                  // one InstancedMesh per primitive type in use
    let ghost = null;                 // original model (wireframe)
    let samples = null;               // cached { px, py, pz, qx..qw } per tessera
    let srcTris = 0, radius = 1;
    const center = new THREE.Vector3();

    // ---- surface merge + sampling (port of src/geometry/SurfaceSampler.ts) ----
    function mergeSurface(rootObj) {
      const chunks = [];
      rootObj.updateWorldMatrix(true, true);
      rootObj.traverse((o) => {
        if (!o.isMesh || !o.geometry) return;
        let g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
        g = g.clone(); g.applyMatrix4(o.matrixWorld);
        if (!g.attributes.normal) g.computeVertexNormals();
        chunks.push(g);
      });
      let total = 0; for (const g of chunks) total += g.attributes.position.count;
      const positions = new Float32Array(total * 3), normals = new Float32Array(total * 3);
      let off = 0;
      for (const g of chunks) {
        positions.set(g.attributes.position.array, off * 3);
        normals.set(g.attributes.normal.array, off * 3);
        off += g.attributes.position.count;
      }
      return { positions, normals };
    }

    function resample(surface, n) {
      const p = surface.positions, nr = surface.normals, triN = p.length / 9;
      const cum = new Float64Array(triN); let running = 0;
      for (let t = 0; t < triN; t++) {
        const o = t * 9;
        const abx=p[o+3]-p[o], aby=p[o+4]-p[o+1], abz=p[o+5]-p[o+2];
        const acx=p[o+6]-p[o], acy=p[o+7]-p[o+1], acz=p[o+8]-p[o+2];
        const cx=aby*acz-abz*acy, cy=abz*acx-abx*acz, cz=abx*acy-aby*acx;
        running += 0.5 * Math.hypot(cx, cy, cz); cum[t] = running;
      }
      const total = running;
      const pick = (r) => { let lo=0, hi=triN-1, x=r*total; while (lo<hi){ const m=(lo+hi)>>1; if (cum[m]<x) lo=m+1; else hi=m; } return lo; };

      const out = { px:new Float32Array(n), py:new Float32Array(n), pz:new Float32Array(n),
                    qx:new Float32Array(n), qy:new Float32Array(n), qz:new Float32Array(n), qw:new Float32Array(n) };
      for (let i = 0; i < n; i++) {
        const t = pick(Math.random()), o = t * 9;
        let u = Math.random(), v = Math.random(); if (u+v>1){u=1-u;v=1-v;} const w = 1-u-v;
        out.px[i] = p[o]*w + p[o+3]*u + p[o+6]*v;
        out.py[i] = p[o+1]*w + p[o+4]*u + p[o+7]*v;
        out.pz[i] = p[o+2]*w + p[o+5]*u + p[o+8]*v;
        let nx = nr[o]*w + nr[o+3]*u + nr[o+6]*v, ny = nr[o+1]*w + nr[o+4]*u + nr[o+7]*v, nz = nr[o+2]*w + nr[o+5]*u + nr[o+8]*v;
        const nl = Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
        // quaternion aligning +Z to normal
        let r = nz + 1, x, y, z;
        if (r < 1e-6) { r = 0; x = 0; y = -1; z = 0; } else { x = -ny; y = nx; z = 0; }
        const ql = Math.hypot(x,y,z,r)||1;
        out.qx[i]=x/ql; out.qy[i]=y/ql; out.qz[i]=z/ql; out.qw[i]=r/ql;
      }
      return out;
    }

    function makeGeometry(kind, s) {
      switch (kind) {
        case 'cube':    return new THREE.BoxGeometry(s, s, s);
        case 'sphere':  return new THREE.IcosahedronGeometry(s * 0.62, 1);
        case 'diamond': return new THREE.OctahedronGeometry(s * 0.72, 0);
        default:        return new RoundedBoxGeometry(s, s, s, 2, s * 0.28);
      }
    }
    function assignType(i) {
      if (primitive !== 'mix') return primitive;
      const r = (Math.sin(i * 12.9898) * 43758.5453) % 1; const rr = r < 0 ? r + 1 : r; // stable per-index
      for (const [type, thresh] of MIX) if (rr < thresh) return type;
      return 'rounded';
    }

    // ---- build instanced meshes ----
    function clearMeshes() { for (const m of meshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); } meshes = []; }

    function rebuild() {
      if (!samples) return;
      clearMeshes();
      const baseSize = (radius * 2) / Math.sqrt(count) * sizeMul;

      // bucket tesserae indices by primitive type
      const buckets = new Map();
      for (let i = 0; i < count; i++) {
        const type = assignType(i);
        if (!buckets.has(type)) buckets.set(type, []);
        buckets.get(type).push(i);
      }

      const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), col = new THREE.Color();
      for (const [type, ids] of buckets) {
        const geo = makeGeometry(type, baseSize);
        const mat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.1, vertexColors: normalsDebug });
        if (!normalsDebug) mat.color.set(0x9fb4cc);
        const im = new THREE.InstancedMesh(geo, mat, ids.length);
        im.frustumCulled = false;
        for (let j = 0; j < ids.length; j++) {
          const i = ids[j];
          _p.set(samples.px[i], samples.py[i], samples.pz[i]);
          _q.set(samples.qx[i], samples.qy[i], samples.qz[i], samples.qw[i]);
          _s.setScalar(1); _m.compose(_p, _q, _s); im.setMatrixAt(j, _m);
          if (normalsDebug) {
            // colour by normal direction (re-derived from the orientation's +Z)
            const nx = 2*(samples.qx[i]*samples.qz[i] + samples.qw[i]*samples.qy[i]);
            const ny = 2*(samples.qy[i]*samples.qz[i] - samples.qw[i]*samples.qx[i]);
            const nz = 1 - 2*(samples.qx[i]*samples.qx[i] + samples.qy[i]*samples.qy[i]);
            col.setRGB(nx*0.5+0.5, ny*0.5+0.5, nz*0.5+0.5); im.setColorAt(j, col);
          }
        }
        im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
        scene.add(im); meshes.push(im);
      }

      document.getElementById('count').textContent = count.toLocaleString();
      document.getElementById('srctris').textContent = srcTris.toLocaleString();
      document.getElementById('prim').textContent = primitive;
      document.getElementById('size').textContent = baseSize.toPrecision(3);
      document.getElementById('calls').textContent = String(meshes.length);
    }

    function resampleAndRebuild() {
      if (!window._surface) return;
      samples = resample(window._surface, count);
      rebuild();
    }

    // ---- model loading ----
    const loader = new GLTFLoader();
    function setGhost(rootObj) {
      if (ghost) { scene.remove(ghost); }
      ghost = rootObj.clone(true);
      ghost.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: 0x335577, wireframe: true, transparent: true, opacity: 0.5 }); });
      ghost.visible = showGhost; scene.add(ghost);
    }
    function loadFromObject(rootObj, label) {
      const box = new THREE.Box3().setFromObject(rootObj);
      const sph = box.getBoundingSphere(new THREE.Sphere());
      center.copy(sph.center); radius = sph.radius || 1;
      frameView();

      window._surface = mergeSurface(rootObj);
      srcTris = window._surface.positions.length / 9;
      setGhost(rootObj);
      resampleAndRebuild();
      document.getElementById('model').textContent = label;
    }
    function loadURL(url, label) {
      document.getElementById('model').textContent = 'loading…';
      loader.load(url, (g) => loadFromObject(g.scene, label), undefined, () => fallback());
    }
    function loadArrayBuffer(buf, label) {
      loader.parse(buf, '', (g) => loadFromObject(g.scene, label), () => fallback());
    }
    function fallback() {
      const g = new THREE.TorusKnotGeometry(1, 0.32, 220, 36);
      loadFromObject(new THREE.Mesh(g, new THREE.MeshStandardMaterial()), 'procedural torus knot (GLB load failed)');
    }

    // ---- controls ----
    function makeButtons(groupId, items, current, label, onPick) {
      const group = document.getElementById(groupId); const map = new Map();
      for (const it of items) {
        const b = document.createElement('button'); b.textContent = label(it);
        b.onclick = () => { onPick(it); for (const [val, btn] of map) btn.classList.toggle('active', val === it); };
        if (it === current) b.classList.add('active'); group.appendChild(b); map.set(it, b);
      }
    }
    makeButtons('count-group', COUNTS, count, c => (c/1000)+'k', c => { count = c; resampleAndRebuild(); });
    makeButtons('prim-group', PRIMS, primitive, p => p, p => { primitive = p; rebuild(); });
    makeButtons('size-group', Object.keys(SIZES), 'M', k => k, k => { sizeMul = SIZES[k]; rebuild(); });

    (function debugButtons() {
      const g = document.getElementById('debug-group');
      const nb = document.createElement('button'); nb.textContent = 'normals';
      nb.onclick = () => { normalsDebug = !normalsDebug; nb.classList.toggle('active', normalsDebug); rebuild(); };
      const gb = document.createElement('button'); gb.textContent = 'ghost mesh';
      gb.onclick = () => { showGhost = !showGhost; gb.classList.toggle('active', showGhost); if (ghost) ghost.visible = showGhost; };
      const rf = document.createElement('button'); rf.textContent = 'reframe'; rf.onclick = () => frameView();
      g.append(nb, gb, rf);
    })();

    const fileBtn = document.createElement('button'); fileBtn.textContent = 'open .glb…';
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.glb,.gltf,model/gltf-binary'; input.style.display = 'none';
    input.onchange = () => { const f = input.files[0]; if (f) f.arrayBuffer().then((b) => loadArrayBuffer(b, f.name)); };
    fileBtn.onclick = () => input.click();
    document.getElementById('file-group').append(fileBtn, input);

    const drop = document.getElementById('drop');
    window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('show'); });
    window.addEventListener('dragleave', (e) => { if (e.target === drop) drop.classList.remove('show'); });
    window.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('show');
      const f = e.dataTransfer.files[0]; if (f) f.arrayBuffer().then((b) => loadArrayBuffer(b, f.name)); });

    // ---- loop ----
    const fpsEl = document.getElementById('fps');
    let last = performance.now(), acc = 0, frames = 0, smoothed = 0;
    function tick(now) {
      acc += now - last; last = now; frames++;
      if (acc >= 250) {
        const fps = (frames*1000)/acc; smoothed = smoothed ? smoothed*0.7 + fps*0.3 : fps;
        fpsEl.textContent = smoothed.toFixed(0);
        fpsEl.className = 'v ' + (smoothed >= 50 ? 'fps-good' : smoothed >= 30 ? 'fps-mid' : 'fps-bad');
        acc = 0; frames = 0;
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); controls.update();
    });

    loadURL(DEFAULT_URL, 'DamagedHelmet.glb');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
