<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tesserae · primitive-cloud</title>
  <!--
    primitive-cloud.html — the first Tesserae-Engine prototype.

    Goal: NOT visuals. Performance. Answer one question: how many tesserae can
    we push on a given device (M-series Mac / gaming PC / iPad Safari)?

    Approach: a single THREE.InstancedMesh (one draw call) renders N primitives
    using GPU instancing. Swap the base primitive between cube / rounded cube /
    sphere and the instance count between 10k … 1M, and watch the FPS HUD.

    Self-contained: open the file directly in a browser. Three.js is loaded as
    a pinned ES module from a CDN.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d7e0ea; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #hud {
      position: fixed; top: env(safe-area-inset-top, 12px); left: 12px;
      padding: 12px 14px; border-radius: 10px;
      background: rgba(10, 14, 20, 0.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08); min-width: 210px;
      user-select: none; -webkit-user-select: none;
    }
    #hud h1 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
      margin: 0 0 8px; color: #8aa0b6; font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 16px; }
    .row + .row { margin-top: 2px; }
    .k { color: #7e90a4; }
    .v { color: #eaf2fb; font-variant-numeric: tabular-nums; }
    #fps { font-size: 22px; font-weight: 700; }
    .fps-good { color: #5ad08a; } .fps-mid { color: #f0c761; } .fps-bad { color: #ef6f6f; }

    #controls {
      position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .group { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
      background: rgba(10, 14, 20, 0.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; }
    .group .label { color: #7e90a4; align-self: center; padding: 0 4px; letter-spacing: .08em; }
    button {
      font: inherit; color: #cdd9e6; cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 11px; border-radius: 7px; -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: rgba(255, 255, 255, 0.1); }
    button.active { background: #2f6df0; border-color: #2f6df0; color: #fff; }
    #note { position: fixed; top: env(safe-area-inset-top, 12px); right: 12px;
      max-width: 230px; text-align: right; color: #65788c; }
    a { color: #6f9bf0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>primitive-cloud</h1>
    <div class="row"><span class="k">FPS</span><span id="fps" class="v">—</span></div>
    <div class="row"><span class="k">frame</span><span id="ms" class="v">—</span></div>
    <div class="row"><span class="k">tesserae</span><span id="count" class="v">—</span></div>
    <div class="row"><span class="k">primitive</span><span id="prim" class="v">—</span></div>
    <div class="row"><span class="k">tris</span><span id="tris" class="v">—</span></div>
    <div class="row"><span class="k">draw calls</span><span id="calls" class="v">—</span></div>
    <div class="row"><span class="k">motion</span><span id="motion" class="v">static</span></div>
  </div>

  <div id="note">
    <div id="gpu">detecting GPU…</div>
  </div>

  <div id="controls">
    <div class="group" id="count-group"><span class="label">COUNT</span></div>
    <div class="group" id="prim-group"><span class="label">SHAPE</span></div>
    <div class="group" id="motion-group"><span class="label">MOTION</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---- config ----------------------------------------------------------
    const COUNTS = [10000, 50000, 100000, 250000, 500000, 1000000];
    const PRIMITIVES = ['cube', 'rounded', 'sphere'];
    const FIELD = 60;            // half-extent of the cube volume instances fill
    const DEFAULT_COUNT = 50000;
    const DEFAULT_PRIM = 'cube';

    // "Animate Tesserae" is not for the final engine yet — it exists to measure
    // the cost that matters for VRM avatars: GPU rasterization + per-instance
    // animation. When on, every instance gets sin-wave position offsets,
    // rotation offsets, and scale "breathing" recomputed on the CPU each frame.
    const ANIM = { posAmp: 1.6, posFreq: 1.4, rotFreq: 0.6, scaleAmp: 0.18, scaleFreq: 2.0 };

    // ---- renderer / scene ------------------------------------------------
    const app = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090d);
    scene.fog = new THREE.Fog(0x07090d, FIELD * 1.4, FIELD * 3.4);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, FIELD * 2.4);

    // orbit / zoom / pan — drag to rotate, pinch or scroll to zoom, two-finger pan
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1, 1.4, 0.8); scene.add(key);
    const rim = new THREE.DirectionalLight(0x4f7bff, 0.7); rim.position.set(-1, -0.6, -1); scene.add(rim);

    // Per-instance state, generated once and reused across count/shape changes.
    const MAX = COUNTS[COUNTS.length - 1];
    const seeds = new Float32Array(MAX * 8); // px,py,pz, qx,qy,qz,qw(approx via euler), scale
    (function seed() {
      const e = new THREE.Euler(), q = new THREE.Quaternion();
      for (let i = 0; i < MAX; i++) {
        const o = i * 8;
        seeds[o + 0] = (Math.random() * 2 - 1) * FIELD;
        seeds[o + 1] = (Math.random() * 2 - 1) * FIELD;
        seeds[o + 2] = (Math.random() * 2 - 1) * FIELD;
        e.set(Math.random() * 6.283, Math.random() * 6.283, Math.random() * 6.283);
        q.setFromEuler(e);
        seeds[o + 3] = q.x; seeds[o + 4] = q.y; seeds[o + 5] = q.z; seeds[o + 6] = q.w;
        seeds[o + 7] = 0.35 + Math.random() * 0.6;
      }
    })();

    function makeGeometry(kind) {
      switch (kind) {
        case 'rounded': return new RoundedBoxGeometry(1, 1, 1, 3, 0.18);
        case 'sphere':  return new THREE.IcosahedronGeometry(0.62, 2);
        default:        return new THREE.BoxGeometry(1, 1, 1);
      }
    }

    let mesh = null;
    let primitive = DEFAULT_PRIM;
    let count = DEFAULT_COUNT;
    let animate = false;

    // Reused scratch objects — no per-frame allocation in the animation path.
    const _m = new THREE.Matrix4();
    const _pos = new THREE.Vector3(), _quat = new THREE.Quaternion(), _scl = new THREE.Vector3();
    const _aEuler = new THREE.Euler(), _aQuat = new THREE.Quaternion();

    function setStaticMatrices() {
      for (let i = 0; i < count; i++) {
        const o = i * 8;
        _pos.set(seeds[o], seeds[o + 1], seeds[o + 2]);
        _quat.set(seeds[o + 3], seeds[o + 4], seeds[o + 5], seeds[o + 6]);
        const s = seeds[o + 7]; _scl.set(s, s, s);
        _m.compose(_pos, _quat, _scl);
        mesh.setMatrixAt(i, _m);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }

    // Per-frame CPU update of every instance — this is the "animation cost" the
    // toggle is meant to measure.
    function animateMatrices(t) {
      const a = ANIM;
      for (let i = 0; i < count; i++) {
        const o = i * 8;
        const phase = seeds[o] + seeds[o + 1];          // per-instance phase
        _pos.set(
          seeds[o]     + Math.sin(t * a.posFreq + phase) * a.posAmp,
          seeds[o + 1] + Math.cos(t * a.posFreq * 0.9 + phase * 1.3) * a.posAmp,
          seeds[o + 2] + Math.sin(t * a.posFreq * 1.1 + phase * 0.7) * a.posAmp,
        );
        _aEuler.set(t * a.rotFreq + phase, t * a.rotFreq * 0.8, 0);
        _aQuat.setFromEuler(_aEuler);
        _quat.set(seeds[o + 3], seeds[o + 4], seeds[o + 5], seeds[o + 6]).multiply(_aQuat);
        const s = seeds[o + 7] * (1 + a.scaleAmp * Math.sin(t * a.scaleFreq + phase));
        _scl.set(s, s, s);
        _m.compose(_pos, _quat, _scl);
        mesh.setMatrixAt(i, _m);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }

    function build() {
      if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }

      const geo = makeGeometry(primitive);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.1, vertexColors: true });
      mesh = new THREE.InstancedMesh(geo, mat, count);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      const color = new THREE.Color();
      for (let i = 0; i < count; i++) {
        // hue from position — purely so the cloud reads as volume, not a perf factor
        color.setHSL(0.55 + 0.12 * (seeds[i * 8 + 1] / FIELD), 0.5, 0.55);
        mesh.setColorAt(i, color);
      }
      setStaticMatrices();
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);

      const tris = geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
      document.getElementById('count').textContent = count.toLocaleString();
      document.getElementById('prim').textContent = primitive;
      document.getElementById('tris').textContent = (tris * count).toLocaleString();
      document.getElementById('calls').textContent = '1';
    }

    // ---- HUD buttons -----------------------------------------------------
    function makeButtons(groupId, items, current, label, onPick) {
      const group = document.getElementById(groupId);
      const buttons = new Map();
      for (const item of items) {
        const b = document.createElement('button');
        b.textContent = label(item);
        b.onclick = () => {
          onPick(item);
          for (const [val, btn] of buttons) btn.classList.toggle('active', val === item);
        };
        if (item === current) b.classList.add('active');
        group.appendChild(b);
        buttons.set(item, b);
      }
    }
    makeButtons('count-group', COUNTS, count, c => (c >= 1000000 ? '1M' : (c / 1000) + 'k'),
      c => { count = c; build(); });
    makeButtons('prim-group', PRIMITIVES, primitive, p => p,
      p => { primitive = p; build(); });

    // Animate Tesserae toggle — flips per-frame CPU animation on/off.
    (function motionToggle() {
      const b = document.createElement('button');
      const sync = () => {
        b.textContent = animate ? 'animate: on' : 'animate: off';
        b.classList.toggle('active', animate);
        document.getElementById('motion').textContent = animate ? 'animated' : 'static';
      };
      b.onclick = () => {
        animate = !animate;
        if (!animate && mesh) setStaticMatrices();   // restore base pose
        sync();
      };
      sync();
      document.getElementById('motion-group').appendChild(b);
    })();

    // ---- GPU label -------------------------------------------------------
    (function gpuInfo() {
      try {
        const gl = renderer.getContext();
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        const name = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        document.getElementById('gpu').textContent = name || 'unknown GPU';
      } catch (e) { document.getElementById('gpu').textContent = 'GPU info unavailable'; }
    })();

    // ---- loop ------------------------------------------------------------
    const fpsEl = document.getElementById('fps');
    const msEl = document.getElementById('ms');
    let last = performance.now(), acc = 0, frames = 0, smoothed = 0;

    function tick(now) {
      const dt = now - last; last = now;
      acc += dt; frames++;
      if (acc >= 250) {
        const fps = (frames * 1000) / acc;
        smoothed = smoothed ? smoothed * 0.7 + fps * 0.3 : fps;
        fpsEl.textContent = smoothed.toFixed(0);
        msEl.textContent = (acc / frames).toFixed(1) + ' ms';
        fpsEl.className = 'v ' + (smoothed >= 50 ? 'fps-good' : smoothed >= 30 ? 'fps-mid' : 'fps-bad');
        acc = 0; frames = 0;
      }
      // per-instance animation (CPU) — the cost we want to measure
      if (animate && mesh) animateMatrices(now * 0.001);

      // gentle model spin so the full instance set is re-rasterized every frame;
      // OrbitControls handles the camera (drag/zoom/pan) plus a slow auto-orbit
      if (mesh) mesh.rotation.y = now * 0.00005;
      controls.update();

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); controls.update();
    });

    build();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
