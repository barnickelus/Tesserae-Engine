<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Tesserae · VibeMesh</title>
<style>
:root{--cy:#00e5ff;--mg:#ff3ea5;--gr:#22e08a;--am:#ffb300;--d1:#7a8593;--d2:#454e5a;--bg:#07080c;
  --mono:'SF Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 30%,#141822 0%,var(--bg) 70%);
  color:#e6ebf2;font-family:var(--mono);position:fixed;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#flat{position:fixed;inset:0;display:none;place-items:center;z-index:8;pointer-events:none}
#flat.on{display:grid}
#flat canvas{max-width:min(90vw,460px);max-height:56vh}
.glyph{font-size:clamp(84px,26vw,200px);filter:drop-shadow(0 0 40px rgba(0,229,255,.2))}
.tpane{width:min(90vw,420px);background:rgba(12,15,22,.86);border:1px solid rgba(0,229,255,.22);
  border-radius:16px;padding:20px;font-size:.78rem;line-height:1.75}
.tpane .w{color:var(--cy);font-size:.52rem;letter-spacing:2.5px;text-transform:uppercase}
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;
  align-items:flex-start;padding:11px 15px;font-size:.53rem;letter-spacing:2px;
  text-transform:uppercase;pointer-events:none}
.bar .bd{color:var(--cy);font-weight:700}
.bar .bd i{color:#fff;font-style:normal}
.bar .bd s{display:block;color:var(--d2);font-size:.45rem;letter-spacing:3.5px;
  margin-top:3px;text-decoration:none}
.bar .tm{color:var(--d2);text-align:right;line-height:1.85}
.bar .tm b{color:var(--cy);font-weight:600}
.bar .tm .g{color:var(--gr)}.bar .tm .a{color:var(--am)}
.ladder{position:fixed;top:66px;left:0;right:0;z-index:29;display:flex;gap:4px;
  justify-content:center;pointer-events:none}
.rg{padding:4px 9px;border-radius:12px;font-size:.46rem;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--d2);border:1px solid rgba(255,255,255,.05);transition:.35s}
.rg.on{color:var(--cy);border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.1);
  box-shadow:0 0 16px rgba(0,229,255,.14)}
.rg.pv{color:var(--d1)}
#insp{position:fixed;left:15px;top:96px;z-index:20;font-size:.48rem;letter-spacing:.4px;
  color:var(--d1);line-height:1.8;pointer-events:none;max-width:62vw}
#insp b{color:var(--gr)}#insp .hx{color:#6da8ff;word-break:break-all;display:block;opacity:.75}
#card{position:fixed;left:15px;top:auto;bottom:calc(206px + env(safe-area-inset-bottom));z-index:20;
  display:none;font-size:.48rem;letter-spacing:.4px;color:#94a3b4;line-height:1.85;
  background:rgba(10,13,20,.72);border:1px solid rgba(0,229,255,.16);border-radius:11px;
  padding:9px 12px;pointer-events:none;max-width:56vw}
#card b{color:var(--cy);letter-spacing:2px}#card u{color:var(--gr);text-decoration:none}
.bub{position:fixed;right:15px;bottom:calc(206px + env(safe-area-inset-bottom));z-index:20;
  max-width:56vw;background:rgba(12,15,22,.86);border:1px solid rgba(34,224,138,.28);
  border-radius:13px;padding:10px 13px;font-size:.66rem;line-height:1.55;color:#d8f5e8;
  opacity:0;transition:opacity .3s;pointer-events:none}
.bub.on{opacity:1}
.bub .w{color:var(--gr);font-size:.46rem;letter-spacing:2px;text-transform:uppercase;
  display:block;margin-bottom:3px}
.dock{position:fixed;bottom:0;left:0;right:0;z-index:30;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(7,8,12,.9) 28%);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:9px 13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:9px;color:#9aa6b4;font-family:var(--mono);font-size:.57rem;letter-spacing:1.4px;
  text-transform:uppercase;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.on{background:rgba(0,229,255,.13);border-color:var(--cy);color:var(--cy)}
.btn.go{background:rgba(34,224,138,.12);border-color:var(--gr);color:var(--gr)}
.btn:disabled{opacity:.25;pointer-events:none}
.btn.p{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(255,62,165,.14));
  border-color:var(--cy);color:#fff}
.pl{padding:6px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:18px;color:var(--d2);font-family:var(--mono);font-size:.5rem;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;transition:.15s}
.pl.on{background:rgba(0,229,255,.11);border-color:rgba(0,229,255,.42);color:var(--cy)}
.sep{width:9px;height:1px}
.cl{max-height:0;overflow:hidden;transition:max-height .32s ease}
.cl.op{max-height:300px}
#shapep.op{max-height:270px;overflow-y:auto}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media(max-width:540px){.sg{grid-template-columns:1fr}}
.sl{display:flex;align-items:center;gap:8px}
.sl label{font-size:.47rem;letter-spacing:1px;text-transform:uppercase;color:var(--d2);min-width:70px}
.sl input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:rgba(255,255,255,.14);
  border-radius:2px;cursor:pointer}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.sl input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
  background:var(--cy);border:none}
.sl .v{font-size:.5rem;color:var(--cy);min-width:42px;text-align:right}
.ck{display:flex;align-items:center;gap:5px;font-size:.47rem;letter-spacing:1px;
  text-transform:uppercase;color:var(--d2);cursor:pointer}
.chat{display:flex;gap:5px}
.chat input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:9px;color:#fff;font-family:var(--mono);font-size:.66rem;padding:9px 12px;outline:none}
.chat input:focus{border-color:rgba(0,229,255,.45)}
.pip{position:fixed;right:14px;z-index:31;width:58px;height:76px;border-radius:9px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);opacity:.5;
  bottom:calc(268px + env(safe-area-inset-bottom));transition:opacity .3s}
.pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.hint{position:fixed;left:0;right:0;bottom:calc(190px + env(safe-area-inset-bottom));text-align:center;
  font-size:.5rem;letter-spacing:1.4px;color:var(--am);z-index:22;pointer-events:none;opacity:0;
  transition:opacity .3s;text-transform:uppercase}
.hint.on{opacity:.9}
</style>
</head>

<div id="flat"></div>

    <div class="sg">
      <div class="sl"><label>Bandwidth</label><input type="range" id="s-bw" min="5" max="2000" step="5" value="900"><span class="v" id="v-bw">900k</span></div>
      <div class="sl"><label>RTT</label><input type="range" id="s-rtt" min="20" max="900" step="10" value="40"><span class="v" id="v-rtt">40ms</span></div>

</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
'use strict';
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as TK from './lib/tessera-kit.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Colour management is ON. VibeMesh was written against three r134, which
// had none: its colours — HSL picked from camera pixels, i.e. sRGB values —
// went to the shader as if they were linear light, so everything read pale
// and a dark-haired user got silver hair. Now every colour it generates is
// converted from sRGB where it's made, and the photo bake (§8b) writes linear
// albedo, so the tiles average light the way the optical language asks.
//
// The room rig's tone curve is Khronos PBR Neutral (three ships it from r162
// as NeutralToneMapping; r160 takes it as the custom curve). A likeness is
// judged against a camera, and Neutral passes base colours through as they
// are up to ~0.8, only rolling the highlights off — AgX, the mosaic page's
// curve, desaturates, and turned camera-true skin grey.
THREE.ShaderChunk.tonemapping_pars_fragment=THREE.ShaderChunk.tonemapping_pars_fragment.replace(
  'vec3 CustomToneMapping( vec3 color ) { return color; }',
  `vec3 CustomToneMapping( vec3 color ) {
	const float StartCompression = 0.8 - 0.04;
	const float Desaturation = 0.15;
	color *= toneMappingExposure;
	float x = min( color.r, min( color.g, color.b ) );
	float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;
	color -= offset;
	float peak = max( color.r, max( color.g, color.b ) );
	if ( peak < StartCompression ) return color;
	float d = 1. - StartCompression;
	float newPeak = 1. - d * d / ( peak + d - StartCompression );
	color *= newPeak / peak;
	float g = 1. - 1. / ( Desaturation * ( peak - newPeak ) + 1. );
	return mix( color, vec3( newPeak ), g );
}`);
/* ═══════════════════════════════════════════════════════════════════════
   VIBEMESH — semantic-compression presence.

   Wire carries meaning, not pixels: ~10–25 byte AvatarState packets
   (head pose, blendshapes, gaze, gestures, emotion, text, prosody).
   Each peer renders the other at a deterministically negotiated tier:
   TEXT → GLYPH → SPRITE → PUPPET → AVATAR3D.

   AVATAR3D is a self-generating parametric human:
     · a base humanoid head is GENERATED as a real polygon mesh from a
       sculpt of anatomical feature fields (brow, sockets, nose, lips,
       cheeks, jaw) over an ellipsoid — clean topology, smooth normals,
       true apertures for eyes and mouth;
     · it is RIGGED — skeleton (root/neck/head/jaw/eyes) with skin
       weights, plus 8 generated blendshapes — so it is puppeted, not
       animated frame-by-frame;
     · likeness is EARNED IN TWO STAGES: broad measured ratios reshape
       the generator, then a gaussian RBF warp interpolates the base
       exactly onto the measured landmark cloud. Smooth by construction,
       so it can refine toward the person instead of falling apart.
   ═══════════════════════════════════════════════════════════════════════ */

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cl01=v=>v<0?0:v>1?1:v;
const smoothstep=(a,b,x)=>{const t=cl01((x-a)/(b-a||1e-9));return t*t*(3-2*t);};
const mix=(a,b,t)=>a+(b-a)*t;
const srgb2lin=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
const lin2srgb=c=>c<=0.0031308?c*12.92:1.055*Math.pow(Math.max(0,c),1/2.4)-0.055;

/* ═══ §1 PROTOCOL ═════════════════════════════════════════════════════ */
const Tier={TEXT:1,GLYPH:2,SPRITE:3,PUPPET:4,AVATAR3D:5};
const TN={1:'TEXT',2:'GLYPH',3:'SPRITE',4:'PUPPET',5:'AVATAR3D'};
const HZ={1:2,2:4,3:10,4:15,5:20};
const BS=['jawOpen','smile','frown','browUp','browDown','blinkL','blinkR','pucker','funnel','press','wide'];   // funnel/press/wide: the lips' O, M and E

// Pure + deterministic: both peers compute the same tier from the same
// exchanged profiles, so no coordinator is needed.
function negotiate(L,R){
  const bw=Math.min(L.bw,R.bw), bat=Math.min(L.bat,R.bat), rtt=Math.max(L.rtt,R.rtt);
  const low=L.low||R.low;
  let cap=Tier.AVATAR3D;
  if(bw<10) cap=Tier.TEXT;
  else if(bw<30||low) cap=Tier.GLYPH;
  else if(bw<80||bat<15) cap=Tier.SPRITE;
  else if(bw<250||bat<30||rtt>400) cap=Tier.PUPPET;
  return {send:Math.min(L.maxSend,R.maxRender,cap), recv:Math.min(R.maxSend,L.maxRender,cap)};
}
function localProfile(){
  const cores=navigator.hardwareConcurrency||4, mem=navigator.deviceMemory||4;
  const cls=(cores>=8&&mem>=6)?3:(cores>=4?2:1), c=navigator.connection||{};
  return {maxSend:Tier.AVATAR3D, maxRender:cls===1?Tier.PUPPET:Tier.AVATAR3D,
    bw:c.downlink?Math.round(c.downlink*1000):900, rtt:c.rtt||40, bat:90,
    low:!!c.saveData, cls, loss:0};
}

/* Binary AvatarState. TEXT/GLYPH 10 B · SPRITE 13 B · PUPPET+ 23 B.
   AVATAR3D costs no more wire than PUPPET — fidelity is render-side. */
const q8=v=>clamp(Math.round(v*127),-127,127), qu=v=>clamp(Math.round(v*255),0,255);
function encode(s,tier,seq){
  const tb=s.textDirty&&s.text?new TextEncoder().encode(s.text):null, pr=s.pros;
  const n=10+(tier>=3?3:0)+(tier>=4?10:0)+(pr?2:0)+(tb?2+tb.length:0);
  const b=new Uint8Array(n), d=new DataView(b.buffer);
  b[0]=0x56;b[1]=0x4d;b[2]=4;b[3]=tier; d.setUint16(4,seq&0xffff,true);
  b[6]=(s.speaking?1:0)|(tb?2:0)|((s.gest&0xf)<<2)|(pr?64:0);
  b[7]=q8(s.val)&0xff; b[8]=qu(s.aro); b[9]=qu(s.dom);
  let o=10;
  if(tier>=3){b[o++]=q8(s.yaw/90)&0xff;b[o++]=q8(s.pitch/90)&0xff;b[o++]=q8(s.roll/90)&0xff;}
  if(tier>=4){for(const k of BS)b[o++]=qu(s.bs[k]||0);b[o++]=q8(s.gx)&0xff;b[o++]=q8(s.gy)&0xff;}
  if(pr){b[o++]=qu(pr.pitch);b[o++]=qu(pr.energy);}
  if(tb){d.setUint16(o,tb.length,true);o+=2;b.set(tb,o);}
  return b;
}
function decode(b){
  if(b[0]!==0x56||b[1]!==0x4d)return null;
  const d=new DataView(b.buffer,b.byteOffset,b.byteLength), tier=b[3], f=b[6];
  const s={tier,seq:d.getUint16(4,true),speaking:!!(f&1),gest:(f>>2)&0xf,
    val:(b[7]<<24>>24)/127,aro:b[8]/255,dom:b[9]/255,
    yaw:0,pitch:0,roll:0,bs:{},gx:0,gy:0,text:null,pros:null};
  let o=10;
  if(tier>=3){s.yaw=(b[o++]<<24>>24)/127*90;s.pitch=(b[o++]<<24>>24)/127*90;s.roll=(b[o++]<<24>>24)/127*90;}
  if(tier>=4){for(const k of BS)s.bs[k]=b[o++]/255;s.gx=(b[o++]<<24>>24)/127;s.gy=(b[o++]<<24>>24)/127;}
  if(f&64)s.pros={pitch:b[o++]/255,energy:b[o++]/255};
  if(f&2){const l=d.getUint16(o,true);o+=2;s.text=new TextDecoder().decode(b.subarray(o,o+l));}
  return s;
}

/* ═══ §2 TRANSPORT — two tabs pair as peers; solo loops back ═══════════ */
const NET={ch:null,peer:null,peerProf:null,seen:0,id:Math.random().toString(36).slice(2,8),
  tx:0,bucket:3000,last:performance.now(),kbps:0};
const PROF={me:localProfile()};
let AGREED=negotiate(PROF.me,PROF.me);

function netInit(){
  try{NET.ch=new BroadcastChannel('vibemesh-v4');}catch(_){return;}
  NET.ch.onmessage=e=>{
    const m=e.data; if(!m||m.from===NET.id)return;
    if(m.t==='hi'||m.t==='prof'){
      const fresh=NET.peer!==m.from;
      NET.peer=m.from; NET.peerProf=m.prof; NET.seen=performance.now();
      if(m.t==='hi')meta('prof');
      if(fresh){hint('Peer linked · negotiating');sendIdentity();}
      renegotiate();
    } else if(m.t==='id'&&m.from===NET.peer){ applyIdentity(m.id); }
    else if(m.t==='pk'&&m.from===NET.peer){ NET.seen=performance.now(); impair(new Uint8Array(m.b),onPacket); }
    else if(m.t==='bye'&&m.from===NET.peer){ NET.peer=null;NET.peerProf=null;renegotiate(); }
  };
  meta('hi');
  setInterval(()=>{ if(NET.peer&&performance.now()-NET.seen>5000){
    NET.peer=null;NET.peerProf=null;renegotiate();hint('Peer lost · loopback');} },2000);
  addEventListener('beforeunload',()=>meta('bye'));
}
const meta=t=>{ if(NET.ch)NET.ch.postMessage({t,from:NET.id,prof:PROF.me}); };

// Receive-side impairment: loss, bandwidth token bucket, latency + jitter.
function impair(b,deliver){
  const p=PROF.me;
  if(Math.random()*100<p.loss)return;
  const now=performance.now();
  NET.bucket=Math.min(9000,NET.bucket+(now-NET.last)*p.bw/8); NET.last=now;
  if(NET.bucket<b.length)return;
  NET.bucket-=b.length;
  setTimeout(()=>deliver(b), p.rtt/2+Math.random()*p.rtt*0.15);
}
let lastTx=null;
function tx(b){
  NET.tx+=b.length; lastTx=b;
  if(NET.ch&&NET.peer) NET.ch.postMessage({t:'pk',from:NET.id,
    b:b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength)});
  else impair(b,onPacket);
}
function renegotiate(){
  AGREED=negotiate(PROF.me,NET.peerProf||PROF.me);
  el('t-tx').textContent=TN[AGREED.send]; el('t-rx').textContent=TN[AGREED.recv];
  el('t-lk').textContent=NET.peer?'PAIRED':'SOLO';
  el('t-lk').className=NET.peer?'g':'a';
  document.querySelectorAll('#ladder .rg').forEach(r=>{
    const t=+r.dataset.t; r.className='rg'+(t===AGREED.recv?' on':(t<AGREED.recv?' pv':''));});
  setRenderer(AGREED.recv);
}
const el=id=>document.getElementById(id);

/* ═══ §3 ANATOMY — canonical head space ═══════════════════════════════
   Metres. Eye line y=0, +z forward, crown +0.115, chin −0.115.
   Proportions follow standard anthropometry (eye line at half head
   height, nose base 0.72H from crown, mouth 0.82H, IOD 0.28H).       */
const AN={
  A:0.0770, B:0.1150, C:0.0870, CZ:-0.0120,   // base ellipsoid + z offset
  eyeX:0.0322, mouthY:-0.0736, noseBase:-0.0500, noseTip:-0.0320,
  browY:0.0210, chinY:-0.1150, IOD:0.0644,
};
const DEFAULT_SHAPE={headW:1,headD:1,faceLen:1,jawW:1,jawTaper:1,chinProj:1,
  noseLen:1,noseW:1,noseProj:1,eyeSpacing:1,eyeSize:1,mouthW:1,lipFull:1,
  browHeight:1,browProm:1,cheekProm:1,
  // bone architecture
  zygoProm:1,goniProm:1,tempHollow:0.85,orbitRim:1,
  // fat compartments (0.5 = neutral fill)
  fatMalar:0.5,fatBuccal:0.5,fatJowl:0.5,fatInfraorb:0.5,
  fatNasolab:0.5,fatTemporal:0.5,fatSubmental:0.5,
  // fascia — retaining-ligament creases
  foldNasolab:0.45,foldTear:0.40,foldMarion:0.28,foldMand:0.35};

// Reference ratios of an average face (IOD-normalised), used to turn
// measurements into generator parameters.
const REF={faceW:2.32,faceH:3.30,jawW:1.86,noseL:1.06,noseW:0.78,
  mouthW:0.78,lipH:0.42,browRise:0.33,chinDrop:1.79,mouthDrop:1.14,noseProj:0.42,
  templeW:2.22};

function measToShape(m){
  if(!m)return {...DEFAULT_SHAPE};
  const r=(k,lo,hi)=>m[k]!=null&&isFinite(m[k])?clamp(m[k]/REF[k],lo,hi):1;
  const safe=(v,d)=>(v!=null&&isFinite(v)&&v>1e-6)?v:d;
  // Adiposity and bone prominence are inferred, not measured directly:
  // a rounder outline with a wide jaw carries more soft tissue, while
  // hollow temples relative to the cheekbones expose the skeleton.
  const fW=safe(m.faceW,REF.faceW), fH=safe(m.faceH,REF.faceH);
  const rw=fW/fH, jw=safe(m.jawW,REF.jawW)/fW, tw=safe(m.templeW,REF.templeW)/fW;
  const adip=cl01(0.5+((rw-0.703)/0.10)*0.42+((jw-0.802)/0.10)*0.33);
  const bone=cl01(0.5+((0.957-tw)/0.08)*0.35+(0.5-adip)*0.45);
  return {
    headW:r('faceW',.80,1.22), headD:1, faceLen:r('chinDrop',.85,1.18),
    jawW:r('jawW',.82,1.20), jawTaper:clamp(2-r('jawW',.82,1.2),.8,1.2), chinProj:1,
    noseLen:r('noseL',.78,1.28), noseW:r('noseW',.78,1.30), noseProj:r('noseProj',.7,1.4),
    eyeSpacing:1, eyeSize:1, mouthW:r('mouthW',.80,1.25), lipFull:r('lipH',.70,1.45),
    browHeight:r('browRise',.80,1.25), browProm:1, cheekProm:1,
    // bone: fat veils the skeleton, so prominence nets the two
    zygoProm:0.55+bone*0.95-adip*0.30, goniProm:0.50+bone*0.90,
    tempHollow:0.30+(1-adip)*1.10, orbitRim:0.45+bone*0.85,
    // fat compartments
    fatMalar:cl01(0.30+adip*0.80), fatBuccal:cl01(0.25+adip*0.95),
    fatJowl:cl01(Math.max(0,adip-0.42)*1.55), fatInfraorb:cl01(0.35+adip*0.55),
    fatNasolab:cl01(0.30+adip*0.75), fatTemporal:cl01(0.28+adip*0.85),
    fatSubmental:cl01(Math.max(0,adip-0.46)*1.50),
    // fascia: folds deepen where full compartments abut tethered skin,
    // and the tear trough deepens as infraorbital fat is lost
    foldNasolab:cl01(0.28+Math.max(0,adip-0.38)*1.30),
    foldTear:cl01(0.62-adip*0.55),
    foldMarion:cl01(Math.max(0,adip-0.44)*1.20),
    foldMand:cl01(0.22+adip*0.55),
    _adip:adip, _bone:bone,
  };
}

/* ═══ §4 GENERATOR — build the humanoid head as a real mesh ═══════════
   A sphere-topology grid is displaced by anatomical feature fields.
   Everything is analytic, so anchors, region masks, skin weights and
   blendshapes all fall out of the same parameterisation.            */

// Anisotropic 3D blob and a capsule-shaped ridge — the two primitives
// the bone/fat/fascia layers are written in.
const g3=(px,py,pz,cx,cy,cz,rx,ry,rz)=>
  Math.exp(-(((px-cx)/rx)**2+((py-cy)/ry)**2+((pz-cz)/rz)**2));
const ridgeF=(px,py,pz,ax,ay,az,bx,by,bz,r)=>{
  const dx=bx-ax,dy=by-ay,dz=bz-az;
  const t=cl01(((px-ax)*dx+(py-ay)*dy+(pz-az)*dz)/(dx*dx+dy*dy+dz*dz||1e-9));
  const qx=px-(ax+dx*t),qy=py-(ay+dy*t),qz=pz-(az+dz*t);
  return Math.exp(-((qx*qx+qy*qy+qz*qz)/(r*r)));
};

// Non-uniform sampling: spend vertices where the face is.
function cdfRemap(n,dens){
  const N=256, d=new Float64Array(N+1), c=new Float64Array(N+1);
  for(let i=0;i<=N;i++)d[i]=dens(i/N);
  for(let i=1;i<=N;i++)c[i]=c[i-1]+(d[i]+d[i-1])/2;
  const T=c[N], out=new Float64Array(n+1);
  for(let k=0;k<=n;k++){
    const want=T*k/n; let lo=0,hi=N;
    while(lo<hi-1){const md=(lo+hi)>>1; if(c[md]<want)lo=md;else hi=md;}
    const seg=c[hi]-c[lo]||1e-12;
    out[k]=(lo+(want-c[lo])/seg)/N;
  }
  return out;
}

// One source of truth for the sculpt: the same analytic function that
// builds the mesh also evaluates single points, so the fitter can
// MEASURE the model cheaply instead of rebuilding it every iteration.
const g2=(dx,rx,dy,ry)=>Math.exp(-((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)));

function derived(S){
  const A=AN.A*S.headW, B=AN.B, C=AN.C*S.headD, CZ=AN.CZ;
  const EY=AN.eyeX*S.eyeSpacing;
  const FL=S.faceLen;
  const MY=AN.mouthY*FL, NBY=AN.noseBase*FL, NTY=AN.noseTip*FL*S.noseLen;
  const BY=AN.browY*S.browHeight, CHY=AN.chinY*FL;
  const LW=0.0245*S.mouthW;
  return {A,B,C,CZ,EY,FL,MY,NBY,NTY,BY,CHY,LW,S};
}

// out: [x,y,z, frontness, lipMask, browMask, anatRelief]
function sculptPoint(th,phi,S,P,out){
  const {A,B,C,CZ,EY,FL,MY,NBY,NTY,BY,CHY,LW}=P;
  const sp=Math.sin(phi), cp=Math.cos(phi);
      const xd=sp*Math.sin(th), yd=cp, zd=sp*Math.cos(th);
      let x=A*xd, y=B*yd, z=CZ+C*zd;
      if(y<0)y*=FL;                                  // face length below eye line
      const f=smoothstep(0.02,0.46,zd);              // frontness

      // ── mandible: taper the lower face, pull the back of the jaw in ──
      const tj=cl01((-0.015-y)/0.098);
      const tp=Math.pow(tj,1.35);
      x*=(1-0.40*tp*S.jawTaper)*(1+(S.jawW-1)*tp*1.1);
      if(zd<0) z+=0.034*Math.pow(tj,1.55)*(-zd);
      // neck-ward tuck under the chin
      z+=0.012*cl01((CHY+0.028-y)/0.03)*(zd<0?-zd:0);

      let dx=0,dy=0,dz=0;

      // ── brow ridge + glabella ──
      dz+=0.0088*S.browProm*f*g2(x,0.052,y-BY,0.0140);
      dz-=0.0024*f*g2(x,0.0130,y-(BY-0.008),0.0100);
      // ── eye sockets ──
      for(const sx of[1,-1]) dz-=0.0108*f*g2(x-sx*EY,0.0265,y-0.0010,0.0175);
      // ── nose: bridge → tip → wings → nostril shadow ──
      {
        const yN=BY-0.012;
        if(y<yN+0.02&&y>NBY-0.03){
          const t=(yN-y)/Math.max(1e-4,(yN-NTY));
          let prof=0;
          if(t>0&&t<=1) prof=0.30+0.70*Math.pow(t,1.6);
          else if(t>1) prof=Math.max(0,1-(t-1)*2.0);
          const wx=0.0108*S.noseW*(0.55+0.60*cl01(t));
          dz+=0.0190*S.noseProj*prof*f*Math.exp(-(x*x)/(wx*wx));
        }
        dz+=0.0060*S.noseProj*f*g2(x,0.0118,y-(NTY-0.0015),0.0092);   // tip ball
        for(const sx of[1,-1]){
          dz+=0.0082*S.noseW*f*g2(x-sx*0.0168*S.noseW,0.0092,y-(NBY+0.004),0.0078);
          dz-=0.0044*f*g2(x-sx*0.0134*S.noseW,0.0062,y-(NBY-0.0012),0.0040);
        }
        dz-=0.0022*f*g2(x,0.0140,y-(NBY-0.008),0.0060);   // under-nose recess
      }
      // nose widens laterally, not only forward, so nose width is real
      if(y<BY&&y>NBY-0.03){
        const nm=Math.exp(-(((y-(NTY+0.006))/0.030)**2))*Math.exp(-((x/0.024)**2))*f;
        dx+=Math.sign(x||1e-9)*0.0060*(S.noseW-1)*nm;
      }
      // ── lips ──
      const lipU=g2(x,LW*1.06,y-(MY+0.0075),0.0078), lipL=g2(x,LW*0.96,y-(MY-0.0108),0.0092);
      dz+=0.0062*S.lipFull*f*lipU + 0.0074*S.lipFull*f*lipL;
      dz-=0.0044*f*g2(x,LW*1.18,y-MY,0.0032);
      // fuller lips are taller as well as more protruding
      dy+=Math.sign(y-MY||1e-9)*0.0075*(S.lipFull-1)*f*g2(x,LW*1.10,y-MY,0.0135);
      dz-=0.0019*f*g2(x,0.0046,y-(MY+0.019),0.0100);      // philtrum
      for(const sx of[1,-1]) dz-=0.0031*f*g2(x-sx*LW*1.02,0.0082,y-MY,0.0082);
      // ── chin + mentolabial crease ──
      dz+=0.0078*S.chinProj*f*g2(x,0.0265,y-(CHY+0.0225),0.0265);
      dz-=0.0032*f*g2(x,0.0225,y-(MY-0.0265),0.0078);
      // ── cheekbones, hollows, temples ──
      for(const sx of[1,-1]){
        const gk=g2(x-sx*0.048*S.headW,0.0300,y+0.0040,0.0220);
        dz+=0.0056*S.cheekProm*f*gk; dx+=sx*0.0030*S.cheekProm*gk;
        dz-=0.0040*f*g2(x-sx*0.0440*S.headW,0.0240,y+0.0480,0.0200);
        dx-=sx*0.0038*g2(x-sx*0.0660*S.headW,0.0180,y-0.0400,0.0260);
      }
      // ── brow hair: two arches, gap at the glabella, proud of the skin ──
      const ax=Math.abs(x);
      const browLine=BY+0.0030+0.0042*Math.sin(cl01((ax-0.010)/0.042)*Math.PI);
      const browM=f*Math.exp(-(((ax-0.0315)/0.0185)**2))*Math.exp(-(((y-browLine)/0.0060)**2));
      dz+=0.0018*browM;

      // ═══ ANATOMICAL LAYERS ═══════════════════════════════════
      // Bone sets the architecture, fat compartments set the softness,
      // and the retaining ligaments between them read as fascia. These
      // displace along the outward radial direction so they work on the
      // sides of the head too, where the frontal features fade out.
      let dr=0;
      if(z>-0.030){
        for(const sx of[1,-1]){
          // — bone —
          dr+=0.0040*S.zygoProm*ridgeF(x,y,z, sx*0.045,-0.004,0.047, sx*0.070,0.005,-0.013, 0.0115);
          dr+=0.0030*S.goniProm*g3(x,y,z, sx*0.055,-0.074,-0.006, 0.015,0.017,0.021);
          dr+=0.0022*S.goniProm*ridgeF(x,y,z, sx*0.055,-0.074,-0.006, sx*0.050,-0.018,-0.026, 0.0100);
          dr-=0.0044*S.tempHollow*g3(x,y,z, sx*0.063,0.031,0.011, 0.019,0.025,0.028);
          dr+=0.0018*S.orbitRim*g3(x,y,z, sx*0.049,0.004,0.049, 0.010,0.017,0.016);
          dr-=0.0016*S.orbitRim*g3(x,y,z, sx*0.033,-0.017,0.053, 0.018,0.008,0.016);
          // — fat compartments (0.5 neutral) —
          dr+=0.0052*(S.fatMalar-0.5)*2*g3(x,y,z, sx*0.044,-0.013,0.047, 0.026,0.022,0.028);
          dr+=0.0046*(S.fatBuccal-0.5)*2*g3(x,y,z, sx*0.051,-0.049,0.027, 0.022,0.025,0.026);
          dr+=0.0044*S.fatJowl*g3(x,y,z, sx*0.049,-0.082,0.019, 0.020,0.017,0.024);
          dr+=0.0030*(S.fatInfraorb-0.5)*2*g3(x,y,z, sx*0.032,-0.020,0.051, 0.020,0.012,0.020);
          dr+=0.0032*(S.fatNasolab-0.5)*2*g3(x,y,z, sx*0.026,-0.047,0.049, 0.016,0.018,0.018);
          dr+=0.0034*(S.fatTemporal-0.5)*2*g3(x,y,z, sx*0.063,0.030,0.012, 0.020,0.024,0.026);
          // — fascia: creases where ligaments tether skin to bone —
          dr-=0.0030*S.foldNasolab*ridgeF(x,y,z, sx*0.018,-0.047,0.056, sx*0.029,-0.073,0.046, 0.0058);
          dr-=0.0024*S.foldTear*ridgeF(x,y,z, sx*0.021,-0.016,0.054, sx*0.039,-0.021,0.048, 0.0055);
          dr-=0.0022*S.foldMarion*ridgeF(x,y,z, sx*0.027,-0.080,0.045, sx*0.031,-0.097,0.036, 0.0058);
          dr-=0.0018*S.foldMand*g3(x,y,z, sx*0.037,-0.098,0.030, 0.008,0.008,0.012);
        }
        dr+=0.0034*S.fatSubmental*g3(x,y,z, 0,-0.110,0.011, 0.030,0.016,0.026);
      }
      const rl=Math.hypot(xd,yd,zd)||1;
      dx+=xd/rl*dr; dy+=yd/rl*dr; dz+=zd/rl*dr;

      x+=dx; y+=dy; z+=dz;
  out[0]=x; out[1]=y; out[2]=z; out[3]=f;
  out[4]=lipU+lipL; out[5]=browM; out[6]=dr;
  return out;
}

function buildHead(S, opts){
  const NA=opts.NA, NP=opts.NP;
  // azimuth: density peaks at u=0.5 so the face is dense, and the wrap
  // seam (u=0) lands on the back of the head instead of down the nose
  const uMap=cdfRemap(NA,u=>1+2.8*Math.exp(-((u-0.5)**2)/(0.10*0.10)));
  // polar: φ=0 crown, φ=π chin — concentrate over the face band
  const vMap=cdfRemap(NP,v=>1+2.4*Math.exp(-((v-0.62)**2)/(0.052))
    +1.1*Math.exp(-((v-0.44)**2)/(0.016))+1.9*Math.exp(-((v-0.50)**2)/(0.0035)));

  const P=derived(S);
  const {A,B,C,CZ,EY,FL,MY,NBY,NTY,BY,CHY,LW}=P;
  const SP=new Float32Array(8);

  const nv=(NA+1)*(NP+1);
  const pos=new Float32Array(nv*3), canon=new Float32Array(nv*3);
  const front=new Float32Array(nv), region=new Float32Array(nv*4); // lip, brow, socket, beardable
  const anat=new Float32Array(nv);                                  // signed soft-tissue relief
  const thphi=new Float32Array(nv*2);                               // each vertex's surface parameters
  let vi=0;
  for(let iv=0;iv<=NP;iv++){
    const phi=Math.PI*vMap[iv], sp=Math.sin(phi), cp=Math.cos(phi);
    for(let iu=0;iu<=NA;iu++){
      const th=2*Math.PI*uMap[iu%NA]+(iu===NA?2*Math.PI:0)+Math.PI;
      thphi[vi*2]=th; thphi[vi*2+1]=phi;
      sculptPoint(th,phi,S,P,SP);
      const x=SP[0],y=SP[1],z=SP[2],f=SP[3];
      const dr=SP[6], lipU=SP[4], lipL=0, browM=SP[5];
      anat[vi]=dr;
      pos[vi*3]=x; pos[vi*3+1]=y; pos[vi*3+2]=z;
      canon[vi*3]=x; canon[vi*3+1]=y; canon[vi*3+2]=z;
      front[vi]=f;
      region[vi*4]=smoothstep(0.26,0.70,lipU)*f;                     // lips
      region[vi*4+1]=browM;                                          // brow hair
      region[vi*4+2]=f*Math.max(g2(x-EY,0.026,y-0.001,0.017),g2(x+EY,0.026,y-0.001,0.017));
      region[vi*4+3]=f*smoothstep(MY+0.030,MY-0.010,y);              // beard zone
      vi++;
    }
  }

  // ── apertures: real holes for the eyes and mouth ──────────────
  // Analytic ellipses. The grid is far too coarse to resolve a 31 mm
  // eye opening cleanly, so after cutting we project the rim vertices
  // onto the exact ellipse — the edge then reads as an eyelid at any
  // resolution instead of a staircase.
  const EAR=[0.0155*S.eyeSize, 0.0072*S.eyeSize], EYC=0.0008, CANT=0.10;
  const MAR=[LW*0.90, 0.0013];
  const eyeR2=(x,y,sx)=>{
    const dx=(x-sx*EY)/EAR[0], dy=(y-EYC)/EAR[1];
    const c=Math.cos(sx*CANT), s=Math.sin(sx*CANT);
    const rx=dx*c-dy*s, ry=dx*s+dy*c;
    return [rx*rx+ry*ry, rx, ry, c, s];
  };
  const eyeAp=(x,y)=>{ for(const sx of[1,-1]) if(eyeR2(x,y,sx)[0]<1) return true; return false; };
  // The slit is thinner than a grid row (1.3 mm against 2–4 mm), so testing
  // quad centres against it cut the mouth only when a row happened to land
  // on the line — on most heads it never did, the mouth stayed a closed
  // surface, and a dropped jaw stretched the chin instead of parting the
  // lips. Cut one row across the lip span: the row that straddles the line
  // at the face's centre column (chosen per column, the row shifted by one
  // where the sculpt tilts it, and a quad twisted across the opening).
  const idx=[], cut=[];
  const at=(iu,iv)=>iv*(NA+1)+iu, ivOf=i=>Math.floor(i/(NA+1));
  let MROW=-1;
  { const iuC=Math.round(NA/2);
    for(let iv=0;iv<NP;iv++){ if(canon[at(iuC,iv)*3+1]>=MY&&canon[at(iuC,iv+1)*3+1]<MY){ MROW=iv; break; } } }
  const mouthRow=(iv,cx)=>iv===MROW&&Math.abs(cx)<MAR[0]*0.985;
  // Centre that row on the line at every column before cutting: the sculpt
  // tilts rows a little across the lip span, and a rim projected onto the
  // slit from a tilted row crossed the next row and folded the lip (creases
  // on every fitted head). The shear fades over six rows either side and
  // past the corners.
  if(MROW>=0){ const K=6;
    for(let iu=0;iu<=NA;iu++){
      const a=at(iu,MROW), d=at(iu,MROW+1);
      const x=(canon[a*3]+canon[d*3])/2, delta=MY-(canon[a*3+1]+canon[d*3+1])/2;
      const wx=smoothstep(MAR[0]+0.016,MAR[0],Math.abs(x)); if(wx<=0) continue;
      for(let k=-K;k<=K+1;k++){ const iv=MROW+k; if(iv<0||iv>NP) continue;
        const w=(k<=0?1+k/K:1-(k-1)/K)*wx, i=at(iu,iv);
        canon[i*3+1]+=delta*w; pos[i*3+1]+=delta*w; } } }
  const inKept=new Uint8Array(nv), inCut=new Uint8Array(nv);
  for(let iv=0;iv<NP;iv++)for(let iu=0;iu<NA;iu++){
    const a=at(iu,iv),b=at(iu+1,iv),c=at(iu+1,iv+1),d=at(iu,iv+1);
    const cx=(canon[a*3]+canon[b*3]+canon[c*3]+canon[d*3])/4;
    const cy=(canon[a*3+1]+canon[b*3+1]+canon[c*3+1]+canon[d*3+1])/4;
    const cz=(canon[a*3+2]+canon[b*3+2]+canon[c*3+2]+canon[d*3+2])/4;
    if(cz>0.02&&(eyeAp(cx,cy)||mouthRow(iv,cx))){
      inCut[a]=inCut[b]=inCut[c]=inCut[d]=1; cut.push(a);
      continue;
    }
    inKept[a]=inKept[b]=inKept[c]=inKept[d]=1;
    // u runs toward +x, v runs toward −y, so (a,b,c) faces inward —
    // reverse it so normals and FrontSide culling point outward.
    idx.push(a,c,b, a,d,c);
  }
  // snap the rim ring onto the analytic aperture boundary (and keep each
  // rim's vertices: §8b sets them on the user's own contours)
  const rims={eyeP:[],eyeN:[],mouth:[]};
  for(let i=0;i<nv;i++){
    if(!(inKept[i]&&inCut[i])) continue;
    const x=canon[i*3], y=canon[i*3+1];
    const dL=Math.hypot(x-EY,y-EYC), dR=Math.hypot(x+EY,y-EYC), dM=Math.hypot(x,y-MY);
    (dM<Math.min(dL,dR)?rims.mouth:dL<dR?rims.eyeP:rims.eyeN).push(i);
    let nx=x, ny=y;
    if(dM<Math.min(dL,dR)){
      // straight down (or up) onto the slit: a radial projection in the
      // ellipse's own units, 17:1, had dragged a vertex 3 mm above the
      // line from 15 mm out to 6 mm and bunched the rim at the centre
      const dx=clamp(x/MAR[0],-1,1);
      nx=dx*MAR[0]; ny=MY+(ivOf(i)<=MROW?1:-1)*MAR[1]*Math.sqrt(1-dx*dx);   // the cut row's top edge is the upper lip's
    } else {
      const sx=dL<dR?1:-1;
      const [,rx,ry,c,s]=eyeR2(x,y,sx), r=Math.hypot(rx,ry);
      if(r>1e-9){
        const ux=rx/r, uy=ry/r;
        nx=sx*EY+(ux*c+uy*s)*EAR[0];
        ny=EYC+(-ux*s+uy*c)*EAR[1];
      }
    }
    pos[i*3]=nx; pos[i*3+1]=ny; canon[i*3]=nx; canon[i*3+1]=ny;
  }

  return {NA,NP,nv,pos,canon,front,region,anat,idx,thphi,rims,
    P:{A,B,C,CZ,EY,MY,NBY,NTY,BY,CHY,LW,FL,S}};
}

/* ── Anchors: semantic points shared by the mesh and MediaPipe ──
   Each is (landmark index, canonical x magnitude, y). The side is taken
   from the measured landmark itself, so mirroring can't scramble them. */
function anchorSpecs(P){
  const {EY,MY,NBY,NTY,BY,CHY,LW,A,S}=P;
  return [
    [4,0,NTY],[6,0,BY-0.020],[168,0,BY-0.008],[2,0,NBY],[1,0,NTY+0.006],
    [98,0.0170*S.noseW,NBY+0.002],[327,0.0170*S.noseW,NBY+0.002],
    [33,EY+0.0158*S.eyeSize,0.0005],[133,EY-0.0148*S.eyeSize,0.0012],
    [362,EY-0.0148*S.eyeSize,0.0012],[263,EY+0.0158*S.eyeSize,0.0005],
    [159,EY,0.0088],[145,EY,-0.0072],[386,EY,0.0088],[374,EY,-0.0072],
    [61,LW,MY],[291,LW,MY],[0,0,MY+0.0108*S.lipFull],[17,0,MY-0.0168*S.lipFull],
    [13,0,MY+0.0022],[14,0,MY-0.0026],
    [152,0,CHY+0.0045],[175,0,CHY+0.0165],
    [234,A*0.985,-0.0100],[454,A*0.985,-0.0100],
    [172,0.0500,-0.0755],[397,0.0500,-0.0755],
    [132,0.0625,-0.0455],[361,0.0625,-0.0455],
    [58,0.0405,-0.0950],[288,0.0405,-0.0950],
    [93,0.0700,-0.0300],[323,0.0700,-0.0300],
    [127,0.0715,0.0100],[356,0.0715,0.0100],
    [10,0,0.0760],[9,0,0.0430],
    [105,0.0300,BY+0.0040],[334,0.0300,BY+0.0040],
    [70,0.0500,BY-0.0010],[300,0.0500,BY-0.0010],
    [107,0.0125,BY+0.0025],[336,0.0125,BY+0.0025],
    [205,0.0450,-0.0300],[425,0.0450,-0.0300],
    [50,0.0520,-0.0125],[280,0.0520,-0.0125],
    [116,0.0620,-0.0200],[345,0.0620,-0.0200],
  ];
}
// Which side of the face each landmark lives on. toModel mirrors x, so a
// landmark on the subject's right lands at +x. Declaring this removes the
// ambiguity of generating both sides and letting a measurement collapse.
const LM_RIGHT=new Set([33,133,159,145,105,70,107,234,172,132,58,93,127,205,50,116,98,61]);
const LM_LEFT =new Set([263,362,386,374,334,300,336,454,397,361,288,323,356,425,280,345,327,291]);
const lmSide=lm=>LM_RIGHT.has(lm)?1:(LM_LEFT.has(lm)?-1:0);

// nearest frontmost vertex to a canonical (x,y)
function findAnchorVerts(H){
  const specs=anchorSpecs(H.P), out=[];
  for(const [lm,ax,ay] of specs){
    for(const sgn of (ax===0?[0]:[lmSide(lm)||1])){
      const tx=sgn*ax; let best=-1,bd=1e9;
      for(let i=0;i<H.nv;i++){
        if(H.front[i]<0.30)continue;
        const dx=H.canon[i*3]-tx, dy=H.canon[i*3+1]-ay;
        const d=dx*dx*1.0+dy*dy*1.35;
        if(d<bd){bd=d;best=i;}
      }
      if(best>=0) out.push({lm,side:sgn,vi:best});
    }
  }
  return out;
}

/* ── RBF warp: interpolate the base mesh onto the measured landmarks ──
   Gaussian kernel, ridge-regularised, no polynomial term — so the warp
   decays to zero away from the face and the skull stays generic.     */
function solveRBF(src,dst,sigma,lam){
  const n=src.length, K=[];
  for(let i=0;i<n;i++){
    const row=new Float64Array(n+3);
    for(let j=0;j<n;j++){
      const dx=src[i][0]-src[j][0],dy=src[i][1]-src[j][1],dz=src[i][2]-src[j][2];
      row[j]=Math.exp(-(dx*dx+dy*dy+dz*dz)/(sigma*sigma));
    }
    row[i]+=lam;
    row[n]=dst[i][0]-src[i][0]; row[n+1]=dst[i][1]-src[i][1]; row[n+2]=dst[i][2]-src[i][2];
    K.push(row);
  }
  for(let c=0;c<n;c++){                       // gaussian elimination, 3 RHS
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(K[r][c])>Math.abs(K[p][c]))p=r;
    if(p!==c){const t=K[p];K[p]=K[c];K[c]=t;}
    const pv=K[c][c]||1e-9;
    for(let r=c+1;r<n;r++){
      const f=K[r][c]/pv; if(!f)continue;
      for(let k=c;k<n+3;k++) K[r][k]-=f*K[c][k];
    }
  }
  const W=[];
  for(let i=n-1;i>=0;i--){
    const row=K[i], w=[row[n],row[n+1],row[n+2]];
    for(let j=i+1;j<n;j++){const wj=W[j-i-1];for(let k=0;k<3;k++)w[k]-=row[j]*wj[k];}
    const pv=row[i]||1e-9; for(let k=0;k<3;k++)w[k]/=pv;
    W.unshift(w);
  }
  return W;
}
function makeWarp(centers,weights,sigma,gain,cap){
  const n=centers.length, s2=sigma*sigma;
  return (x,y,z,out)=>{
    let ax=0,ay=0,az=0;
    for(let i=0;i<n;i++){
      const c=centers[i], dx=x-c[0],dy=y-c[1],dz=z-c[2];
      const k=Math.exp(-(dx*dx+dy*dy+dz*dz)/s2);
      if(k<1e-4)continue;
      const w=weights[i]; ax+=w[0]*k; ay+=w[1]*k; az+=w[2]*k;
    }
    out[0]=x+clamp(ax*gain,-cap,cap);
    out[1]=y+clamp(ay*gain,-cap,cap);
    out[2]=z+clamp(az*gain,-cap,cap);
  };
}

/* ── Blendshapes generated from the same anatomy ── */
function buildMorphs(H,pos){
  const {EY,MY,LW,BY}=H.P, n=H.nv, out={};
  const mk=()=>new Float32Array(n*3);
  const g2=(dx,rx,dy,ry)=>Math.exp(-((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)));
  const smile=mk(),frown=mk(),bUp=mk(),bDn=mk(),blL=mk(),blR=mk(),puck=mk(),wide=mk(),funnel=mk(),press=mk();
  for(let i=0;i<n;i++){
    const x=H.canon[i*3],y=H.canon[i*3+1],z=H.canon[i*3+2],f=H.front[i];
    const lip=H.region[i*4], brow=H.region[i*4+1];
    // corners of the mouth
    for(const sx of[1,-1]){
      const c=f*g2(x-sx*LW,0.0165,y-MY,0.0135);
      smile[i*3]+=sx*0.0062*c; smile[i*3+1]+=0.0060*c; smile[i*3+2]-=0.0015*c;
      frown[i*3]-=sx*0.0012*c; frown[i*3+1]-=0.0070*c; frown[i*3+2]-=0.0008*c;
      // cheek raise on smile
      const ck=f*g2(x-sx*0.044,0.0250,y+0.0180,0.0210);
      smile[i*3+1]+=0.0034*ck; smile[i*3+2]+=0.0022*ck;
    }
    // lip body
    const lb=cl01(lip*1.2);
    puck[i*3]-=x*0.42*lb; puck[i*3+2]+=0.0080*lb; puck[i*3+1]+=(MY-y)*0.20*lb;
    wide[i*3]+=x*0.26*lb; wide[i*3+2]-=0.0028*lb; wide[i*3+1]+=(MY-y)*-0.10*lb;
    // the O: lips forward and rounded, parting a little; the M: lips pressed
    // to the mouth line and drawn in
    funnel[i*3]-=x*0.30*lb; funnel[i*3+2]+=0.0072*lb; funnel[i*3+1]+=Math.sign(y-MY||1)*0.0022*lb;
    press[i*3+1]+=(MY-y)*0.45*lb; press[i*3+2]-=0.0024*lb; press[i*3]+=x*0.06*lb;
    // brows
    const bw=cl01(f*g2(x,0.048,y-BY,0.0165)+brow*1.2);
    bUp[i*3+1]+=0.0092*bw; bUp[i*3+2]+=0.0012*bw;
    bDn[i*3+1]-=0.0062*bw; bDn[i*3+2]+=0.0022*bw;
    bDn[i*3]-=Math.sign(x)*0.0030*bw*smoothstep(0.045,0.010,Math.abs(x));
    // forehead compresses when brows rise
    const fh=f*g2(x,0.055,y-(BY+0.045),0.0260);
    bUp[i*3+1]+=0.0020*fh;
    // eyelids sweep shut
    for(const [sx,arr] of [[1,blL],[-1,blR]]){
      const near=g2(x-sx*EY,0.0230,y-0.0010,0.0165)*f;
      if(near<0.02)continue;
      const upper=smoothstep(-0.0005,0.0095,y);      // 0 below eye, 1 at top lid
      const w=near*upper;
      arr[i*3+1]-=(y-(-0.0028))*w*1.05;
      arr[i*3+2]+=0.0022*w;
    }
  }
  out.smile=smile;out.frown=frown;out.browUp=bUp;out.browDown=bDn;
  out.blinkL=blL;out.blinkR=blR;out.pucker=puck;out.mouthWide=wide;out.funnel=funnel;out.press=press;
  return out;
}

/* ── Skin weights: head / jaw / neck ── */
// The jaw's hinge (canonical metres): the ear canal's height — level with the
// nose base — and 8 cm behind the lips. Set at eye level it had swung a
// dropped jaw back more than down (the chin receded 4 cm at a full opening
// and the lower lip went in behind the upper); from here the lip's swing is
// three parts down to one back, the chin's about even, as a mandible's is.
const JAW_PIVOT=[0,-0.042,-0.030];
function buildSkin(H){
  const n=H.nv, si=new Uint16Array(n*4), sw=new Float32Array(n*4);
  const {MY,CHY}=H.P, MAR0=H.P.LW*0.90;                          // the mouth slit's half-width (the aperture's)
  for(let i=0;i<n;i++){
    const x=H.canon[i*3],y=H.canon[i*3+1],z=H.canon[i*3+2],f=H.front[i];
    // jaw: everything below the mouth line that faces forward, fading
    // toward the hinge at the back. Within the lip span the split is the
    // slit itself — the lower lip is the jaw's, the upper lip the head's —
    // so a dropped jaw parts the lips instead of stretching the chin
    // (a 36 mm band had left the lip line a tenth of the drop); past the
    // corners the band widens to soft tissue's blend.
    const ax=Math.abs(x), sx=smoothstep(MAR0*0.9,MAR0+0.022,ax);
    const cy=MY-0.012*sx, hy=0.0012+0.0168*sx;
    let wj=smoothstep(cy+hy,cy-hy,y)*smoothstep(-0.055,0.005,z);
    wj*=smoothstep(0.085,0.050,Math.abs(x))*0.55+0.45*smoothstep(0.090,0.020,Math.abs(x));
    wj=cl01(wj);
    let wn=smoothstep(CHY+0.012,CHY-0.040,y)*(1-f*0.8);   // under-chin toward neck
    wn=cl01(wn)*0.65;
    const wh=Math.max(0,1-wj-wn);
    si[i*4]=2;si[i*4+1]=3;si[i*4+2]=1;si[i*4+3]=0;
    const t=wh+wj+wn||1;
    sw[i*4]=wh/t; sw[i*4+1]=wj/t; sw[i*4+2]=wn/t; sw[i*4+3]=0;
  }
  return {si,sw};
}

/* ── Vertex colour: skin, lips, brows, lashes, sockets, beard ── */
function buildColors(H,pos,COL,traits){
  const n=H.nv, col=new Float32Array(n*3);
  const skin=new THREE.Color().setHSL(COL.skin.h,COL.skin.s,COL.skin.l);
  const lips=new THREE.Color().setHSL(COL.lips.h,COL.lips.s,COL.lips.l);
  const hair=new THREE.Color().setHSL(COL.hair.h,COL.hair.s,COL.hair.l);
  const {MY,LW,EY}=H.P;
  const beardAmt=traits.beard==='full'?1:traits.beard==='stubble'?0.45:0;
  const c=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=H.canon[i*3],y=H.canon[i*3+1],f=H.front[i];
    const lip=H.region[i*4],brow=H.region[i*4+1],sock=H.region[i*4+2];
    c.copy(skin);
    // subtle life: warmer cheeks, cooler forehead, shaded sockets
    const cheek=Math.exp(-(((Math.abs(x)-0.045)/0.030)**2)-(((y+0.012)/0.028)**2))*f;
    c.offsetHSL(0.004*cheek,0.05*cheek,0.012*cheek);
    c.offsetHSL(0,0,-0.055*sock);
    // subcutaneous fat scatters light; creases sit in shadow
    const a=H.anat[i];
    c.offsetHSL(0, a<0?0.012:0, clamp(a*(a<0?9:5),-0.045,0.030));
    const underNose=Math.exp(-((x/0.014)**2)-(((y-(H.P.NBY-0.004))/0.005)**2))*f;
    c.offsetHSL(0,0.02*underNose,-0.075*underNose);
    if(lip>0.02) c.lerp(lips,cl01(lip*1.25));
    if(beardAmt>0){
      const zone=H.region[i*4+3];
      const mous=Math.exp(-((x/0.024)**2)-(((y-(MY+0.020))/0.010)**2))*f;
      const jaw=zone*smoothstep(0.075,0.030,Math.abs(x)*0.6+Math.abs(y-MY)*0.4);
      const b=cl01((Math.max(jaw,mous))*beardAmt)*(1-cl01(lip*1.6));
      if(b>0.01) c.lerp(hair,b*0.82);
    }
    if(brow>0.05) c.lerp(hair,cl01(brow*2.4)*0.92);
    // lash line just above/below the eye aperture
    const lash=Math.max(Math.exp(-(((Math.abs(x)-EY)/0.018)**2)-(((y-0.0080)/0.0024)**2)),
                        Math.exp(-(((Math.abs(x)-EY)/0.016)**2)-(((y+0.0070)/0.0019)**2)))*f;
    if(lash>0.05) c.lerp(hair,cl01(lash*1.15)*0.80);
    c.convertSRGBToLinear();                 // mixed as sRGB, as VibeMesh always did; stored as light
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  return col;
}

function computeNormals(pos,idx,n){
  const nrm=new Float32Array(n*3);
  for(let t=0;t<idx.length;t+=3){
    const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2];
    const vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    nrm[a]+=nx;nrm[a+1]+=ny;nrm[a+2]+=nz;
    nrm[b]+=nx;nrm[b+1]+=ny;nrm[b+2]+=nz;
    nrm[c]+=nx;nrm[c+1]+=ny;nrm[c+2]+=nz;
  }
  for(let i=0;i<n;i++){
    const l=Math.hypot(nrm[i*3],nrm[i*3+1],nrm[i*3+2])||1;
    nrm[i*3]/=l;nrm[i*3+1]/=l;nrm[i*3+2]/=l;
  }
  return nrm;
}


/* ═══ §4b  MEASUREMENT-DRIVEN FITTING ════════════════════════════════
   The avatar is not warped onto the scan. Instead every shape parameter
   owns a MEASUREMENT, and the same measurement code runs against both
   the model and the observed landmarks. Each pass asks, per parameter,
   "is the model bigger or smaller than the photo?" and steps toward it.
   Parameters therefore stay inside plausible human ranges by
   construction — the face can never tear or grow lumps — and repeated
   passes converge instead of re-warping.                              */

// A measurement is a pure function of a landmark accessor, so the model
// and the photograph are measured by identical code.
const D3P=(a,b)=>(a&&b)?Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]):NaN;

  browRise:   g=>(g(105)&&g(334)&&g(33)&&g(263))?((g(105)[1]+g(334)[1])/2-(g(33)[1]+g(263)[1])/2):NaN,
  noseLen:    g=>(g(168)&&g(4))?Math.abs(g(168)[1]-g(4)[1]):NaN,
  noseW:      g=>D3P(g(98),g(327)),
  noseProj:   g=>(g(4)&&g(50)&&g(280))?(g(4)[2]-(g(50)[2]+g(280)[2])/2):NaN,
  mouthW:     g=>D3P(g(61),g(291)),

function anchorFix(){

// Evaluate the model's landmarks. Each anchor is a semantic TARGET in
// canonical space, not a fixed surface coordinate: invert the base
// parameterisation to find where that target now sits, then sculpt it.
// Without this a parameter can move a feature while its anchor stays
// behind, the measured slope reads zero, and the fitter never budges.
function modelGetter(S,raw=false){
  const P=derived(S), specs=anchorSpecs(P), o=new Float32Array(8), cache={}, fix=raw?{}:anchorFix();
  for(const [lm,ax,ay] of specs){
    const sgn=ax===0?0:(lmSide(lm)||1), tx=sgn*ax;
    const yPre=ay<0?ay/P.FL:ay;
    const phi=Math.acos(clamp(yPre/P.B,-1,1));
    const sphi=Math.sin(phi)||1e-6;
    const th=Math.asin(clamp(tx/(P.A*sphi),-1,1));   // front hemisphere
    sculptPoint(th,phi,S,P,o);
    const f=fix[lm]||[0,0,0];
    cache[lm]=[o[0]+f[0],o[1]+f[1],o[2]+f[2]];
  }
  return lm=>cache[lm]||null;

function cloudGetter(cloud,conf){
  return lm=>{
    const i=lm*3;
    if(!isFinite(cloud[i])) return null;
    if(conf && isFinite(conf[lm]) && conf[lm]<0.25) return null;   // scattered
    return [cloud[i],cloud[i+1],cloud[i+2]];
  };

/* Coordinate-descent with a numeric slope per parameter: measure, ask
   more-or-less, take a damped Newton step, clamp, repeat. The slope is
   measured rather than hard-coded, so the loop stays correct if the
   sculpt changes. */
// Verify the declared sides against the capture; a non-mirrored feed
// flips every anchor at once rather than scrambling them individually.
function orientAnchors(anchors,cloud){
  let agree=0,total=0;
  for(const a of anchors){
    if(!a.side) continue;
    const t=cloud[a.lm*3];
    if(!isFinite(t)||Math.abs(t)<1e-4) continue;
    total++; if(Math.sign(t)===a.side) agree++;
  }
  if(total>6&&agree<total*0.4)
    return anchors.map(a=>({...a,side:-a.side}));
  return anchors;
}

function fitShape(cloud, conf, anchors, S0, passes){
  const S={...S0};
  const obsG=cloudGetter(cloud,conf), obs={};
  for(const k in MEAS) obs[k]=MEAS[k](obsG);
  const log=[];
  for(let pass=0;pass<passes;pass++){
    const damp=pass===0?0.55:(pass<3?0.75:0.9);
    for(const [key,mk,lo,hi] of FITP){
      const target=obs[mk];
      if(!isFinite(target)) continue;
      const m0=MEAS[mk](modelGetter(S));
      if(!isFinite(m0)) continue;
      const h=(hi-lo)*0.04;
      const S1={...S,[key]:clamp(S[key]+h,lo,hi)};
      const m1=MEAS[mk](modelGetter(S1));
      const slope=(m1-m0)/((S1[key]-S[key])||1e-9);
      if(!isFinite(slope)||Math.abs(slope)<1e-7) continue;
      const step=clamp((target-m0)/slope*damp,-(hi-lo)*0.34,(hi-lo)*0.34);
      S[key]=clamp(S[key]+step,lo,hi);
    }
  }
  // report the residuals so the panel can show what actually converged
  const fin=modelGetter(S);
  for(const [key,mk] of FITP){
    const t=obs[mk], m=MEAS[mk](fin);
    if(isFinite(t)&&isFinite(m)) log.push({key,mk,err:(m-t)*1000,target:t*1000});
  }
  return {S,log,obs};
}

/* ── Lens / perspective ──────────────────────────────────────────────
   A selfie at arm's length magnifies whatever is nearest the lens — the
   nose grows, the ears shrink. First-order undo is x·(1−z·k) with
   k = 1/distance. k is not guessed: it is the value that makes the
   turned views agree once they are aligned, which is only observable
   because calibration captures more than one angle.                  */
function undoPerspective(cloud,k){
  const out=new Float32Array(cloud.length);
  for(let i=0;i<468;i++){
    const z=cloud[i*3+2], sc=1-z*k;
    out[i*3]=cloud[i*3]*sc; out[i*3+1]=cloud[i*3+1]*sc; out[i*3+2]=z;
  }
  return out;
}
function viewDisagreement(views,k){
  const ref=undoPerspective(views[0],k);
  let sum=0,n=0;
  for(let v=1;v<views.length;v++){
    const al=alignCloud(undoPerspective(views[v],k),ref);
    for(let i=0;i<468;i++){
      const d=Math.hypot(al[i*3]-ref[i*3],al[i*3+1]-ref[i*3+1],al[i*3+2]-ref[i*3+2]);
      if(!isFinite(d))continue;              // a dropped landmark isn't evidence
      sum+=d; n++;
    }
  }
  return n>40?sum/n:Infinity;
}
function estimateLensK(views){
  if(views.length<2) return {k:2.2,err:null,est:false};   // default ≈45 cm
  let best=null,bestE=Infinity;
  for(let k=0;k<=5.0;k+=0.25){
    const e=viewDisagreement(views,k);
    if(e<bestE){bestE=e;best=k;}
  }
  if(best===null) return {k:2.2,err:null,est:false};     // no usable overlap
  for(let k=Math.max(0,best-0.25);k<=best+0.25;k+=0.05){
    const e=viewDisagreement(views,k);
    if(e<bestE){bestE=e;best=k;}
  }
  return {k:best,err:bestE,est:true};
}

/* Per-landmark convergence: points that land in the same place from
   every angle are real triangulated structure; points that scatter are
   MediaPipe guessing, and are dropped from the measurements. */
function convergence(views,k,ref){
  const conf=new Float32Array(468).fill(1);
  if(views.length<2) return conf;
  const acc=[];
  for(let v=0;v<views.length;v++)
    acc.push(v===0?ref:alignCloud(undoPerspective(views[v],k),ref));
  for(let i=0;i<468;i++){
    let mx=0,my=0,mz=0,n=0;
    for(const a of acc){ if(!isFinite(a[i*3]))continue;
      mx+=a[i*3]; my+=a[i*3+1]; mz+=a[i*3+2]; n++; }
    if(n<2){ conf[i]=1; continue; }    // too few sightings to judge — don't punish
    mx/=n; my/=n; mz/=n;
    let sp=0;
    for(const a of acc){ if(!isFinite(a[i*3]))continue;
      sp+=Math.hypot(a[i*3]-mx,a[i*3+1]-my,a[i*3+2]-mz); }
    sp/=n;
    conf[i]=isFinite(sp)?cl01(1-(sp/0.010)):1;   // 10 mm scatter ⇒ worthless
  }
  return conf;
}
