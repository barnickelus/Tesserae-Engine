const EYE_R=0.0136;
function buildIrisCap(){
  const HALF=0.52;                                   // ≈12.4 mm iris
  const g=new THREE.SphereGeometry(EYE_R*1.015,26,14,0,Math.PI*2,0,HALF);
  g.rotateX(Math.PI/2);                              // pole faces +z
  const p=g.attributes.position, n=p.count, col=new Float32Array(n*3);
  const ic=new THREE.Color().setHSL(COL.iris.h,COL.iris.s,COL.iris.l);
  const c=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const ang=Math.acos(clamp(z/(Math.hypot(x,y,z)||1e-9),-1,1));
    const t=cl01(ang/HALF);                          // 0 centre → 1 rim
    const fib=0.86+0.28*((Math.sin(Math.atan2(y,x)*13.0)+1)/2);
    if(t<0.34) c.setRGB(0.035,0.028,0.042);          // pupil
    else if(t>0.93) c.copy(ic).multiplyScalar(0.24); // limbal ring
    else{
      const u=(t-0.34)/0.59;
      c.copy(ic).multiplyScalar((1.08-0.38*u)*fib);
      c.offsetHSL(0,0.06*(1-u),0);
    }
    const G=ID.gain||[1,1,1];
    col[i*3]=srgb2lin(Math.min(1,c.r))*G[0];col[i*3+1]=srgb2lin(Math.min(1,c.g))*G[1];col[i*3+2]=srgb2lin(Math.min(1,c.b))*G[2];
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return g;
}

function buildAvatar(){
  const t0=performance.now();
  clearTesserae();                     // its tiles belong to the old rig
  if(AV.root){ scene.remove(AV.root); disposeTree(AV.root); }

  // Shape comes only from parameters now — fitted, then optionally
  // hand-tuned. Nothing deforms the mesh after generation, so parts
  // parented to bones can never drift out of the face.
  let S=Object.assign(measToShape(ID.meas), ID.fit||{}, ID.manual||{});
  // under the dense conform (§8b) feature LOCATIONS come from the user's own
  // landmarks, so the parameters that move them stay at default (a hand-set
  // slider still wins); soft tissue keeps its estimate
  const dense=!!(ID.lm&&LIKE.conform);
  if(dense){ const S0=measToShape(ID.meas); for(const k of LOCATION_PARAMS) S0[k]=DEFAULT_SHAPE[k];
    S=Object.assign(S0,LIKE.outline&&ID.outline?ID.outline.S:{},ID.manual||{}); }   // the silhouette's own fit (§8b)
  AV._adip=S._adip!=null?S._adip:0.5; AV._bone=S._bone!=null?S._bone:0.5;
  AV.S=S;
  const q=AV.quality;
  const H=buildHead(S,{NA:Math.round(112*q),NP:Math.round(88*q)});
  const fitted=!!ID.fit;
  el('t-fit').textContent=fitted?('fit·'+Math.max(1,CAL.sessions)):'base';
  // conform the fitted head to the user's own anchors (§8b); whatever rides
  // the face — eyes, teeth, mouth — is carried by the same field
  const field=dense?conformField(S,ID.lm,ID.conf):null;
  conformHead(H,field);
  AV.snap=dense&&LIKE.features?snapFeatures(H,ID.lm):null;
  AV.conform=field?{anchors:field.anchors,rms:field.rms,fitMm:field.fitMm}:null;
  const wp=(p)=>{ if(!field) return p.slice(); const d=field(p[0],p[1],p[2]); return [p[0]+d[0],p[1]+d[1],p[2]+d[2]]; };

  const nrm=computeNormals(H.pos,H.idx,H.nv);
  // the photographs: their median skin tones the parts they never saw
  const photo=LIKE.photo?bakePhoto(H,nrm):null;
  if(photo&&photo.skinLin) COL.skin=linToHSL(photo.skinLin);
  const colors=buildColors(H,H.pos,COL,TRAITS);
  if(photo) for(let v=0;v<H.nv;v++){ const m=photo.mask[v]; if(m<=0) continue;
    for(let k=0;k<3;k++) colors[v*3+k]+=(photo.col[v*3+k]-colors[v*3+k])*m; }
  AV.photo=photo?{views:photo.views,front:photo.front,probe:photo.probe,viewGain:photo.viewGain}:null; AV.nrm=nrm;
  const G=ID.gain;                              // the camera → render calibration (§8b)
  if(G) for(let v=0;v<H.nv;v++) for(let k=0;k<3;k++) colors[v*3+k]=Math.min(1,colors[v*3+k]*G[k]);
  const {si,sw}=buildSkin(H);
  const morphs=buildMorphs(H,H.pos);
  // the user's own mouth shapes, where a reading caught them (§8c)
  AV.mouth=null;
  if(ID.mouth&&LIKE.mouth){ const um=mouthMorphs(H,si,sw,wp(JAW_PIVOT)); if(um){ Object.assign(morphs,um); AV.mouth=Object.keys(um); } }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(H.pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  geo.setAttribute('skinIndex',new THREE.BufferAttribute(si,4));
  geo.setAttribute('skinWeight',new THREE.BufferAttribute(sw,4));
  const tex=!!(photo&&photo.front&&LIKE.texture);
  if(tex){ const T=photo.front.tex, n=H.nv, pw=new Float32Array(n*3), pg=new Float32Array(n*3).fill(1);
    T.forEach((t,k)=>{ geo.setAttribute('photoUv'+k,new THREE.BufferAttribute(t.uv,2)); for(let v=0;v<n;v++){ pw[v*3+k]=t.w[v]; pg[v*3+k]=t.g[v]; } });
    for(let k=T.length;k<3;k++) geo.setAttribute('photoUv'+k,new THREE.BufferAttribute(new Float32Array(n*2),2));
    geo.setAttribute('photoW',new THREE.BufferAttribute(pw,3)); geo.setAttribute('photoG',new THREE.BufferAttribute(pg,3)); }
  geo.setIndex(H.idx.length>65535?new THREE.BufferAttribute(new Uint32Array(H.idx),1)
                                 :new THREE.BufferAttribute(new Uint16Array(H.idx),1));
  geo.morphAttributes.position=[];
  AV.morphIdx={};
  const order=MORPH_ORDER;
  order.forEach((k,i)=>{
    const d=morphs[k], t=new Float32Array(H.nv*3);
    for(let j=0;j<H.nv*3;j++) t[j]=H.pos[j]+d[j];
    geo.morphAttributes.position.push(new THREE.BufferAttribute(t,3));
    AV.morphIdx[k]=i;
  });

  // ── skeleton ──────────────────────────────────────────────────
  // Bone WORLD positions (canonical head space). Locals are derived so
  // the anatomy reads directly: head pivots at the atlas, jaw at the
  // condyle, eyes at the eyeball centres.
  const W={root:[0,-0.300,0], neck:[0,-0.160,-0.020], head:[0,-0.045,-0.022],
           jaw:wp(JAW_PIVOT), eL:wp([H.P.EY,0,0.048]), eR:wp([-H.P.EY,0,0.048])};
  // an eyeball sits behind its opening: centred on the user's own lid contour
  if(AV.snap) for(const [k,c] of [['eL',AV.snap.eyeP],['eR',AV.snap.eyeN]]) if(c){ W[k][0]=c[0]; W[k][1]=c[1]; }
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const root=new THREE.Bone(); root.position.fromArray(W.root);
  const neck=new THREE.Bone(); neck.position.fromArray(sub(W.neck,W.root)); root.add(neck);
  const head=new THREE.Bone(); head.position.fromArray(sub(W.head,W.neck)); neck.add(head);
  const jaw =new THREE.Bone(); jaw.position.fromArray(sub(W.jaw,W.head));   head.add(jaw);
  const eL=new THREE.Bone(); eL.position.fromArray(sub(W.eL,W.head)); head.add(eL);
  const eR=new THREE.Bone(); eR.position.fromArray(sub(W.eR,W.head)); head.add(eR);
  const bones=[root,neck,head,jaw,eL,eR];

  const grp=new THREE.Group();
  grp.add(root);
  // Skeleton() snapshots bone.matrixWorld to build the bind inverses, so
  // the hierarchy MUST be resolved first — otherwise every bone binds
  // against identity and each region gets sheared by its bone offset.
  grp.updateMatrixWorld(true);
  const skel=new THREE.Skeleton(bones);
  AV.skel=skel; AV.H=H;

  // (LIKE.unlit, a measuring aid: the photo projected as it is, unlit and
  // un-tone-mapped — what's left against the camera is registration)
  const skinMat=LIKE.unlit?new THREE.MeshBasicMaterial({vertexColors:true,toneMapped:false})
    :new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.62,metalness:0.0,specularIntensity:LIKE.spec,side:THREE.FrontSide});
  if(tex) photoSkin(skinMat,photo.front.tex.map(t=>photoTexture(t.sh)),photo.front.tex.map(t=>{ const g=G||[1,1,1]; return [g[0]*t.gain[0],g[1]*t.gain[1],g[2]*t.gain[2]]; }),!!LIKE.unlit);
  const mesh=new THREE.SkinnedMesh(geo,skinMat);
  mesh.frustumCulled=false;
  grp.add(mesh);
  mesh.bind(skel);

  // ── eyeballs ride the eye bones (cornea near flush with the lids) ──
  const scleraGeo=new THREE.SphereGeometry(EYE_R,24,18);
  // the whites as the photo saw them, brought to albedo like the skin (the
  // bake's skin over the photo's), then the calibration's balance
  const scl=new THREE.Color(0xf2ece6);
  if(ID.scleraLin&&ID.skinPhotoLin&&photo&&photo.skinLin){ const g=G||[1,1,1];
    scl.setRGB(...[0,1,2].map(k=>clamp(ID.scleraLin[k]*photo.skinLin[k]/Math.max(ID.skinPhotoLin[k],1e-3)*g[k],0.2,0.9))); }
  // a wet eye reflects the room as a catchlight, not a film: glossy at full
  // specular, the room's light washed irises to milky grey
  const scleraMat=new THREE.MeshPhysicalMaterial({color:scl,roughness:0.34,metalness:0,specularIntensity:0.5});
  const irisGeo=buildIrisCap();
  const irisMat=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.3,metalness:0,specularIntensity:0.5});
  const mkEye=()=>{ const g=new THREE.Group();
    g.add(new THREE.Mesh(scleraGeo,scleraMat));
    g.add(new THREE.Mesh(irisGeo,irisMat));
    return g; };
  AV.eyeL=mkEye(); AV.eyeR=mkEye();
  // eyes, sockets, mouth and teeth stay as they are under tesserae: gaze and
  // speech live in them (userData.tesseraShared — the same in both renders)
  for(const e of [AV.eyeL,AV.eyeR]) e.traverse(o=>{ if(o.isMesh) o.userData.tesseraShared=true; });
  eL.add(AV.eyeL); eR.add(AV.eyeR);      // eye bones sit AT the eyeball centres
  // socket lining: the aperture is wider than the globe's cross-section, so
  // without this the canthus corners read as black holes into the skull.
  const socketMat=new THREE.MeshStandardMaterial({color:0x24110f,roughness:0.9});   // reads as shadow, not flesh
  const socketGeo=new THREE.SphereGeometry(0.0172,18,12);
  for(const [bone,sgn] of [[eL,1],[eR,-1]]){
    const sk=new THREE.Mesh(socketGeo,socketMat);
    sk.scale.set(1.0,0.62,0.55);
    sk.position.set(sgn*0.0006,-0.0006,-0.0052);
    sk.userData.tesseraShared=true;
    bone.add(sk);
  }

  // ── mouth cavity + teeth (positions are bone-local, hence the offsets) ──
  const toHead=w=>sub(w,W.head), toJaw=w=>sub(w,W.jaw);
  // they move with the mouth itself — the lip line's own displacement, after
  // the warp and the contour — not the warp sampled where they sit, deep
  // inside the head (there it could differ, and the lower teeth came through
  // the chin as a pale patch)
  let mS=null;
  if(field&&H.rims&&H.rims.mouth.length){ mS=[0,0,0]; for(const i of H.rims.mouth) for(let k=0;k<3;k++) mS[k]+=H.pos[i*3+k]-H.canon[i*3+k];
    mS=mS.map(v=>v/H.rims.mouth.length); }
  const wm=p=>mS?[p[0]+mS[0],p[1]+mS[1],p[2]+mS[2]]:wp(p);
  // the cavity in two halves, like the teeth: the upper on the head, the
  // lower on the jaw — one sphere on the head poked out of the chin's sides
  // when the jaw dropped and the skin there swung back
  // Both are the dark of a mouth: together they must close off everything
  // behind the opening at any jaw (the neck's top rises inside the head, and
  // showed through an open mouth as a skin-coloured floor between two thin
  // shells). The head's sits deep and round, its underside clear of the
  // chin's swing; the jaw's is tall enough to meet it at a full opening.
  const cavMat=new THREE.MeshStandardMaterial({color:0x2a0d10,roughness:0.85}), cavGeo=new THREE.SphereGeometry(0.024,20,14);
  const cav=new THREE.Mesh(cavGeo,cavMat); cav.scale.set(1.10,1.05,1.05);
  cav.position.fromArray(toHead(wm([0,H.P.MY-0.008,0.002]))); head.add(cav);
  const cav2=new THREE.Mesh(cavGeo,cavMat); cav2.scale.set(1.04,0.70,0.60);
  cav2.position.fromArray(toJaw(wm([0,H.P.MY-0.012,0.019]))); jaw.add(cav2);
  cav.userData.tesseraShared=cav2.userData.tesseraShared=true;
  const teethMat=new THREE.MeshStandardMaterial({color:0xf2ece2,roughness:0.35});
  const upT=new THREE.Mesh(new THREE.BoxGeometry(0.028,0.0055,0.007),teethMat);
  upT.position.fromArray(toHead(wm([0,H.P.MY+0.0024,0.0358]))); head.add(upT);
  const loT=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.0050,0.007),teethMat);
  loT.position.fromArray(toJaw(wm([0,H.P.MY-0.0068,0.0352]))); jaw.add(loT);
  upT.userData.tesseraShared=loT.userData.tesseraShared=true; AV.mouthParts=[cav,cav2,upT,loT];

  // ── ears (rigid on the head bone) ──
  const earMat=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color().setHSL(COL.skin.h,COL.skin.s,COL.skin.l*0.97,THREE.SRGBColorSpace).multiply(new THREE.Color(...(ID.gain||[1,1,1]))),
    roughness:0.66,metalness:0,specularIntensity:LIKE.spec});
  const earGeo=new THREE.SphereGeometry(0.0125,16,12);
  AV.ears=[];
  for(const sgn of [1,-1]){
    const ear=new THREE.Mesh(earGeo,earMat);
    ear.scale.set(0.30,1.42,0.74);
    ear.position.fromArray(toHead(wp([sgn*H.P.A*0.965,-0.006,-0.019])));
    ear.rotation.set(0.10,sgn*0.30,sgn*-0.12);
    head.add(ear); AV.ears.push(ear);
  }

  // ── neck + bust, hair — same skeleton, bound after the world update ──
  const neckMesh=buildBust(H,COL,skel);
  grp.add(neckMesh); neckMesh.bind(skel);

  const hairMesh=buildHair(H,nrm,COL,{...TRAITS,hairY:ID.hairY,fit:ID.hairFit,skinCol:colors},skel);
  if(hairMesh){ grp.add(hairMesh); hairMesh.bind(skel); }

  scene.add(grp);
  AV.root=grp; AV.head=mesh; AV.hair=hairMesh; AV.neck=neckMesh;
  AV.bones={root,neck,head,jaw,eL,eR}; AV.built=true;
  AV.tris=(H.idx.length/3)|0;
  el('t-tri').textContent=AV.tris.toLocaleString();
  AV.buildMs=Math.round(performance.now()-t0);
  scheduleTesserae();
}

function disposeTree(o){
  o.traverse(n=>{ if(n.geometry)n.geometry.dispose();
    if(n.material){ (Array.isArray(n.material)?n.material:[n.material]).forEach(m=>m.dispose()); } });
}

// lofted neck + shoulders, skinned to root/neck/head
function buildBust(H,COL,skel){
  const SEC=[[-0.300,0.150,0.078,-0.010],[-0.262,0.146,0.075,-0.010],
    [-0.228,0.132,0.070,-0.012],[-0.202,0.101,0.063,-0.014],
    [-0.182,0.072,0.056,-0.016],[-0.164,0.052,0.049,-0.018],
    [-0.146,0.043,0.044,-0.019],[-0.126,0.039,0.041,-0.020],
    [-0.106,0.038,0.040,-0.021],[-0.090,0.036,0.038,-0.022]];
  const NR=48, NS=SEC.length;
  const nv=NR*NS, pos=new Float32Array(nv*3), col=new Float32Array(nv*3);
  const si=new Uint16Array(nv*4), sw=new Float32Array(nv*4), idx=[];
  const skin=new THREE.Color().setHSL(COL.skin.h,COL.skin.s,COL.skin.l);
  const shirt=new THREE.Color().setHSL(0.58,0.22,0.20);
  for(let s=0;s<NS;s++){
    const [y,w,d,cz]=SEC[s];
    for(let r=0;r<NR;r++){
      const th=r/NR*Math.PI*2, i=s*NR+r;
      pos[i*3]=Math.sin(th)*w; pos[i*3+1]=y; pos[i*3+2]=cz+Math.cos(th)*d;
      const c=((y<-0.185)?shirt.clone():(y<-0.165?shirt.clone().lerp(skin,(y+0.185)/0.020):skin.clone())).convertSRGBToLinear();
      const sk=y<-0.185?0:(y<-0.165?(y+0.185)/0.020:1), G=ID.gain||[1,1,1];
      col[i*3]=c.r*mix(1,G[0],sk);col[i*3+1]=c.g*mix(1,G[1],sk);col[i*3+2]=c.b*mix(1,G[2],sk);
      const t=cl01((y+0.230)/0.140);            // 0 chest → 1 top of neck
      const wh=cl01((y+0.120)/0.045)*0.75, wn=cl01(t)*(1-wh), wr=Math.max(0,1-wh-wn);
      const tot=wh+wn+wr||1;
      si[i*4]=2;si[i*4+1]=1;si[i*4+2]=0;si[i*4+3]=0;
      sw[i*4]=wh/tot;sw[i*4+1]=wn/tot;sw[i*4+2]=wr/tot;sw[i*4+3]=0;
    }
  }
  for(let s=0;s<NS-1;s++)for(let r=0;r<NR;r++){
    const a=s*NR+r,b=s*NR+(r+1)%NR,c=(s+1)*NR+(r+1)%NR,d=(s+1)*NR+r;
    idx.push(a,b,c,a,c,d);
  }
  // cap the bottom
  const base=nv;
  const capPos=Array.from(pos), capCol=Array.from(col);
  capPos.push(0,-0.300,-0.010); capCol.push(shirt.r,shirt.g,shirt.b);
  const si2=new Uint16Array((nv+1)*4), sw2=new Float32Array((nv+1)*4);
  si2.set(si); sw2.set(sw); sw2[nv*4+2]=1; si2[nv*4]=2;si2[nv*4+1]=1;si2[nv*4+2]=0;
  for(let r=0;r<NR;r++) idx.push(base,(r+1)%NR,r);

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(capPos),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(capCol),3));
  g.setAttribute('skinIndex',new THREE.BufferAttribute(si2,4));
  g.setAttribute('skinWeight',new THREE.BufferAttribute(sw2,4));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m=new THREE.SkinnedMesh(g,new THREE.MeshStandardMaterial({
    vertexColors:true,roughness:0.72,metalness:0}));
  m.frustumCulled=false;
  return m;
}

// hair shell grown off the scalp, with a hanging curtain for long styles
function buildHair(H,nrm,COL,TR,skel){
  const style=TR.hair;
  const NA=H.NA,NP=H.NP;
  // bald: no shell at all — the scalp is skin, and the tesserae lay it
  if(style==='bald'){ H.hairCover=new Float32Array((NA+1)*(NP+1)); return null; }
  // the user's own hair, measured in the photos (fitHair)
  if(style==='fit'&&TR.fit&&!TR.fit.bald) return buildHairFit(H,nrm,COL,TR.fit,TR.skinCol);
  const thick={buzz:0.0032,short:0.0105,mid:0.0135,long:0.0150}[style]||0.010;
  const hairC=new THREE.Color().setHSL(COL.hair.h,COL.hair.s,COL.hair.l);
  const skinC=new THREE.Color().setHSL(COL.skin.h,COL.skin.s,COL.skin.l);
  const noise=(x,y,z)=>{const s=Math.sin(x*211.3+y*157.7+z*93.1)*43758.545;return s-Math.floor(s);};
  const scalpLine=(x,y,z,f)=>{
    // hairline: high across the brow, lower at the sides and back
    const back=cl01(-z*8);
    const front=f;
    const buzzUp=style==='buzz'?0.012:0;
    // the user's own hairline, when the photo showed it (§8 sampleColors)
    const fy=(TR.hairY!=null?TR.hairY:0.052)+buzzUp;
    return mix(mix(0.010,-0.030,back),fy,front*front);
  };
  const nv=(NA+1)*(NP+1);
  const pos=new Float32Array(nv*3), col=new Float32Array(nv*3);
  const si=new Uint16Array(nv*4), sw=new Float32Array(nv*4);
  const keep=new Uint8Array(nv), cover=H.hairCover=new Float32Array(nv);
  for(let i=0;i<nv;i++){
    const x=H.pos[i*3],y=H.pos[i*3+1],z=H.pos[i*3+2],f=H.front[i];
    const line=scalpLine(x,y,z,f);
    keep[i]=y>line-0.013?1:0;            // extend past the line…
    const t=cl01((y-line)/0.030);
    const fade=smoothstep(line-0.011,line+0.015,y);   // …and taper to zero
    cover[i]=keep[i]?fade:0;                           // the tesserae skip scalp that hair hides
    const n0=noise(x*40,y*40,z*40), n1=noise(x*13,y*13,z*13);
    const th=thick*fade*(0.52+0.48*t)*(0.72+0.5*n0)*(0.85+0.35*n1);
    pos[i*3]=x+nrm[i*3]*th; pos[i*3+1]=y+nrm[i*3+1]*th; pos[i*3+2]=z+nrm[i*3+2]*th;
    const sh=0.72+0.45*n1;
    // blend to skin as thickness vanishes: hides the quantised hairline
    const bl=cl01(fade*1.35);
    col[i*3]  =mix(skinC.r,hairC.r*sh,bl);
    col[i*3+1]=mix(skinC.g,hairC.g*sh,bl);
    col[i*3+2]=mix(skinC.b,hairC.b*sh,bl);
    for(let c=0;c<3;c++) col[i*3+c]=srgb2lin(col[i*3+c])*(ID.gain?ID.gain[c]:1);
    si[i*4]=2;si[i*4+1]=1;sw[i*4]=1;sw[i*4+1]=0;
  }
  const idx=[];
  const at=(iu,iv)=>iv*(NA+1)+iu;
  for(let iv=0;iv<NP;iv++)for(let iu=0;iu<NA;iu++){
    const a=at(iu,iv),b=at(iu+1,iv),c=at(iu+1,iv+1),d=at(iu,iv+1);
    if(keep[a]&&keep[b]&&keep[c]&&keep[d]) idx.push(a,c,b,a,d,c);
  }

  const P=[...pos], C=[...col], SI=[...si], SW=[...sw];
  // curtain: hang strands from the scalp boundary for mid/long styles
  if(style==='mid'||style==='long'){
    const drop=style==='long'?-0.205:-0.115;
    const ring=[];
    for(let iu=0;iu<=NA;iu++){
      // lowest kept vertex in this column becomes a strand root
      let best=-1;
      for(let iv=NP;iv>=0;iv--){ const i=at(iu,iv); if(keep[i]){best=i;break;} }
      if(best<0){ring.push(null);continue;}
      const x=P[best*3],y=P[best*3+1],z=P[best*3+2];
      ring.push(H.front[best]>0.62&&z>0.03?null:[x,y,z,best]);   // keep the face clear
    }
    const ROWS=14, baseIdx=P.length/3;
    let cols=0; const colMap=[];
    for(let iu=0;iu<=NA;iu++){
      if(!ring[iu]){colMap.push(-1);continue;}
      colMap.push(cols++);
      const [x0,y0,z0]=ring[iu];
      const rad=Math.hypot(x0,z0+0.012)||1e-6;
      for(let r=0;r<=ROWS;r++){
        const t=r/ROWS;
        const yy=mix(y0,drop,Math.pow(t,0.86));
        const flare=1+0.16*Math.sin(t*Math.PI)*(1-Math.abs(z0)/0.09);
        const taper=1-0.30*Math.pow(t,2.4);
        const sway=noise(x0*30,r*7,z0*30)*0.006*t;
        const k=flare*taper;
        P.push(x0*k+sway, yy, (z0+0.012)*k-0.012+sway*0.5);
        const sh=0.66+0.5*noise(x0*11,r*3,z0*11);
        const G=ID.gain||[1,1,1];
        C.push(srgb2lin(hairC.r*sh)*G[0],srgb2lin(hairC.g*sh)*G[1],srgb2lin(hairC.b*sh)*G[2]);
        // upper strands follow the head, lower drift toward neck/chest
        const wh=1-cl01((t-0.25)/0.75)*0.75, wn=(1-wh)*0.6, wr=1-wh-wn;
        SI.push(2,1,0,0); SW.push(wh,wn,wr,0);
      }
    }
    for(let iu=0;iu<NA;iu++){
      const c0=colMap[iu],c1=colMap[iu+1];
      if(c0<0||c1<0)continue;
      for(let r=0;r<ROWS;r++){
        const a=baseIdx+c0*(ROWS+1)+r, b=baseIdx+c1*(ROWS+1)+r;
        idx.push(a,b+1,b, a,a+1,b+1);
      }
    }
  }
  if(!idx.length) return null;

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(P),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(C),3));
  g.setAttribute('skinIndex',new THREE.BufferAttribute(new Uint16Array(SI),4));
  g.setAttribute('skinWeight',new THREE.BufferAttribute(new Float32Array(SW),4));
  g.setIndex(idx.length>65535?new THREE.BufferAttribute(new Uint32Array(idx),1)
                             :new THREE.BufferAttribute(new Uint16Array(idx),1));
  g.computeVertexNormals();
  const m=new THREE.SkinnedMesh(g,new THREE.MeshStandardMaterial({
    vertexColors:true,roughness:0.58,metalness:0.03,side:THREE.DoubleSide}));
  m.frustumCulled=false;
  return m;
}

// ── the user's hair, built from its measurements (fitHair) ──
// A shell over the scalp wherever the photo shows hair — above the measured
// hairline at the front, over the sides and back — as thick as the photo's
// silhouette stands off the head at each height (each side), the top from how
// high the hair rises; its edge sinks just under the skin, so the hairline is
// the smooth line where it emerges, not the grid's steps. Hair that hangs
// beside the face becomes a curtain to each side's measured length, and every
// vertex a photo saw as hair takes that photo's colour.
function buildHairFit(H,nrm,COL,F,skinCol){
  const NA=H.NA, NP=H.NP, nv=(NA+1)*(NP+1), P=H.pos;
  // the head's own silhouette (each side) and top, from the conformed mesh
  const BIN=0.002, Y0=-0.22, NB=Math.ceil(0.44/BIN), bin=y=>clamp(Math.floor((y-Y0)/BIN),0,NB-1);
  const headPos=new Float32Array(NB).fill(-1), headNeg=new Float32Array(NB).fill(1); let headTop=-1;
  for(let i=0;i<nv;i++){ const b=bin(P[i*3+1]); headPos[b]=Math.max(headPos[b],P[i*3]); headNeg[b]=Math.min(headNeg[b],P[i*3]); headTop=Math.max(headTop,P[i*3+1]); }
  // the hair's silhouette per side, binned the same way; thickness = how far it
  // stands off the head there (gaps filled from the nearest measured height)
  const hPos=new Float32Array(NB).fill(NaN), hNeg=new Float32Array(NB).fill(NaN);
  for(const [y,xn,xp] of F.rows){ const b=bin(y); if(xp!=null) hPos[b]=isNaN(hPos[b])?xp:Math.max(hPos[b],xp); if(xn!=null) hNeg[b]=isNaN(hNeg[b])?xn:Math.min(hNeg[b],xn); }
  const thick=(h,head,sgn)=>{ const t=new Float32Array(NB).fill(NaN);
    for(let b=0;b<NB;b++) if(!isNaN(h[b])&&Math.abs(head[b])<0.5) t[b]=clamp(sgn*(h[b]-head[b]),0.002,0.07);
    let last=NaN; for(let b=NB-1;b>=0;b--){ if(!isNaN(t[b])) last=t[b]; else if(!isNaN(last)) t[b]=last; }   // up to the crown
    const sm=new Float32Array(NB); for(let b=0;b<NB;b++){ let a=0,n=0; for(let k=-3;k<=3;k++){ const v=t[clamp(b+k,0,NB-1)]; if(!isNaN(v)){ a+=v; n++; } } sm[b]=n?a/n:NaN; }
    return sm; };
  const tPos=thick(hPos,headPos,1), tNeg=thick(hNeg,headNeg,-1);
  const tTop=clamp((F.top!=null?F.top:headTop+0.008)-headTop,0.002,0.08), tFront=Math.min(0.007,tTop);
  // the front hairline, by model x (extended level past its ends, then down the temples)
  const HL=F.hairline.slice().sort((a,b)=>a[0]-b[0]);
  const hairlineAt=x=>{ if(!HL.length) return 0.052; if(x<=HL[0][0]) return HL[0][1]-0.6*(HL[0][0]-x);
    if(x>=HL[HL.length-1][0]) return HL[HL.length-1][1]-0.6*(x-HL[HL.length-1][0]);
    let k=1; while(HL[k][0]<x) k++; const a=HL[k-1], b=HL[k], t=(x-a[0])/((b[0]-a[0])||1e-6); return a[1]+(b[1]-a[1])*t; };
  const at=(iu,iv)=>iv*(NA+1)+iu;
  const cov=new Float32Array(nv), t=new Float32Array(nv);
  for(let i=0;i<nv;i++){
    const x=P[i*3],y=P[i*3+1],z=P[i*3+2], ax=Math.abs(x);
    const wF=smoothstep(0.015,0.055,z)*(1-smoothstep(0.045,0.075,ax)), back=cl01(-z/0.06);
    const line=mix(mix(0.0,-0.05,back),hairlineAt(x),wF);
    // a taper several grid rows deep (over one row the shell's edge hugged the
    // rows and came out in steps), measured across the hairline — where it
    // falls steeply toward a temple, height alone put the whole taper in one
    // column
    const sl=wF>0.01?(hairlineAt(x+0.002)-hairlineAt(x-0.002))/0.004*wF:0;
    cov[i]=smoothstep(-0.004,0.016,(y-line)/Math.sqrt(1+sl*sl));
    const nx=nrm[i*3],ny=nrm[i*3+1],nz=nrm[i*3+2], b=bin(y);
    let side=x>0?tPos[b]:tNeg[b]; if(isNaN(side)) side=0.004;
    const tb=Math.max(isNaN(tPos[b])?0:tPos[b],isNaN(tNeg[b])?0:tNeg[b],0.004);
    t[i]=nx*nx*side+(ny>0?ny*ny*tTop:ny*ny*side)+(nz>0?nz*nz*tFront:nz*nz*tb);
  }
  // even the thickness over the scalp's own grid
  for(let pass=0;pass<3;pass++){ const o=Float32Array.from(t);
    for(let iv=1;iv<NP;iv++) for(let iu=0;iu<=NA;iu++){ const i=at(iu,iv), l=at(iu>0?iu-1:NA-1,iv), r=at(iu<NA?iu+1:1,iv);
      t[i]=0.4*o[i]+0.15*(o[l]+o[r]+o[at(iu,iv-1)]+o[at(iu,iv+1)]); } }
  const noise=(x,y,z)=>{const s=Math.sin(x*211.3+y*157.7+z*93.1)*43758.545;return s-Math.floor(s);};
  const base=F.colorLin||[0,1,2].map(k=>srgb2lin(new THREE.Color().setHSL(COL.hair.h,COL.hair.s,COL.hair.l).toArray()[k]));
  // the photos that saw hair: each view's camera and mask
  const VIEWS=['center','left','right'].map(id=>{ const sh=ID.shots&&ID.shots[id]; if(!sh) return null; const m=hairMask(sh); if(!m) return null;
    const cam=fitCamera(ID.lm,sh.lm,sh.W,sh.H,id); return cam?{sh,m,...cam}:null; }).filter(Boolean);
  const photoCol=(x,y,z,nx,ny,nz)=>{ let a=[0,0,0], w=0;
    for(const V of VIEWS){ const f=nx*V.dir[0]+ny*V.dir[1]+nz*V.dir[2]; if(f<0.25) continue;
      const [u,v]=V.project(x,y,z);
      const X=Math.round(u), Yy=Math.round(v); if(X<1||Yy<1||X>=V.sh.W-1||Yy>=V.sh.H-1||V.m[Yy*V.sh.W+X]<128) continue;
      const s=sampleShot(V.sh.px,V.sh.W,V.sh.H,u,v); if(!s) continue; const k=f*f; a[0]+=s[0]*k; a[1]+=s[1]*k; a[2]+=s[2]*k; w+=k; }
    return w?[a[0]/w,a[1]/w,a[2]/w,w]:null; };
  const G=ID.gain||[1,1,1];
  const colorAt=(x,y,z,nx,ny,nz,seed)=>{ const sh=0.78+0.4*noise(x*13,y*47+seed,z*13);   // strands run down the head
    let c=base.map(v=>v*sh); const ph=photoCol(x,y,z,nx,ny,nz);
    if(ph){ const k=Math.min(1,ph[3]*1.6); c=c.map((v,j)=>v+(ph[j]*(0.9+0.2*sh)-v)*k); }
    return c.map((v,j)=>Math.min(1,v)*G[j]); };
  const pos=new Float32Array(nv*3), col=new Float32Array(nv*3), si=new Uint16Array(nv*4), sw=new Float32Array(nv*4);
  const cover=H.hairCover=new Float32Array(nv);
  for(let i=0;i<nv;i++){
    const c=cov[i], th=t[i]*c-0.0008*(1-c);                 // the edge sinks just under the skin
    const x=P[i*3]+nrm[i*3]*th, y=P[i*3+1]+nrm[i*3+1]*th, z=P[i*3+2]+nrm[i*3+2]*th;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z; cover[i]=smoothstep(0.1,0.6,c);
    const cc=colorAt(x,y,z,nrm[i*3],nrm[i*3+1],nrm[i*3+2],0);
    // where the shell thins to nothing it takes the skin's colour beneath, so
    // the hairline reads as a soft change of colour, not the mesh's edge
    if(skinCol){ const k=smoothstep(0.12,0.55,c); for(let j=0;j<3;j++) cc[j]=skinCol[i*3+j]+(cc[j]-skinCol[i*3+j])*k; }
    col.set(cc,i*3);
    si[i*4]=2; si[i*4+1]=1; sw[i*4]=1; sw[i*4+1]=0;
  }
  const idx=[];
  for(let iv=0;iv<NP;iv++) for(let iu=0;iu<NA;iu++){
    const a=at(iu,iv),b=at(iu+1,iv),c=at(iu+1,iv+1),d=at(iu,iv+1);
    if(Math.max(cov[a],cov[b],cov[c],cov[d])>0.02) idx.push(a,c,b,a,d,c);
  }
  const Pp=[...pos], C=[...col], SI=[...si], SW=[...sw];
  // hair that hangs: from the covered scalp's lower edge down each side to its
  // own measured length (the back to the longer side), as wide as the
  // silhouette stands at each height
  const hang=s=>{ const L=s>0?F.lenPos:F.lenNeg; return L!=null&&L<-0.02?L:null; };
  const lenBack=[hang(1),hang(-1)].filter(v=>v!=null).reduce((a,b)=>Math.min(a,b),Infinity);
  if(isFinite(lenBack)){
    const ROWS=16, baseIdx=Pp.length/3, colMap=[]; let cols=0;
    const ext=(s,y)=>{ const v=s>0?hPos[bin(y)]:hNeg[bin(y)]; return isNaN(v)?null:Math.abs(v); };
    for(let iu=0;iu<=NA;iu++){
      let root=-1; for(let iv=NP;iv>=0;iv--){ const i=at(iu,iv); if(cov[i]>0.5){ root=i; break; } }
      if(root<0){ colMap.push(-1); continue; }
      const x0=pos[root*3], y0=pos[root*3+1], z0=pos[root*3+2], s=x0>=0?1:-1;
      if(H.front[root]>0.62&&z0>0.03){ colMap.push(-1); continue; }          // keep the face clear
      const side=Math.abs(x0)>0.035&&z0>-0.03, yEnd=side?hang(s):lenBack;
      if(yEnd==null||yEnd>=y0-0.01){ colMap.push(-1); continue; }
      colMap.push(cols++);
      const e0=ext(s,y0)||Math.abs(x0);
      for(let r=0;r<=ROWS;r++){
        const tt=r/ROWS, y=mix(y0,yEnd,Math.pow(tt,0.9)), e=ext(s,y);
        const k=side&&e?clamp(e/Math.max(e0,0.02),0.92,1.5):1+0.10*Math.sin(tt*Math.PI);
        const sway=(noise(x0*30,r*7,z0*30)-0.5)*0.006*tt;
        const x=x0*k+sway, z=(z0+0.012)*k-0.012+sway*0.5;
        Pp.push(x,y,z);
        const rl=Math.hypot(x,z+0.012)||1; C.push(...colorAt(x,y,z,x/rl,0,(z+0.012)/rl,r*3));
        const wh=1-cl01((tt-0.25)/0.75)*0.75, wn=(1-wh)*0.6;
        SI.push(2,1,0,0); SW.push(wh,wn,1-wh-wn,0);
      }
    }
    for(let iu=0;iu<NA;iu++){ const c0=colMap[iu],c1=colMap[iu+1]; if(c0<0||c1<0) continue;
      for(let r=0;r<ROWS;r++){ const a=baseIdx+c0*(ROWS+1)+r, b=baseIdx+c1*(ROWS+1)+r; idx.push(a,b+1,b, a,a+1,b+1); } }
  }
  if(!idx.length) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(Pp),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(C),3));
  g.setAttribute('skinIndex',new THREE.BufferAttribute(new Uint16Array(SI),4));
  g.setAttribute('skinWeight',new THREE.BufferAttribute(new Float32Array(SW),4));
  g.setIndex(idx.length>65535?new THREE.BufferAttribute(new Uint32Array(idx),1):new THREE.BufferAttribute(new Uint16Array(idx),1));
  g.computeVertexNormals();
  // the photo's hair already holds its own highlights: a full sheen of the room
  // on top turned dark hair silver
  const m=new THREE.SkinnedMesh(g,new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.55,metalness:0,
    specularIntensity:HAIR_SPEC,side:THREE.DoubleSide}));
  m.frustumCulled=false;
  return m;
}
const HAIR_SPEC=0.3;

/* ═══ §6 PUPPETEERING — drive the rig from remote AvatarState ═════════ */
const REM={yaw:0,pitch:0,roll:0,bs:{},gx:0,gy:0,val:0,aro:0.3,dom:0.5,
  speaking:false,text:null,gest:null,pros:null,vis:null,target:null,blinkT:0};
for(const k of BS) REM.bs[k]=0;

function gestureOffset(now){
  const g=REM.gest; if(!g) return {y:0,p:0,r:0,bob:0,jaw:0,br:0};
  const t=(now-g.t0)/1000;
  if(t>1.7){ REM.gest=null; return {y:0,p:0,r:0,bob:0,jaw:0,br:0}; }
  const e=Math.exp(-t*2.1);
  if(g.g===1) return {y:0,p:Math.sin(t*10)*15*e,r:0,bob:0,jaw:0,br:0};
  if(g.g===2) return {y:Math.sin(t*10)*19*e,p:0,r:0,bob:0,jaw:0,br:0};
  if(g.g===3) return {y:0,p:-7*e,r:Math.sin(t*8)*4*e,bob:Math.abs(Math.sin(t*8))*0.010*e,
                      jaw:Math.abs(Math.sin(t*12))*0.55*e,br:0.5*e};
  return {y:0,p:6*e,r:Math.sin(t*6)*5*e,bob:Math.abs(Math.sin(t*7))*0.02*e,jaw:0.25*e,br:0.6*e};
}

function puppet(now,dt){
  if(!AV.built) return;
  const B=AV.bones, g=gestureOffset(now), R=Math.PI/180;
  const T=FROZEN?0:now;                 // freeze() holds the idle motion still
  const idleY=Math.sin(T/2900)*1.1, idleP=Math.sin(T/2300+1)*0.8;

  B.head.rotation.set((REM.pitch+g.p+idleP)*R*0.85,(REM.yaw+g.y+idleY)*R*0.80,(REM.roll+g.r)*R*0.75);
  B.neck.rotation.set((REM.pitch+g.p)*R*0.25,(REM.yaw+g.y)*R*0.28,(REM.roll+g.r)*R*0.20);
  const breath=Math.sin(T/(1000/(0.55+REM.aro*1.1)))*0.5+0.5;
  B.root.position.y=-0.30+g.bob+breath*0.0016;
  B.root.rotation.z=Math.sin(T/4100)*0.012;

  // jaw is a real hinge; visemes and gestures add to it
  const jaw=cl01((REM.bs.jawOpen||0)+g.jaw);
  B.jaw.rotation.x=jaw*0.38*(ID.jawGain||1);

  // gaze
  B.eL.rotation.set(REM.gy*0.32,-REM.gx*0.42,0);
  B.eR.rotation.set(REM.gy*0.32,-REM.gx*0.42,0);

  // involuntary blink keeps it alive when tracking is idle
  REM.blinkT-=dt;
  let auto=0;
  if(REM.blinkT<0&&!FROZEN){ REM.blinkT=2.2+Math.random()*3.4; REM.blinkPhase=0; }
  if(REM.blinkPhase!=null&&REM.blinkPhase<1){
    REM.blinkPhase=Math.min(1,(REM.blinkPhase||0)+dt*7.5);
    auto=Math.sin(REM.blinkPhase*Math.PI);
  }
  const inf=AV.head.morphTargetInfluences, M=AV.morphIdx;
  const set=(k,v)=>{ if(M[k]!=null) inf[M[k]]=cl01(v); };
  set('smile',REM.bs.smile*1.1+Math.max(0,REM.val)*0.25+g.br*0.5);
  set('frown',REM.bs.frown+Math.max(0,-REM.val)*0.30);
  set('browUp',REM.bs.browUp+g.br*0.6+Math.max(0,REM.val)*0.10);
  set('browDown',REM.bs.browDown);
  set('blinkL',Math.max(REM.bs.blinkL,auto));
  set('blinkR',Math.max(REM.bs.blinkR,auto));
  set('pucker',REM.bs.pucker);
  set('mouthWide',Math.max(REM.wide||0,REM.bs.wide||0));
  set('funnel',REM.bs.funnel||0);
  set('press',REM.bs.press||0);
}

/* ═══ §7 CAPTURE — MediaPipe → AvatarState ═══════════════════════════ */
const RIGID=[33,263,1,168,6,197,195,5,4,193,417,122,351,234,454];
function kabsch(P,Q){
  let a=0,b=0,c=0,d=0,e=0,f=0,g=0,h=0,i=0;
  for(let k=0;k<P.length;k++){const p=P[k],q=Q[k];
    a+=p[0]*q[0];b+=p[0]*q[1];c+=p[0]*q[2];
    d+=p[1]*q[0];e+=p[1]*q[1];f+=p[1]*q[2];
    g+=p[2]*q[0];h+=p[2]*q[1];i+=p[2]*q[2];}
  const N=[[a+e+i,f-h,g-c,b-d],[f-h,a-e-i,b+d,g+c],[g-c,b+d,-a+e-i,f+h],[b-d,g+c,f+h,-a-e+i]];
  let v=[1,0,0,0];
  for(let it=0;it<32;it++){
    const nv=[0,0,0,0];
    for(let r=0;r<4;r++)for(let s=0;s<4;s++)nv[r]+=N[r][s]*v[s];
    const l=Math.hypot(nv[0],nv[1],nv[2],nv[3])||1; v=nv.map(z=>z/l);
  }
  const [w,x,y,z]=v;
  return [1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y),
          2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x),
          2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)];
}
const D3=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);

// MediaPipe's head transform → the mirror's yaw/pitch/roll (degrees). Its
// angles turn with the head as the camera sees it; the avatar is a mirror,
// so yaw and roll flip and pitch doesn't (measured on posed test heads:
// turn to your right → +yaw → the avatar faces screen-right; look down →
// +pitch → it looks down).
const POSE_SIGN={yaw:-1,pitch:1,roll:-1};
const CAP={neutral:null,latest:null,prev:null,motion:0,jawH:[],live:false,aspect:4/3,
  st:{yaw:0,pitch:0,roll:0,bs:{},gx:0,gy:0,val:0,aro:0.3,dom:0.5,
      speaking:false,gest:0,text:null,textDirty:false,pros:null}};
for(const k of BS) CAP.st.bs[k]=0;

function metrics(lm){
  const iod=D3(lm[33],lm[263])||0.08, ey=(lm[33].y+lm[263].y)/2;
  return {iod, jaw:D3(lm[13],lm[14])/iod, mw:D3(lm[61],lm[291])/iod,
    brL:(lm[159].y-lm[105].y)/iod, brR:(lm[386].y-lm[334].y)/iod,
    eaL:D3(lm[159],lm[145])/(D3(lm[33],lm[133])||1e-4),
    eaR:D3(lm[386],lm[374])/(D3(lm[362],lm[263])||1e-4),
    cor:(((lm[61].y+lm[291].y)/2)-lm[13].y)/iod};
}

// landmark cloud → canonical model space (eyes at y=0, z≈0.055, IOD fixed)
function toModel(lm){
  const ax=CAP.aspect||4/3;          // x and z are normalised by the frame's width, y by its height
  // Scale by the EYE CENTRES (each eye's corner midpoint), where the model
  // keeps its eyes (±eyeX): the outer corners, used before, sit ~96 mm apart,
  // so every face came in ~30% small and the fit pinned sizes at their floor.
  const ec=(a,b)=>[(lm[a].x+lm[b].x)/2*ax,(lm[a].y+lm[b].y)/2,(lm[a].z+lm[b].z)/2*ax];
  const eR=ec(33,133), eL=ec(362,263);
  const iod=Math.hypot(eR[0]-eL[0],eR[1]-eL[1],eR[2]-eL[2])||0.06;
  const s=2*(AN.eyeX+0.0005)/iod, ZG=1.25;
  const cx=(lm[33].x+lm[263].x)/2, cy=(lm[33].y+lm[263].y)/2, cz=(lm[33].z+lm[263].z)/2;
  const o=new Float32Array(468*3);
  for(let i=0;i<468;i++){
    o[i*3]=-(lm[i].x-cx)*ax*s;
    o[i*3+1]=-(lm[i].y-cy)*s;
    o[i*3+2]=-(lm[i].z-cz)*ax*s*ZG+0.055;
  }
  return o;
}

// MediaPipe's blendshapes → VibeMesh's eight. Scores run small for real
// expressions, so each gets a gain; eyes also squint under a smile, so blinks
// start past 0.3. Sides: MediaPipe names the subject's own left and right,
// VibeMesh is a mirror (blinkL is the eye on YOUR right, as a mirror shows
// it), so they cross. At the calibrator's front view the resting scores are
// recorded and taken off, like the landmark path's neutral.
const BS_MAP={
  jawOpen:B=>B.jawOpen*1.25,
  smile:B=>(B.mouthSmileLeft+B.mouthSmileRight)/2*1.35,

function finishCalibration(){
  CAL.active=false;
  const got=Object.keys(CAL.views);
  if(!CAL.views.center){ card('CALIBRATION','no front view · try again'); return; }
  const ref=toModel(CAL.views.center);
  const acc=new Float64Array(468*3), w=new Float64Array(468*3);
  for(let j=0;j<468*3;j++){acc[j]=ref[j]*2;w[j]=2;}
  for(const k of ['left','right','up','down']){
    if(!CAL.views[k])continue;
    const al=alignCloud(toModel(CAL.views[k]),ref);
    for(let j=0;j<468*3;j++){acc[j]+=al[j];w[j]+=1;}
  }
  const fused=new Float32Array(468*3);
  for(let j=0;j<468*3;j++) fused[j]=acc[j]/w[j];
  const raw=got.map(k=>toModel(CAL.views[k]));
  if(Object.keys(CAL.shots).length) ID.shots={...CAL.shots};
  // three or more views: triangulate (§8, bundleViews); the tracker's guess
  // is the fallback

  if(ID.bundled) ID.bundled.ms=Math.round(performance.now()-t0);

// running-average successive sessions so likeness accumulates
function commitIdentity(cloud,nviews,views){
  // 1. lens: undo the close-range magnification before measuring anything
  if(ID.bundled){ ID.lensK=0; ID.lensErr=null; }        // a triangulated cloud is metric already
  else if(views&&views.length>1){
    const est=estimateLensK(views);
    ID.lensK=est.k; ID.lensErr=est.err;
  } else if(ID.lensK==null) ID.lensK=2.2;
  const corr=undoPerspective(cloud,ID.lensK);

  // 2. triangulation confidence: the bundle's residuals, or cross-view convergence
  ID.conf=ID.bundled?ID.bundled.conf:(views&&views.length>1?convergence(views,ID.lensK,corr):null);

  // 3. accumulate across sessions so Refine keeps improving the scan
  if(ID.lm&&CAL.sessions>0&&nviews>1){
    const a=CAL.sessions/(CAL.sessions+1);
    for(let j=0;j<corr.length;j++) corr[j]=ID.lm[j]*a+corr[j]*(1-a);
  }
  if(nviews>1) CAL.sessions++;
  ID.lm=corr;
  ID.meas=measureCloud(corr);
  {  // the silhouette fit (§8b) reads the front shot alone: side views put the
     // oval's points somewhere else on the head
    // (a triangulated cloud puts every outline point at its own depth on its
    // ray — the eye-plane scale of toModel drew the ears' silhouette ~10% narrow)
    const sh=ID.shots&&ID.shots.center, S0=measToShape(ID.meas);
    for(const k of LOCATION_PARAMS) S0[k]=DEFAULT_SHAPE[k];
    const t0=performance.now();
    // outline landmarks the segmenter sees hair on (hair hanging beside the
    // face) are left out: the tracker puts them on the hair's edge
    // (confident hair, above the mouth: on the jaw the segmenter's "hair" is
    // a beard, which is the outline)
    let skip=null; const hm=sh&&hairMask(sh);
    if(hm){ skip=new Set(); const lipV=(sh.lm[61].y+sh.lm[291].y)/2*sh.H;
      for(const [a,b] of OUTLINE_PAIRS) for(const i of [a,b]){ const X=Math.round(sh.lm[i].x*sh.W), Y=Math.round(sh.lm[i].y*sh.H);
        if(X>=0&&Y>=0&&X<sh.W&&Y<sh.H&&Y<lipV&&hm[Y*sh.W+X]>=200) skip.add(i); }
      if(OUTLINE_PAIRS.filter(([a,b])=>!skip.has(a)&&!skip.has(b)).length<6) skip=null; }
    ID.outline=ID.bundled?fitOutline(corr,S0,skip):sh?fitOutline(undoPerspective(toModel(sh.lm),ID.lensK),S0,skip):null;
    if(ID.outline&&skip) ID.outline.skipped=skip.size;
    if(ID.outline) ID.outline.ms=Math.round(performance.now()-t0); }
  refreshHair();                   // the hair, from the segmenter's mask (§8b fitHair)
  autoTraits(corr);

  // 4. per-parameter more/less search against the measurements
  const S0=Object.assign(measToShape(ID.meas), ID.fit||{});
  const base=buildHead(S0,{NA:112,NP:88});
  ID.anchors=orientAnchors(findAnchorVerts(base),corr);
  const t0=performance.now();
  const res=fitShape(corr,ID.conf,ID.anchors,S0,6);
  ID.fit=res.S; ID.fitLog=res.log; ID.fitMs=Math.round(performance.now()-t0);

  ID.gain=null; ID.gainRig=LIGHT.name;         // the loop below measures from no gain
  LIGHT.exposure[LIGHT.name]=1; renderer.toneMappingExposure=1;
  buildAvatar();
  ID.gainLog=calibrateColour();
  reportCard(corr,nviews);
  syncSliders();
  sendIdentity();
}

function measureCloud(f){
  const u=AN.IOD;
  const D=(i,j)=>Math.hypot(f[i*3]-f[j*3],f[i*3+1]-f[j*3+1],f[i*3+2]-f[j*3+2])/u;

    noseL:Math.abs(Y(168)-Y(2)),noseW:D(98,327),mouthW:D(61,291),

}
function reportCard(f,nv){

    'eye width '+mm(D(33,133))+' · eye gap '+mm(D(133,362)),
    'lip width '+mm(lipW)+' · chin→lip '+mm(D(17,152)),
    'nose length '+mm(noseL)+' · nose proj '+(deep?mm(f[4*3+2]-(f[50*3+2]+f[280*3+2])/2):'~'),
    'head = '+rat(faceH,noseL)+' nose · '+rat(faceH,lipW)+' lip',
    'soft tissue '+(AV._adip*100).toFixed(0)+'% · bone '+(AV._bone*100).toFixed(0)+'%',
    (ID.bundled?'triangulated '+ID.bundled.views+' views · f '+ID.bundled.f+'W · '+ID.bundled.rms+' px':'lens k '+(ID.lensK||0).toFixed(2)+(ID.lensErr!=null?' (solved)':' (assumed)'))+

/* ── §8c READING — the user's own mouth ──
   Every mouth said "oo" and "ee" the same way: the generator's. Reading one
   line aloud — «Oh, we see the moon. My pop bought a big fish — ah, mama.» —
   passes the mouth through its extremes (the O, the E, the pursed oo, the
   pressed m/p/b, the open ah), and the tracker's own scores say when each
   peaks; that frame's landmarks, against the calibration's neutral, are the
   user's own shape. The jaw bone's share is taken out (it opens the mouth
   at playback anyway), and the smoothing spline carries the landmarks' moves
   to the mesh as morph targets. Speaking afterwards keeps refining them:
   any frame that beats a stored peak by a margin replaces it. */
const READ={active:false,t0:0,best:{},dirty:false,lastBuild:0,
  LINE:'Oh, we see the moon. My pop bought a big fish — ah, mama.',
  SHAPES:{open:B=>B.jawOpen, pucker:B=>B.jawOpen<0.5?B.mouthPucker:0, funnel:B=>B.mouthFunnel,
    wide:B=>(B.mouthStretchLeft+B.mouthStretchRight)/2, press:B=>(B.mouthPressLeft+B.mouthPressRight)/2}};
function readTick(lm,B){
  if(!CAP.neutral||!B||!CAP.poseAbs) return;
  const P=CAP.poseAbs, p0=CAP.pose0||{yaw:0,pitch:0};
  if(Math.abs(P.yaw)>14||Math.abs(P.pitch-p0.pitch)>16) return;       // a frontal mouth, or the shape is a turn
  const margin=READ.active?1.03:1.15;
  for(const k in READ.SHAPES){ const sc=READ.SHAPES[k](B); if(sc<0.3) continue;
    const b=READ.best[k]; if(b&&sc<b.score*margin) continue;
    READ.best[k]={score:sc,jaw:B.jawOpen,lm:lm.map(p=>({x:p.x,y:p.y,z:p.z})),t:performance.now()}; READ.dirty=true; }
  if(READ.active){
    const got=Object.keys(READ.best).length, el_=performance.now()-READ.t0, done=el_>12000||(el_>5000&&got>=5&&Object.values(READ.best).every(b=>b.score>0.55));
    const f=Math.round(Math.min(1,el_/12000)*10); hint('Read aloud · '+'▰'.repeat(f)+'▱'.repeat(10-f)+' · '+got+'/5 shapes');

}
function startReading(){
  if(!CAP.neutral){ hint('Calibrate first'); return; }
  READ.active=true; READ.t0=performance.now();
  card('READ THIS ALOUD','<span style="font-size:1.05rem;line-height:1.5;letter-spacing:0">«'+READ.LINE+'»</span><br>your own oh · ee · oo · m · ah');
  hint('Read aloud · face the camera');
}
function finishReading(){
  READ.active=false;
  const got=Object.keys(READ.best);
  if(!got.length){ card('READING','no mouth shapes caught · try again, facing the camera'); return; }
  commitMouth();
  card('MOUTH · yours',got.map(k=>k+' '+READ.best[k].score.toFixed(2)).join(' · ')+
    (ID.jawGain?'<br>jaw opens ×'+ID.jawGain.toFixed(2)+' of the model\'s':''));

}
// the captured shapes become the avatar's (rebuilding it); also called for
// the opportunistic refinements, at most every 30 s
function commitMouth(){
  if(!CAP.neutral||!Object.keys(READ.best).length) return;
  ID.mouth={neutral:CAP.neutral.pts.map(p=>({x:p[0],y:p[1],z:p[2]})),shapes:{}};
  for(const k in READ.best) ID.mouth.shapes[k]={lm:READ.best[k].lm,jaw:READ.best[k].jaw,score:READ.best[k].score};
  READ.dirty=false; READ.lastBuild=performance.now();

setInterval(()=>{ if(READ.dirty&&!READ.active&&!CAL.active&&ID.mouth&&performance.now()-READ.lastBuild>30000&&!TES.waiting) commitMouth(); },5000);
// the shapes → morph targets on this head (called by buildAvatar)
function mouthMorphs(H,si,sw,jawPivot){
  const M=ID.mouth; if(!M||!ID.lm) return null;
  const neutral=toModel(M.neutral), out={}, z0=(CAP.bsZero&&CAP.bsZero.jawOpen)||0;
  const jawAngle=raw=>cl01((raw*1.25-z0)/Math.max(0.35,1-z0))*0.38;       // as the live path and puppet do
  const mc=[(ID.lm[13*3]+ID.lm[14*3])/2,(ID.lm[13*3+1]+ID.lm[14*3+1])/2,(ID.lm[13*3+2]+ID.lm[14*3+2])/2];
  // each landmark's jaw share: the nearest vertex's weight (bone 3, slot 1)
  const jawW=new Float32Array(468);
  for(let i=0;i<468;i++){ const x=ID.lm[i*3],y=ID.lm[i*3+1],z=ID.lm[i*3+2]; if(!isFinite(x)) continue;
    let best=1e9, bv=-1; for(let v=0;v<H.nv;v++){ const d=(H.pos[v*3]-x)**2+(H.pos[v*3+1]-y)**2+(H.pos[v*3+2]-z)**2; if(d<best){ best=d; bv=v; } }
    if(bv>=0) jawW[i]=sw[bv*4+1]; }
  const toKey={open:null,pucker:'pucker',funnel:'funnel',wide:'mouthWide',press:'press'};
  for(const k in M.shapes){
    const S=M.shapes[k], P=alignCloud(toModel(S.lm),neutral), th=jawAngle(S.jaw), c=Math.cos(th), sn=Math.sin(th);
    const A=[], R=[], Wt=[];
    for(let i=0;i<468;i++){ const x=ID.lm[i*3],y=ID.lm[i*3+1],z=ID.lm[i*3+2]; if(!isFinite(x)||!isFinite(P[i*3])) continue;
      let d=[P[i*3]-neutral[i*3],P[i*3+1]-neutral[i*3+1],(P[i*3+2]-neutral[i*3+2])*0.5];
      const far=Math.hypot(x-mc[0],y-mc[1],z-mc[2]);

/* ═══ §8b LIKENESS — the user's own face, on the fitted head ═════════════
   The fitter (§4b) moves parameters, so every face it makes is a plausible
   face — but only the faces its sliders can reach. What calibration captured
   takes it the rest of the way:
   · CONFORM — every inner landmark, where the tracker itself finds it on the
     model, warped to the user's by a smoothing spline; the outline (head
     width, jaw, taper, face length) fitted to the front photo's silhouette;
     the eyes' and mouth's rims set on the user's own contours; eyeballs,
     teeth and mouth moved with them, so nothing drifts out of the face.
   · HAIR — segmented in each photo, measured (hairline, silhouette, length
     each side, colour) and grown as a shell and curtain to match.
   · PHOTO — every face vertex is projected into each calibration photograph
     (a least-squares camera fitted on the 468 tracked points, plus their
     local residuals, so lens and pose are the data's own), weighted by how
     squarely that view saw it, the photograph's own light divided out, and
     written into the head's colours as linear albedo. The tesserae sample
     those colours, so the mosaic is laid from the user's face: brows,
     lashes, lips, freckles, beard — whatever the camera saw.            */
// The warp starts from the DEFAULT head — the one the tracker table was
// measured on — so each landmark's place on the model is exact. Parameters
// that move a feature's LOCATION (eye spacing, mouth width, nose length…)
// would carry features away from their landmarks, so under the warp they
// stay at default; soft tissue (fat, bone, folds) moves the surface under
// the landmarks consistently and keeps its fitted values.
// The warp is a SMOOTHING biharmonic spline (φ(r) = −r in 3D — conditionally
// positive definite, so the smoothing adds to it — plus a constant):
// among all fields near the landmarks it is the one that bends least, so noisy
// or mutually inconsistent targets are smoothed through instead of rung around.
// (A Gaussian RBF interpolating every target exactly crumpled the face: dents
// and ridges wherever neighbouring landmarks disagreed by a millimetre.) The
// features' landmarks — eyes, brows, lips, nose, dense and well tracked — are
// held tight; the rest loosely; depth, the tracker's least sure axis, loosest.
const CONFORM={lam:0.001,lamZ:0.01,featW:8,z:0.7,max:0.018,step:1,zTri:1.0,lamZTri:0.003};   // …Tri: with a triangulated cloud (§8)
const LOCATION_PARAMS=['headW','faceLen','jawW','jawTaper','chinProj','noseLen','noseW','noseProj','eyeSpacing','eyeSize',
  'mouthW','lipFull','browHeight','browProm','cheekProm'];
// The smoothing spline itself: anchors A (xyz), their targets R (xyz),
// weights Wt (a heavier anchor is held tighter), λ for x/y and λz for depth.
// Returns field(x,y,z,out) — the displacement anywhere.
function fitSpline(A,R,Wt,lam,lamZ){
  const n=A.length; if(n<20) return null;
  const N=n+1, D=new Float64Array(n*n);
  for(let i=0;i<n;i++) for(let j=0;j<i;j++){ const r=Math.hypot(A[i][0]-A[j][0],A[i][1]-A[j][1],A[i][2]-A[j][2]); D[i*n+j]=r; D[j*n+i]=r; }
  // [−D + λ/W, 1; 1ᵀ, 0]·[w; c] = [r; 0], by LU with partial pivoting
  const solve=(lam,cols)=>{
    const M=new Float64Array(N*N), piv=new Int32Array(N);
    for(let i=0;i<n;i++){ for(let j=0;j<n;j++) M[i*N+j]=-D[i*n+j]; M[i*N+i]+=lam/Wt[i]; M[i*N+n]=1; M[n*N+i]=1; }
    for(let c=0;c<N;c++){ let p=c, best=Math.abs(M[c*N+c]);
      for(let r=c+1;r<N;r++){ const v=Math.abs(M[r*N+c]); if(v>best){ best=v; p=r; } }
      piv[c]=p; if(p!==c) for(let k=0;k<N;k++){ const t=M[c*N+k]; M[c*N+k]=M[p*N+k]; M[p*N+k]=t; }
      const d=M[c*N+c]||1e-18;
      for(let r=c+1;r<N;r++){ const f=(M[r*N+c]/=d); if(f) for(let k=c+1;k<N;k++) M[r*N+k]-=f*M[c*N+k]; } }
    return cols.map(col=>{ const x=new Float64Array(N); for(let i=0;i<n;i++) x[i]=R[i][col];
      for(let c=0;c<N;c++){ const p=piv[c]; if(p!==c){ const t=x[c]; x[c]=x[p]; x[p]=t; } }
      for(let r=1;r<N;r++){ let v=x[r]; for(let k=0;k<r;k++) v-=M[r*N+k]*x[k]; x[r]=v; }
      for(let r=N-1;r>=0;r--){ let v=x[r]; for(let k=r+1;k<N;k++) v-=M[r*N+k]*x[k]; x[r]=v/(M[r*N+r]||1e-18); }
      return x; });
  };
  const [wx,wy]=solve(lam,[0,1]), [wz]=solve(lamZ,[2]);
  const field=(x,y,z,out=[0,0,0])=>{ let a=wx[n],b=wy[n],c=wz[n];
    for(let j=0;j<n;j++){ const r=Math.hypot(x-A[j][0],y-A[j][1],z-A[j][2]); a-=wx[j]*r; b-=wy[j]*r; c-=wz[j]*r; }
    out[0]=a; out[1]=b; out[2]=c; return out; };

}
let CONFORM_FEAT=null, CONFORM_CACHE=null;
function conformField(S,cloud,conf){
  if(!cloud) return null;
  const key=JSON.stringify(S)+'|'+JSON.stringify(CONFORM)+'|'+!!ID.bundled;
  const zW=ID.bundled?CONFORM.zTri:CONFORM.z, lamZ=ID.bundled?CONFORM.lamZTri:CONFORM.lamZ;
  if(CONFORM_CACHE&&CONFORM_CACHE.cloud===cloud&&CONFORM_CACHE.conf===conf&&CONFORM_CACHE.key===key) return CONFORM_CACHE.field;
  if(!CONFORM_FEAT) CONFORM_FEAT=new Set([...EYE_IDS.flat(),...BROW_IDS.flat(),...LIPS_IDS,...LIPS_IN_IDS,...NOSE_IDS]);
  const P=derived(S), o=new Float32Array(8), A=[], R=[], Wt=[];
  for(let lm=0;lm<468;lm+=CONFORM.step){
    if(FACE_OVAL.has(lm)&&lm!==152) continue;        // the outline is the tracker's guess
    if(conf&&isFinite(conf[lm])&&conf[lm]<0.25) continue;
    const tp=lmTP(lm); if(!tp) continue;
    const ob=[cloud[lm*3],cloud[lm*3+1],cloud[lm*3+2]]; if(!ob.every(isFinite)) continue;
    sculptPoint(tp[0],tp[1],S,P,o);
    let d=[ob[0]-o[0],ob[1]-o[1],(ob[2]-o[2])*zW];
    const L=Math.hypot(d[0],d[1],d[2]); if(L>CONFORM.max) d=d.map(v=>v*CONFORM.max/L);
    A.push([o[0],o[1],o[2]]); R.push(d); Wt.push(CONFORM_FEAT.has(lm)?CONFORM.featW:1);
  }
  const field=fitSpline(A,R,Wt,CONFORM.lam,lamZ); if(!field) return null;
  const n=A.length; let rms=0, exy=0, ez=0; const q=[0,0,0];
  for(let i=0;i<n;i++){ field(A[i][0],A[i][1],A[i][2],q); rms+=R[i][0]**2+R[i][1]**2+R[i][2]**2;
    exy+=(q[0]-R[i][0])**2+(q[1]-R[i][1])**2; ez+=(q[2]-R[i][2])**2; }
  field.anchors=n; field.rms=Math.sqrt(rms/n); field.fitMm={xy:+(Math.sqrt(exy/n)*1000).toFixed(2),z:+(Math.sqrt(ez/n)*1000).toFixed(2)};

}
// ── the outline, from the front view ──
// The face-oval landmarks sit on the silhouette: their DEPTH is a guess (so
// the conform leaves them out), but where they are in the picture is not.
// Fit head width and the jaw's width and taper so the model's frontal
// silhouette runs through them from the ears to the chin — a narrow jaw on a
// square face was the likeness the conform couldn't reach.
const OUTLINE_PAIRS=[[93,323],[132,361],[58,288],[172,397],[136,365],[150,379],[149,378],[176,400],[148,377]];
function fitOutline(front,S0,skip=null){

  for(const [a,b] of OUTLINE_PAIRS){ const xa=front[a*3],ya=front[a*3+1],xb=front[b*3],yb=front[b*3+1];
    if(skip&&(skip.has(a)||skip.has(b))) continue;                   // hair beside the face is not its outline
    if([xa,ya,xb,yb].every(isFinite)) tgt.push([(ya+yb)/2,Math.abs(xa-xb)/2]); }
  if(tgt.length<6) return null;

  const chinT=isFinite(front[152*3+1])?front[152*3+1]:null;

  // (θ 0…π is x ≥ 0), interpolated where it crosses the height; the front
  // meridian's lowest point is the chin
  let chinM=0;
  const width=S=>{ const P=derived(S), best=new Float64Array(tgt.length); chinM=1;
    for(let i=0;i<=NT;i++){ const th=Math.PI*i/NT; let px=0,py=0;
      for(let j=0;j<=NPh;j++){ sculptPoint(th,Math.PI*j/NPh,S,P,o); const x=o[0], y=o[1];
        if(i===0&&o[2]>0.02) chinM=Math.min(chinM,y);

        px=x; py=y; } }

    chinMm:chinT==null?null:+((chinM-chinT)*1000).toFixed(1),
    rmsMm:[+(Math.sqrt(c0)*1000).toFixed(1),+(Math.sqrt(c1)*1000).toFixed(1)],pairs:tgt.length};

// ── the features' own outlines ──
// The generator cuts every eye as the same ellipse and every mouth as the
// same slit, and the warp only bends them toward the user's. Here each rim is
// set ON the user's contour — the lid margins, the line where the lips meet,
// as tracked — by angle about its centre, and the skin within a few mm
// follows with a falloff, so the eye's shape, the mouth's line and the photo
// on them agree. Returns each eye's contour centre (the eyeball goes there).

  // where the ray from c at angle a leaves the closed polygon C
  const rayHit=(C,c,a)=>{ const dx=Math.cos(a), dy=Math.sin(a); let best=null;
    for(let i=0,j=C.length-1;i<C.length;j=i++){ const ax=C[j][0]-c[0], ay=C[j][1]-c[1], bx=C[i][0]-c[0], by=C[i][1]-c[1];

      for(const k of v.tr){ if(k.t<=e)cur=k; else break; }
      REM.bs.jawOpen+=(cur.j*v.amp-REM.bs.jawOpen)*0.55;
      REM.bs.pucker+=(cur.p-REM.bs.pucker)*0.45;
      REM.wide=mix(REM.wide,cur.w,0.45);
      REM.speaking=true;
    }
  } else if(REM.pros&&t.speaking&&t.tier<4){          // (a tracked mouth is better than an envelope)
    REM.bs.jawOpen+=(REM.pros.energy*0.65-REM.bs.jawOpen)*0.4;
  }
}

const flat=el('flat'); let activeTier=0;

  if(t===Tier.SPRITE||t===Tier.PUPPET){
    const c=document.createElement('canvas'); c.width=c.height=440; flat.appendChild(c); R.c=c; }
}
const R={};
function drawFlat(now){
  if(activeTier===Tier.TEXT){ const e=el('rt');
    if(e) e.textContent=(REM.text||'…connected')+(REM.speaking?' ▍':''); return; }
  if(activeTier===Tier.GLYPH&&R.g){
    const v=REM.val,a=REM.aro;
    let s=v>0.15?(a>0.5?'😄':'🙂'):v<-0.15?(a>0.5?'😠':'😔'):(a>0.6?'😮':'😐');
    if(REM.gest) s={1:'🙂',2:'🙅',3:'😂',4:'🙌'}[REM.gest.g]||s;
    if(REM.speaking) s+='💬';
    if(R.g.textContent!==s) R.g.textContent=s;
    R.g.style.transform=`rotate(${REM.roll*0.35}deg) translateX(${REM.yaw*0.7}px)`;
    return;
  }
  if(!R.c) return;
  const x=R.c.getContext('2d'), W=440, H=440, b=REM.bs;
  x.clearRect(0,0,W,H); x.save();
  const g=gestureOffset(now);
  x.translate(W/2+(REM.yaw+g.y)*2.2, H/2+(REM.pitch+g.p)*1.7-g.bob*1800);
  x.rotate((REM.roll+g.r)*Math.PI/300);
  const puppet=activeTier===Tier.PUPPET;
  const sk=new THREE.Color().setHSL(COL.skin.h,COL.skin.s,COL.skin.l);
  const hx=c=>`rgb(${(c.r*255)|0},${(c.g*255)|0},${(c.b*255)|0})`;
  if(puppet){
    const gr=x.createRadialGradient(-26,-34,16,0,0,158);
    gr.addColorStop(0,hx(sk.clone().offsetHSL(0,0,0.08)));
    gr.addColorStop(1,hx(sk.clone().offsetHSL(0,0,-0.12)));
    x.fillStyle=gr;
  } else x.fillStyle=hx(sk);
  x.beginPath(); x.ellipse(0,4,108,132,0,0,7); x.fill();
  if(puppet){
    const hc=new THREE.Color().setHSL(COL.hair.h,COL.hair.s,COL.hair.l);
    x.fillStyle=hx(hc);
    x.beginPath(); x.ellipse(0,-64,110,76,0,Math.PI,0); x.fill();
    x.strokeStyle=hx(hc); x.lineWidth=9; x.lineCap='round';
    const bl=-b.browUp*16+b.browDown*7;
    for(const s of[-1,1]){ x.beginPath(); x.moveTo(s*24,-58+bl);
      x.quadraticCurveTo(s*48,-70+bl,s*72,-55+bl); x.stroke(); }
  }
  for(const s of[-1,1]){
    const bk=s<0?b.blinkL:b.blinkR;
    x.fillStyle='#f6f2ec'; x.beginPath();
    x.ellipse(s*48,-26,22,14*(1-bk*0.92),0,0,7); x.fill();
    if(bk<0.7){ const ic=new THREE.Color().setHSL(COL.iris.h,COL.iris.s,COL.iris.l);
      x.fillStyle=hx(ic); x.beginPath();
      x.arc(s*48+REM.gx*9,-26+REM.gy*5,8,0,7); x.fill();
      x.fillStyle='#0b0810'; x.beginPath();
      x.arc(s*48+REM.gx*9,-26+REM.gy*5,3.6,0,7); x.fill(); }
  }
  const lc=new THREE.Color().setHSL(COL.lips.h,COL.lips.s,COL.lips.l);
  const open=(b.jawOpen+g.jaw)*50+(REM.speaking?5:0);
  const sm=REM.val*26-b.frown*14, wd=52*(1-b.pucker*0.5)*(1+(REM.wide||0)*0.25);
  x.fillStyle=hx(lc); x.beginPath();
  x.moveTo(-wd,72-sm*0.3); x.quadraticCurveTo(0,72+sm,wd,72-sm*0.3);
  x.quadraticCurveTo(0,72+sm+Math.max(4,open),-wd,72-sm*0.3); x.fill();
  if(open>16){ x.fillStyle='#f2ece2'; x.fillRect(-wd*0.5,74+sm*0.4,wd,6); }
  x.restore();
}

/* ═══ §13 SCENE + LOOP ═══════════════════════════════════════════════ */
let scene,camera,renderer,orbit={yaw:0,pitch:0,dist:0.60,drag:null};
const LIGHT={name:'room',rigs:null,exposure:{room:1,vibe:1},key:0.9,fill:0.9};   // exposure: set by calibrateColour; key/fill: the room rig's
let frames=0,lastFps=performance.now(),fpsEma=60,lastT=performance.now();
function initScene(){
  renderer=new THREE.WebGLRenderer({canvas:el('gl'),antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,0.01,10);
  camera.position.set(0,-0.022,0.60);
  // Light units: r155+ lights are physical, r134's carried an extra π —
  // so hemisphere and directional intensities are ×π. The point lights also
  // fell off linearly to their range then (decay 1); now it's 1/d, so their
  // intensity is matched to the old light at the head's distance d:
  // I·π·(1 − d/range)·d.
  const PI=Math.PI, pt=(I,range,p)=>{ const d=Math.hypot(...p); return I*PI*(1-d/range)*d; };
  const hemi=new THREE.HemisphereLight(0x9fb6dd,0x2a2018,0.48*PI); scene.add(hemi);
  const key=new THREE.DirectionalLight(0xfff3e8,1.05*PI); key.position.set(0.35,0.55,0.95);
  scene.add(key);
  const fill=new THREE.DirectionalLight(0xbcd6ff,0.34*PI); fill.position.set(-0.75,0.05,0.45);
  scene.add(fill);
  const rim=new THREE.PointLight(0x66d9ff,pt(0.55,2.2,[-0.32,0.22,-0.34]),2.2,1); rim.position.set(-0.32,0.22,-0.34);
  scene.add(rim);
  const warm=new THREE.PointLight(0xff8a58,pt(0.30,2.0,[0.36,-0.24,-0.18]),2.0,1); warm.position.set(0.36,-0.24,-0.18);
  scene.add(warm);
  AV.key=key;
  // Two rigs. ROOM is the tessera-mosaic page's: an environment to reflect
  // (three's RoomEnvironment, prefiltered for every roughness) and one white
  // key — the light the optical language was measured under, and the one a
  // likeness is judged in (through PBR Neutral rather than the page's AgX). VIBE is VibeMesh's own moody rig
  // (sky/ground, cyan rim, warm kicker, a key tinted by mood).
  const env=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer),0.04).texture;
  LIGHT.rigs={
    // (a hemisphere fill, neutral, so the light isn't the key's alone: the
    // key and the room's ceiling lit the top of the head 4× brighter than under
    // the chin, and a camera's room doesn't — the chin-up view read 7 L* dark,
    // the chin-down view 10 bright)
    room:()=>{ scene.environment=env; fill.intensity=0; rim.intensity=0; warm.intensity=0;
      hemi.color.set(0xe8ecf2); hemi.groundColor.set(0xd8cfc6); hemi.intensity=LIGHT.fill;
      key.intensity=LIGHT.key; key.color.set(0xffffff); key.position.set(0.55,0.85,1.1);
      renderer.toneMapping=THREE.CustomToneMapping; renderer.toneMappingExposure=LIGHT.exposure.room; },   // PBR Neutral (top)
    vibe:()=>{ scene.environment=null; hemi.color.set(0x9fb6dd); hemi.groundColor.set(0x2a2018); hemi.intensity=0.48*PI; fill.intensity=0.34*PI;
      rim.intensity=pt(0.55,2.2,[-0.32,0.22,-0.34]); warm.intensity=pt(0.30,2.0,[0.36,-0.24,-0.18]);
      key.intensity=1.05*PI; key.position.set(0.35,0.55,0.95);
      renderer.toneMapping=THREE.LinearToneMapping; renderer.toneMappingExposure=LIGHT.exposure.vibe; },   // (plain, but with an exposure)
  };
  LIGHT.rigs[LIGHT.name]();

  const cv=renderer.domElement;
  cv.addEventListener('pointerdown',e=>orbit.drag=[e.clientX,e.clientY]);
  addEventListener('pointerup',()=>orbit.drag=null);
  addEventListener('pointermove',e=>{
    if(!orbit.drag)return;
    orbit.yaw+=(e.clientX-orbit.drag[0])*0.006;
    orbit.pitch=clamp(orbit.pitch+(e.clientY-orbit.drag[1])*0.004,-0.55,0.55);
    orbit.drag=[e.clientX,e.clientY];
  });
  cv.addEventListener('wheel',e=>{orbit.dist=clamp(orbit.dist+e.deltaY*0.0005,0.26,1.0);},{passive:true});
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  (function loop(){
    requestAnimationFrame(loop);
    const now=performance.now(), dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
    remoteTick(); sendLoop(now);
    if(activeTier===Tier.AVATAR3D){
      puppet(now,dt);
      if(AV.root){ AV.root.rotation.y=orbit.yaw; AV.root.rotation.x=orbit.pitch; }
      driveTesserae();
      camera.position.z+=(orbit.dist-camera.position.z)*0.1;
      if(AV.key&&LIGHT.name==='vibe') AV.key.color.setHSL(REM.val>0?0.09:0.58,0.10+Math.abs(REM.val)*0.14,0.96,THREE.SRGBColorSpace);
      renderer.render(scene,camera);
    } else { renderer.clear(); drawFlat(now); }
    frames++;
    if(now-lastFps>500){
      const fps=Math.round(frames*1000/(now-lastFps));
      fpsEma+=(fps-fpsEma)*0.3; el('t-fps').textContent=fps;
      NET.kbps=NET.tx*8/((now-lastFps)/1000)/1000;
      el('t-bw').textContent=NET.kbps.toFixed(1);
      NET.tx=0; frames=0; lastFps=now;
      if(lastTx){
        const hx=[...lastTx.slice(0,22)].map(v=>v.toString(16).padStart(2,'0')).join(' ');
        el('insp').innerHTML=`pkt <b>${lastTx.length} B</b> @ ${HZ[AGREED.send]} Hz · ${TN[AGREED.send]}`+
          `<span class="hx">${hx}${lastTx.length>22?' …':''}</span>`;
      }
      adaptQuality();
    }
  })();
}
function adaptQuality(){
  if(!AV.built||activeTier!==Tier.AVATAR3D)return;
  if(FROZEN) return;
  // step down ONCE: `quality>0.55` stayed true at 0.62, so a slow device
  // rebuilt the avatar (and now its mosaic) every ~1.5 s while it stayed slow
  if(fpsEma<24&&AV.quality>0.62){ AV.quality=0.62; buildAvatar(); fpsEma=45; }
  else if(fpsEma>52&&AV.quality<1&&PROF.me.bat>30){ AV.quality=1; buildAvatar(); fpsEma=45; }
}

function hint(t){ const h=el('hint'); h.textContent=t; h.classList.add('on');

/* ── the tracker: MediaPipe Tasks FaceLandmarker ──
   The legacy FaceMesh solution this page was written on is deprecated and
   unreliable on iOS Safari, and its camera helper opened a SECOND camera
   stream — on an iPad the button said "Live" while nothing tracked, every
   error swallowed. The Tasks API runs there, off the one stream the preview
   shows, and adds what the landmark heuristics could only guess: 52
   blendshapes and the head's rigid transform. Landmarks keep the legacy
   shape (normalised x, y, z; 478 with the irises), so the calibrator and the
   identity fit read them unchanged. */
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const TRK={on:false,lmk:null,delegate:'',frames:0,lost:0,tp:0,err:null};
async function createTracker(){
  const {FaceLandmarker,FilesetResolver}=await import(MP+'/vision_bundle.mjs');
  const files=await FilesetResolver.forVisionTasks(MP+'/wasm');
  let err=null;
  const order=/[?&]cpu\b/.test(location.search)?['CPU']:['GPU','CPU'];   // ?cpu forces the CPU path
  for(const delegate of order){                    // some iPads refuse the GPU delegate
    try{
      TRK.lmk=await FaceLandmarker.createFromOptions(files,{
        baseOptions:{modelAssetPath:MP_MODEL,delegate},runningMode:'VIDEO',numFaces:1,
        outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true});
      TRK.delegate=delegate; return;
    }catch(e){ err=e; console.warn('FaceLandmarker '+delegate+':',e); }
  }
  throw err||new Error('no tracker');
}
// ── hair, segmented ──
// MediaPipe's hair segmenter (≈0.8 MB, same wasm as the tracker) reads hair
// per pixel in each calibration photo — the colour classifier before it only
// walked up the forehead, and couldn't tell blond hair from skin or strands
// from shadow. It loads alongside the tracker; everything that uses it falls
// back to the old reading if it can't.
const HAIR_MODEL='https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite';
const SEG={seg:null,ready:null,err:null,delegate:null};
function loadSegmenter(){
  if(SEG.ready) return SEG.ready;
  SEG.ready=(async()=>{
    const {ImageSegmenter,FilesetResolver}=await import(MP+'/vision_bundle.mjs');
    const files=await FilesetResolver.forVisionTasks(MP+'/wasm');
    const order=/[?&]cpu\b/.test(location.search)?['CPU']:['GPU','CPU'];
    let err=null;
    for(const delegate of order){
      try{ SEG.seg=await ImageSegmenter.createFromOptions(files,{baseOptions:{modelAssetPath:HAIR_MODEL,delegate},
          runningMode:'IMAGE',outputCategoryMask:false,outputConfidenceMasks:true});
        SEG.delegate=delegate; return SEG.seg; }
      catch(e){ err=e; console.warn('hair segmenter '+delegate+':',e); }
    }
    SEG.err=err; throw err;
  })();
  SEG.ready.catch(()=>{});
  return SEG.ready;
}
// a shot's hair confidence, 0–255 per pixel (null when there is no segmenter)
const HAIRMASK=new WeakMap();
function hairMask(sh){
  if(HAIRMASK.has(sh)) return HAIRMASK.get(sh);
  if(!SEG.seg) return null;
  let out=null;
  try{
    const r=SEG.seg.segment(new ImageData(new Uint8ClampedArray(sh.px),sh.W,sh.H));
    const cm=r&&r.confidenceMasks, mk=cm&&cm[cm.length-1];            // the last class is hair
    if(mk){ const f=mk.getAsFloat32Array(), w=mk.width, h=mk.height; out=new Uint8Array(sh.W*sh.H);
      for(let y=0;y<sh.H;y++){ const fy=Math.min(h-1,(y*h/sh.H)|0);
        for(let x=0;x<sh.W;x++){ const fx=Math.min(w-1,(x*w/sh.W)|0); out[y*sh.W+x]=Math.round(clamp(f[fy*w+fx],0,1)*255); } } }
    if(r&&r.close) r.close();
  }catch(e){ console.warn('hair segmentation:',e); }
  HAIRMASK.set(sh,out); return out;
}
function trackLoop(video){
  let last=-1, small=null, sctx=null;
  const step=()=>{
    if(!TRK.on) return;
    if(!TRK.paused&&video.readyState>=2&&video.currentTime!==last){
      last=video.currentTime;
      const now=performance.now();
      let r=null;
      // the camera runs at 720p for the photos' sake; on the CPU the tracker
      // reads a 640-wide copy (its landmarks are normalised, so nothing else
      // changes — 720p frames cost it 3× on the CPU)
      let src=video;
      if(TRK.delegate==='CPU'&&video.videoWidth>720){
        const w=640, h=Math.round(640*video.videoHeight/video.videoWidth);
        if(!small){ small=document.createElement('canvas'); small.width=w; small.height=h; sctx=small.getContext('2d',{willReadFrequently:true}); }
        sctx.drawImage(video,0,0,w,h); src=small; }
      try{ r=TRK.lmk.detectForVideo(src,now); }catch(e){ TRK.err=e; console.warn('track:',e); }
      const lm=r&&r.faceLandmarks&&r.faceLandmarks[0];
      if(lm){
        if(TRK.lost>=15) hint('Face found');
        TRK.lost=0; TRK.frames++;
        captureFrame(lm,TRK.tp?(now-TRK.tp)/1000:0,
          {bs:r.faceBlendshapes&&r.faceBlendshapes[0],mat:r.facialTransformationMatrixes&&r.facialTransformationMatrixes[0]});
        TRK.tp=now;
      } else if(++TRK.lost===15) hint('No face · look at the camera, add light');
    }
    if(video.requestVideoFrameCallback) video.requestVideoFrameCallback(step); else requestAnimationFrame(step);
  };
  step();
}
async function startCamera(){
  const b=el('b-cam'), fail=(label,e)=>{ b.textContent=label; b.disabled=false;
    card('CAMERA',(label+' · '+(e&&e.message?e.message:e||'')).replace(/</g,'&lt;')); console.error(label,e); };
  if(TRK.on) return;
  b.textContent='Starting…'; b.disabled=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return fail('No camera API','needs HTTPS and a browser with getUserMedia');
  // the tracker (wasm + model, a few MB) loads while the camera is asked for,
  // and the hair segmenter with it (calibration photos need it, not frames)
  const trk=TRK.lmk?Promise.resolve():createTracker(); trk.catch(()=>{});
  loadSegmenter().then(()=>{ if(ID.shots&&ID.lm&&!ID.hairFit&&refreshHair()){ buildAvatar(); ID.gainLog=calibrateColour(); } }).catch(()=>{});
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:false,
    video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}}); }   // the photo is the face's texture: as sharp as the camera gives
  catch(e){ return fail(e&&e.name==='NotAllowedError'?'Denied':'No camera',e); }
  const pip=el('pip'); pip.srcObject=stream;
  try{ await pip.play(); }catch(_){}
  await new Promise(r=>{ if(pip.readyState>=2) return r(); pip.onloadeddata=r; setTimeout(r,5000); });
  if(!pip.videoWidth) return fail('No frames','the camera gave no picture');
  CAP.aspect=pip.videoWidth/pip.videoHeight;
  b.textContent='Loading tracker…';
  try{ await trk; }catch(e){ return fail('Tracker failed',e); }
  TRK.on=true; trackLoop(pip);
  b.textContent='Live · '+TRK.delegate; b.classList.add('go'); b.disabled=false;
  document.querySelector('.pip').style.opacity=1;
  el('b-cal').disabled=false;
  startCalibration(false);
}

// Every fitted parameter is also a hand control; auto-fit writes into
// the same values, so tuning and fitting are the same knobs.
const SLIDERS=[
  ['headW','Head width',0.80,1.24],['faceLen','Face length',0.84,1.20],
  ['jawW','Jaw width',0.80,1.24],['jawTaper','Jaw taper',0.80,1.25],
  ['chinProj','Chin',0.60,1.55],['cheekProm','Cheekbone',0.55,1.60],
  ['noseLen','Nose length',0.76,1.30],['noseW','Nose width',0.76,1.32],
  ['noseProj','Nose depth',0.65,1.45],['mouthW','Mouth width',0.78,1.28],
  ['lipFull','Lip fullness',0.65,1.50],['browHeight','Brow height',0.78,1.28],
  ['browProm','Brow ridge',0.50,1.60],['eyeSpacing','Eye spacing',0.86,1.16],
  ['eyeSize','Eye size',0.84,1.20],['zygoProm','Zygomatic',0.20,1.80],
  ['goniProm','Gonial angle',0.20,1.80],['tempHollow','Temple hollow',0.10,1.90],
  ['fatMalar','Malar fat',0,1],['fatBuccal','Buccal fat',0,1],
  ['fatJowl','Jowl',0,1],['fatSubmental','Submental',0,1],
  ['fatInfraorb','Under-eye fat',0,1],['fatTemporal','Temple fat',0,1],
  ['foldNasolab','Nasolabial fold',0,1],['foldTear','Tear trough',0,1],
  ['foldMarion','Marionette',0,1],
];
function buildSliders(){
  const g=el('shapeGrid'); if(!g||g.childElementCount) return;
  for(const [k,label,lo,hi] of SLIDERS){

    g.strokeStyle='#ff0'; g.beginPath(); f.hairline.forEach((q,k)=>{ const a=pr(q[0],q[1],0.06); k?g.lineTo(...a):g.moveTo(...a); }); g.stroke();
    g.fillStyle='#f0f'; for(const [y,s] of [[f.lenNeg,-1],[f.lenPos,1]]) if(y!=null){ const a=pr(s*0.09,y,AN.CZ); g.fillRect(a[0]-6,a[1]-2,12,4); }
    g.fillStyle='#fff'; g.font='14px monospace'; g.fillText((f.bald?'BALD ':'')+'top '+f.top+' len+x '+f.lenPos+' len-x '+f.lenNeg,8,18);
    return cv.toDataURL('image/png'); },
  hairMaskImage(id='center'){ const sh=ID.shots&&ID.shots[id]; if(!sh) return null; const m=hairMask(sh); if(!m) return 'no mask';
    const cv=document.createElement('canvas'); cv.width=sh.W; cv.height=sh.H; const g=cv.getContext('2d'), im=new ImageData(new Uint8ClampedArray(sh.px),sh.W,sh.H);
    for(let i=0;i<sh.W*sh.H;i++){ const a=m[i]/255; im.data[i*4]=im.data[i*4]*(1-a)+255*a; im.data[i*4+1]*=1-a*0.8; im.data[i*4+2]*=1-a*0.8; }
    g.putImageData(im,0,0); return cv.toDataURL('image/png'); },
  // the room rig's balance, re-applied and re-calibrated (exposure, balance)
  // a reading, fed synthetically: the neutral landmarks with the lips moved
  // (dx, dy, dz in image units, jawOpen score), for checking the plumbing
  fakeRead(shapes){ if(!CAP.neutral) return 'calibrate first';
    const LIPS=new Set([...LIPS_IDS,...LIPS_IN_IDS,...LIPS_UP_IN,...LIPS_LO_IN]);
    for(const k in shapes){ const o=shapes[k], lm=CAP.neutral.pts.map((p,i)=>{ const q={x:p[0],y:p[1],z:p[2]};
        if(LIPS.has(i)){ q.x+=(q.x-0.5)*(o.sx||0); q.y+=(o.dy||0)*Math.sign(q.y-(CAP.neutral.pts[13][1]+CAP.neutral.pts[14][1])/2||1); q.z+=(o.dz||0); } return q; });
      READ.best[k]={score:o.score||0.8,jaw:o.jaw||0,lm,t:performance.now()}; }
    commitMouth(); return JSON.stringify({mouth:AV.mouth,jawGain:ID.jawGain}); },
  get read(){ return {active:READ.active,best:Object.fromEntries(Object.entries(READ.best).map(([k,b])=>[k,+b.score.toFixed(2)])),mouth:AV.mouth,jawGain:ID.jawGain}; },
  relight(key,fill){ LIGHT.key=key; LIGHT.fill=fill; if(LIGHT.rigs) LIGHT.rigs.room(); ID.gain=null; LIGHT.exposure.room=1; renderer.toneMappingExposure=1;
    buildAvatar(); ID.gainLog=calibrateColour(); return JSON.stringify({key,fill,probe:AV.photo&&AV.photo.probe,x:LIGHT.exposure.room}); },
  calDump(){ const v=el('pip'); return JSON.stringify({W:v.videoWidth,H:v.videoHeight,lm:ID.lm&&Array.from(ID.lm,x=>+x.toFixed(5)),
    views:Object.fromEntries(Object.entries(CAL.views).map(([k,lm])=>[k,lm.map(p=>[+p.x.toFixed(5),+p.y.toFixed(5),+p.z.toFixed(5)])]))}); },
  preloadTracker(){ return (TRK.lmk?Promise.resolve():createTracker()).then(()=>TRK.delegate); },
  trackPause(on=true){ TRK.paused=on; if(on){ const st=CAP.st; st.yaw=st.pitch=st.roll=0; for(const k of BS) st.bs[k]=0; st.gx=st.gy=0; } },
  residuals(){ if(!ID.lm||!AV.S) return null; const get=modelGetter(AV.S), out={};
    for(const [lm] of anchorSpecs(derived(AV.S))){ const m=get(lm); if(!m) continue;
      out[lm]=[0,1,2].map(k=>+((ID.lm[lm*3+k]-m[k])*1000).toFixed(1)); } return out; },
  get cap(){ return {live:!!CAP.latest, neutral:!!CAP.neutral, st:CAP.st, cal:{active:CAL.active,step:CAL.step,views:Object.keys(CAL.views)},
    meas:ID.meas, fit:ID.fit, colors:COL, sessions:CAL.sessions, tris:AV.tris, cam:el('b-cam').textContent,
    trk:{frames:TRK.frames,delegate:TRK.delegate,lost:TRK.lost,err:TRK.err&&String(TRK.err)}, poseAbs:CAP.poseAbs, bsRaw:CAP.bsRaw, motion:CAP.motion,
    t:el('pip').currentTime, head:AV.bones&&{x:AV.bones.head.rotation.x,y:AV.bones.head.rotation.y,z:AV.bones.head.rotation.z}}; },
  // resolves once the mosaic asked for last is in the scene
  async settled(){ for(;;){ const p=TES.built; await p; if(!TES.waiting&&p===TES.built) return !!TES.set;
    await new Promise(r=>setTimeout(r,30)); } },
  freeze(on=true){FROZEN=on;},
  // a clean render for inspection (no UI): head turned/tilted, expressions,
  // optionally the bare geometry in grey — returns a PNG data URL
  snap(o={}){
    const {yaw=0,pitch=0,zoom=1.35,bs={},jaw=0,grey=false,W=440,H=520,cy=-0.012,hide=[]}=o, B=AV.bones, M=AV.morphIdx, R=Math.PI/180;
    const hid=(hide.includes('mouth')?AV.mouthParts||[]:[]).filter(m=>m.visible); for(const m of hid) m.visible=false;
    const inf=AV.head.morphTargetInfluences, infS=Array.from(inf), saved=Object.values(B).map(b=>[b,b.rotation.clone(),b.position.clone()]);
    const mat=AV.head.material, rootR=AV.root.rotation.clone();
    for(const [b] of saved) b.rotation.set(0,0,0); B.root.position.y=-0.30; AV.root.rotation.set(0,0,0);
    B.head.rotation.set(pitch*R,yaw*R,0); B.jaw.rotation.x=jaw*0.38; inf.fill(0);
    for(const k in bs) if(M[k]!=null) inf[M[k]]=bs[k];
    if(grey) AV.head.material=new THREE.MeshStandardMaterial({color:0xb8b0a8,roughness:0.6});
    AV.root.updateMatrixWorld(true);
    const cam=new THREE.PerspectiveCamera(camera.fov,W/H,0.01,10); cam.position.set(0,cy,0.60/zoom); cam.lookAt(0,cy,0);
    const rt=screenTarget(W,H), px=new Uint8Array(W*H*4), bg=scene.background;
    renderer.setRenderTarget(rt); renderer.render(scene,cam); renderer.readRenderTargetPixels(rt,0,0,W,H,px); renderer.setRenderTarget(null); rt.dispose();
    if(grey){ AV.head.material.dispose(); AV.head.material=mat; } for(const m of hid) m.visible=true;
    for(const [b,r,q] of saved){ b.rotation.copy(r); b.position.copy(q); } infS.forEach((v,k)=>inf[k]=v); AV.root.rotation.copy(rootR); AV.root.updateMatrixWorld(true);
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'), img=g.createImageData(W,H);
    for(let y=0;y<H;y++) img.data.set(px.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);
    g.putImageData(img,0,0); return cv.toDataURL('image/png'); },
  // lift: raise the view by that many half-heights of the frame. Applied at
  // once — mesh and tiles alike — so a render straight after sees it.
  setView({yaw=0,zoom=1,lift=0}={}){ orbit.yaw=yaw*Math.PI/180; orbit.dist=0.60/zoom; camera.position.z=orbit.dist;
    camera.position.y=-0.022+lift*orbit.dist*Math.tan(camera.fov*Math.PI/360);
    if(AV.root){ AV.root.rotation.y=orbit.yaw; AV.root.rotation.x=orbit.pitch; driveTesserae(); } },
};

addEventListener('load',()=>{
  wire(); wireTesserae(); initScene();
  buildAvatar();                      // base humanoid exists before any camera
  netInit(); renegotiate();
  card('BASE HUMANOID','generated · '+AV.tris.toLocaleString()+' tri · rigged · laid as tesserae<br>'+
    'Start Camera → guided calibration reshapes it to you');
  hint('Open a 2nd tab to pair · or Start Camera');
});
window.onerror=(m,s,l)=>console.error('ERR',m,l);
</script>
