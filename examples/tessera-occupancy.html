<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tesserae · occupancy</title>
  <!--
    tessera-occupancy.html — adaptive sparse-voxel tesserae with opacity.

    Tests the idea: instead of shrinking randomly-sampled tesserae (which leaves
    negative space), tile the surface with a voxel grid. Where more detail is
    needed, SUBDIVIDE a tessera into an N x N x N cube of smaller tesserae. Each
    (sub)cell carries an OPACITY from how much surface it contains:
        empty cell   -> 0 opacity (vanishes — no random gaps)
        full cell    -> 1 opacity (solid)
        edge cell    -> partial   (a soft, optically-blended boundary)

    This keeps the form contiguous, resolves detail only where asked, and is the
    natural bridge to optical blending. Static model (Soldier bind pose / helmet)
    so the voxelization stays clear; animation can come later.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d7e0ea; }
    #app { position: fixed; inset: 0; } canvas { display: block; }
    #hud { position: fixed; top: env(safe-area-inset-top, 12px); left: 12px; padding: 12px 14px;
      border-radius: 10px; background: rgba(10,14,20,.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.08); min-width: 220px; user-select: none; -webkit-user-select: none; }
    #hud h1 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: #8aa0b6; font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 16px; } .row + .row { margin-top: 2px; }
    .k { color: #7e90a4; } .v { color: #eaf2fb; font-variant-numeric: tabular-nums; }
    #fps { font-size: 22px; font-weight: 700; }
    .fps-good { color: #5ad08a; } .fps-mid { color: #f0c761; } .fps-bad { color: #ef6f6f; }
    #controls { position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(10,14,20,.72);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; }
    .group .label { color: #7e90a4; align-self: center; padding: 0 4px; letter-spacing: .08em; }
    button { font: inherit; color: #cdd9e6; cursor: pointer; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12); padding: 7px 11px; border-radius: 7px; -webkit-tap-highlight-color: transparent; }
    button:hover { background: rgba(255,255,255,.1); } button.active { background: #2f6df0; border-color: #2f6df0; color: #fff; }
    #note { position: fixed; top: env(safe-area-inset-top, 12px); right: 12px; max-width: 240px; text-align: right; color: #65788c; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>tessera-occupancy</h1>
    <div class="row"><span class="k">FPS</span><span id="fps" class="v">—</span></div>
    <div class="row"><span class="k">tesserae</span><span id="count" class="v">—</span></div>
    <div class="row"><span class="k">base grid</span><span id="grid" class="v">—</span></div>
    <div class="row"><span class="k">detail grid</span><span id="fine" class="v">—</span></div>
    <div class="row"><span class="k">opacity</span><span id="op" class="v">alpha</span></div>
    <div class="row"><span class="k">draw calls</span><span id="calls" class="v">1</span></div>
  </div>

  <div id="note"><div id="model">loading…</div></div>

  <div id="controls">
    <div class="group" id="model-group"><span class="label">MODEL</span></div>
    <div class="group" id="res-group"><span class="label">RESOLUTION</span></div>
    <div class="group" id="sub-group"><span class="label">SUBDIVIDE</span></div>
    <div class="group" id="region-group"><span class="label">DETAIL</span></div>
    <div class="group" id="thr-group"><span class="label">CULL</span></div>
    <div class="group" id="opacity-group"><span class="label">OPACITY</span></div>
    <div class="group" id="view-group"><span class="label">VIEW</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MODELS = {
      Soldier: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb',
      Helmet:  'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
    };
    const RES = [16, 22, 30];          // base grid cells along the largest axis
    const SUBS = [1, 2, 3];            // subdivide a detail cell into N x N x N
    const CULL = { none: 0, low: 0.18, med: 0.35 };
    const HEAD_BAND = 0.78;            // height fraction above which = "detail" region
    const K = 160000;                  // surface samples used to estimate occupancy

    // ---- renderer / scene ----
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('app').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090d);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(1, 1.6, 1); scene.add(key);
    const rim = new THREE.DirectionalLight(0x4f7bff, 0.7); rim.position.set(-1, -0.4, -1); scene.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.7; controls.minDistance = 0.001;
    const center = new THREE.Vector3(); let radius = 1;
    function frameView() {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const dist = 1.3 * radius / Math.sin(Math.min(vFov, hFov) / 2);
      controls.target.copy(center);
      camera.position.set(center.x, center.y + radius * 0.1, center.z + dist);
      camera.near = Math.max(dist / 1000, 0.001); camera.far = dist * 20;
      camera.updateProjectionMatrix(); controls.update();
    }

    // ---- state ----
    let modelName = 'Soldier', baseRes = 22, sub = 2, region = 'head', cull = CULL.none, alpha = true;
    let surface = null, inst = null;

    // ---- surface merge + area-weighted point sampling ----
    function mergeSurface(root) {
      const chunks = [];
      root.updateWorldMatrix(true, true);
      root.traverse((o) => {
        if (!o.isMesh || !o.geometry) return;
        let g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
        g = g.clone(); g.applyMatrix4(o.matrixWorld);
        chunks.push(g);
      });
      let total = 0; for (const g of chunks) total += g.attributes.position.count;
      const positions = new Float32Array(total * 3); let off = 0;
      for (const g of chunks) { positions.set(g.attributes.position.array, off * 3); off += g.attributes.position.count; }
      return { positions };
    }
    function samplePoints(surf, n) {
      const p = surf.positions, triN = p.length / 9;
      const cum = new Float64Array(triN); let running = 0;
      for (let t = 0; t < triN; t++) {
        const o = t * 9;
        const abx=p[o+3]-p[o], aby=p[o+4]-p[o+1], abz=p[o+5]-p[o+2];
        const acx=p[o+6]-p[o], acy=p[o+7]-p[o+1], acz=p[o+8]-p[o+2];
        const cx=aby*acz-abz*acy, cy=abz*acx-abx*acz, cz=abx*acy-aby*acx;
        running += 0.5 * Math.hypot(cx, cy, cz); cum[t] = running;
      }
      const total = running;
      const pick = (r) => { let lo=0, hi=triN-1, x=r*total; while (lo<hi){ const m=(lo+hi)>>1; if (cum[m]<x) lo=m+1; else hi=m; } return lo; };
      const out = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const t = pick(Math.random()), o = t * 9;
        let u = Math.random(), v = Math.random(); if (u+v>1){u=1-u;v=1-v;} const w = 1-u-v;
        out[i*3]   = p[o]*w   + p[o+3]*u + p[o+6]*v;
        out[i*3+1] = p[o+1]*w + p[o+4]*u + p[o+7]*v;
        out[i*3+2] = p[o+2]*w + p[o+5]*u + p[o+8]*v;
      }
      return out;
    }

    // ---- voxel occupancy ----
    function emit(map, cell, cullFrac, list) {
      if (map.size === 0) return;
      const counts = [...map.values()].map(c => c.n).sort((a, b) => a - b);
      const p90 = counts[Math.floor(counts.length * 0.9)] || 1;
      for (const c of map.values()) {
        const frac = c.n / p90;
        if (frac < cullFrac) continue;
        const op = Math.min(1, Math.max(0.12, Math.sqrt(frac)));
        list.push((c.ix + 0.5) * cell, (c.iy + 0.5) * cell, (c.iz + 0.5) * cell, cell * 0.92, op);
      }
    }
    function voxelize() {
      const pts = samplePoints(surface, K);
      let minx=Infinity,miny=Infinity,minz=Infinity,maxx=-Infinity,maxy=-Infinity,maxz=-Infinity;
      for (let i = 0; i < K; i++) { const x=pts[i*3],y=pts[i*3+1],z=pts[i*3+2];
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; if(z<minz)minz=z; if(z>maxz)maxz=z; }
      const maxDim = Math.max(maxx-minx, maxy-miny, maxz-minz) || 1;
      const baseCell = maxDim / baseRes;
      const fineCell = baseCell / sub;
      const spanY = (maxy - miny) || 1;

      const coarse = new Map(), fine = new Map();
      const bin = (map, cell, x, y, z) => {
        const ix = Math.floor(x/cell), iy = Math.floor(y/cell), iz = Math.floor(z/cell);
        const k = ix + '_' + iy + '_' + iz; let e = map.get(k);
        if (!e) { e = { ix, iy, iz, n: 0 }; map.set(k, e); } e.n++;
      };
      for (let i = 0; i < K; i++) {
        const x=pts[i*3], y=pts[i*3+1], z=pts[i*3+2];
        const detail = sub > 1 && (region === 'all' || (y - miny) / spanY >= HEAD_BAND);
        if (detail) bin(fine, fineCell, x, y, z); else bin(coarse, baseCell, x, y, z);
      }

      const list = [];
      emit(coarse, baseCell, cull, list);
      emit(fine, fineCell, cull, list);
      buildInstances(list, alpha);

      document.getElementById('grid').textContent = baseRes + '³';
      document.getElementById('fine').textContent = (sub > 1) ? (baseRes * sub) + '³ · ' + region : 'off';
      document.getElementById('count').textContent = (list.length / 5).toLocaleString();
    }

    // ---- per-instance opacity material ----
    function makeMaterial() {
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.1, color: 0x9fb4cc });
      mat.transparent = alpha; mat.depthWrite = true;
      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = 'attribute float instanceOpacity;\nvarying float vOpacity;\n' +
          shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vOpacity = instanceOpacity;');
        shader.fragmentShader = 'varying float vOpacity;\n' +
          shader.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n  gl_FragColor.a *= vOpacity;');
      };
      return mat;
    }
    function buildInstances(list, useAlpha) {
      if (inst) { scene.remove(inst); inst.geometry.dispose(); inst.material.dispose(); }
      const n = list.length / 5;
      const geo = new RoundedBoxGeometry(1, 1, 1, 2, 0.18);
      const opac = new Float32Array(n);
      inst = new THREE.InstancedMesh(geo, makeMaterial(), n);
      inst.frustumCulled = false;
      const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
      for (let i = 0; i < n; i++) {
        p.set(list[i*5], list[i*5+1], list[i*5+2]); s.setScalar(list[i*5+3]);
        m.compose(p, q, s); inst.setMatrixAt(i, m);
        opac[i] = useAlpha ? list[i*5+4] : 1;
      }
      geo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(opac, 1));
      inst.instanceMatrix.needsUpdate = true;
      scene.add(inst);
    }

    // ---- loading ----
    const loader = new GLTFLoader();
    function loadModel(name) {
      modelName = name;
      document.getElementById('model').textContent = 'loading ' + name + '…';
      loader.load(MODELS[name], (gltf) => {
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const sph = box.getBoundingSphere(new THREE.Sphere());
        center.copy(sph.center); radius = sph.radius || 1;
        surface = mergeSurface(gltf.scene);
        voxelize(); frameView();
        document.getElementById('model').textContent = name + ' (static)';
      }, undefined, () => { document.getElementById('model').textContent = name + ' — load failed'; });
    }

    // ---- controls ----
    function makeButtons(groupId, items, current, label, onPick) {
      const group = document.getElementById(groupId); const map = new Map();
      for (const it of items) {
        const b = document.createElement('button'); b.textContent = label(it);
        b.onclick = () => { onPick(it); for (const [val, btn] of map) btn.classList.toggle('active', val === it); };
        if (it === current) b.classList.add('active'); group.appendChild(b); map.set(it, b);
      }
    }
    const reVoxel = () => { if (surface) voxelize(); };
    makeButtons('model-group', Object.keys(MODELS), 'Soldier', m => m, m => loadModel(m));
    makeButtons('res-group', RES, baseRes, r => r + '³', r => { baseRes = r; reVoxel(); });
    makeButtons('sub-group', SUBS, sub, s => (s === 1 ? 'off' : s + '×'), s => { sub = s; reVoxel(); });
    makeButtons('region-group', ['head', 'all'], region, r => r, r => { region = r; reVoxel(); });
    makeButtons('thr-group', Object.keys(CULL), 'none', k => k, k => { cull = CULL[k]; reVoxel(); });
    makeButtons('opacity-group', ['alpha', 'solid'], 'alpha', o => o, o => {
      alpha = (o === 'alpha'); document.getElementById('op').textContent = o; reVoxel(); });

    (function viewButtons() {
      const g = document.getElementById('view-group');
      const reframe = document.createElement('button'); reframe.textContent = 'reframe'; reframe.onclick = () => frameView();
      const spin = document.createElement('button'); spin.textContent = 'auto-spin'; spin.classList.add('active');
      spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.classList.toggle('active', controls.autoRotate); };
      g.append(reframe, spin);
    })();

    // ---- loop ----
    const fpsEl = document.getElementById('fps');
    let acc = 0, frames = 0, smoothed = 0, lastT = performance.now();
    function tick(now) {
      acc += now - lastT; lastT = now; frames++;
      if (acc >= 250) {
        const fps = (frames*1000)/acc; smoothed = smoothed ? smoothed*0.7 + fps*0.3 : fps;
        fpsEl.textContent = smoothed.toFixed(0);
        fpsEl.className = 'v ' + (smoothed >= 50 ? 'fps-good' : smoothed >= 30 ? 'fps-mid' : 'fps-bad');
        acc = 0; frames = 0;
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); controls.update();
    });

    loadModel('Soldier');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
