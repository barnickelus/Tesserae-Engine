<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tesserae · occupancy</title>
  <!--
    tessera-occupancy.html — adaptive sparse-voxel tesserae with opacity.

    Tests the idea: instead of shrinking randomly-sampled tesserae (which leaves
    negative space), tile the surface with a voxel grid. Where more detail is
    needed, SUBDIVIDE a tessera into an N x N x N cube of smaller tesserae. Each
    (sub)cell carries an OPACITY from how much surface it contains:
        empty cell   -> 0 opacity (vanishes — no random gaps)
        full cell    -> 1 opacity (solid)
        edge cell    -> partial   (a soft, optically-blended boundary)

    Detail is multi-level: each base cell gets a LEVEL (0..N-1) from a detail
    field (surface curvature or height) and subdivides into an (L+1)³ grid, with
    dithered level boundaries so detail ramps smoothly instead of a hard split.
    The coverage scalar can drive alpha, a material colour ramp (tint), or
    nothing (solid). SHAPE: packed = spheres at cell centres + concave star
    "plugs" nested into the negative space where spheres meet (a complementary
    two-shape dynamic); joined = boxes linked by bowtie connectors; composite =
    sphere + 8 corner diamonds per cell; interlock = one primitive per cell from
    neighbour occupancy; cube = a single rounded box. Static model (Soldier /
    helmet) so it stays clear; animation can come later.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d7e0ea; }
    #app { position: fixed; inset: 0; } canvas { display: block; }
    #hud { position: fixed; top: env(safe-area-inset-top, 12px); left: 12px; padding: 12px 14px;
      border-radius: 10px; background: rgba(10,14,20,.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.08); min-width: 220px; user-select: none; -webkit-user-select: none; }
    #hud h1 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: #8aa0b6; font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 16px; } .row + .row { margin-top: 2px; }
    .k { color: #7e90a4; } .v { color: #eaf2fb; font-variant-numeric: tabular-nums; }
    #fps { font-size: 22px; font-weight: 700; }
    .fps-good { color: #5ad08a; } .fps-mid { color: #f0c761; } .fps-bad { color: #ef6f6f; }
    #controls { position: fixed; bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(10,14,20,.72);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; }
    .group .label { color: #7e90a4; align-self: center; padding: 0 4px; letter-spacing: .08em; }
    button { font: inherit; color: #cdd9e6; cursor: pointer; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12); padding: 7px 11px; border-radius: 7px; -webkit-tap-highlight-color: transparent; }
    button:hover { background: rgba(255,255,255,.1); } button.active { background: #2f6df0; border-color: #2f6df0; color: #fff; }
    #note { position: fixed; top: env(safe-area-inset-top, 12px); right: 12px; max-width: 240px; text-align: right; color: #65788c; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>tessera-occupancy</h1>
    <div class="row"><span class="k">FPS</span><span id="fps" class="v">—</span></div>
    <div class="row"><span class="k">tesserae</span><span id="count" class="v">—</span></div>
    <div class="row"><span class="k">base grid</span><span id="grid" class="v">—</span></div>
    <div class="row"><span class="k">levels · src</span><span id="fine" class="v">—</span></div>
    <div class="row"><span class="k">scalar</span><span id="op" class="v">alpha</span></div>
    <div class="row"><span class="k">draw calls</span><span id="calls" class="v">1</span></div>
  </div>

  <div id="note"><div id="model">loading…</div></div>

  <div id="controls">
    <div class="group" id="model-group"><span class="label">MODEL</span></div>
    <div class="group" id="res-group"><span class="label">RESOLUTION</span></div>
    <div class="group" id="sub-group"><span class="label">LEVELS</span></div>
    <div class="group" id="region-group"><span class="label">SOURCE</span></div>
    <div class="group" id="shape-group"><span class="label">SHAPE</span></div>
    <div class="group" id="thr-group"><span class="label">CULL</span></div>
    <div class="group" id="opacity-group"><span class="label">SCALAR</span></div>
    <div class="group" id="view-group"><span class="label">VIEW</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MODELS = {
      Soldier: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb',
      Helmet:  'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
    };
    const RES = [16, 22, 30];          // base grid cells along the largest axis
    const LEVELS = [1, 2, 3, 4];       // max detail levels (1 = uniform base grid)
    const SOURCES = ['curvature', 'height'];   // what drives per-cell detail level
    const SCALARS = ['alpha', 'tint', 'solid']; // what surface coverage maps to
    const SHAPES = ['packed', 'joined', 'composite', 'interlock', 'cube']; // per-cell shape selection
    const CULL = { none: 0, low: 0.18, med: 0.35 };
    const CURV_GAIN = 5.0;             // amplifies curvature into a [0,1] detail field
    const K = 200000;                  // surface samples used to estimate occupancy
    const RAMP_LO = new THREE.Color(0x3b73d6), RAMP_HI = new THREE.Color(0xffc06a); // tint ramp
    const ACCENT = new THREE.Color(0xff8a5c); // composite corner accent (tint mode)

    // ---- renderer / scene ----
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('app').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090d);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 5000);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(1, 1.6, 1); scene.add(key);
    const rim = new THREE.DirectionalLight(0x4f7bff, 0.7); rim.position.set(-1, -0.4, -1); scene.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.7; controls.minDistance = 0.001;
    const center = new THREE.Vector3(); let radius = 1;
    function frameView() {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const dist = 1.3 * radius / Math.sin(Math.min(vFov, hFov) / 2);
      controls.target.copy(center);
      camera.position.set(center.x, center.y + radius * 0.1, center.z + dist);
      camera.near = Math.max(dist / 1000, 0.001); camera.far = dist * 20;
      camera.updateProjectionMatrix(); controls.update();
    }

    // ---- state ----
    let modelName = 'Soldier', baseRes = 22, maxLevel = 3, source = 'curvature', cull = CULL.none, scalar = 'alpha', shapeMode = 'packed';
    let surface = null; let insts = [];
    // hourglass / bowtie connector profile (revolved around +Y): wide ends, narrow waist
    const BOWTIE_PROFILE = [[0,-0.5],[0.5,-0.5],[0.16,0],[0.5,0.5],[0,0.5]].map(q => new THREE.Vector2(q[0], q[1]));

    // ---- surface merge + area-weighted point sampling ----
    function mergeSurface(root) {
      const chunks = [];
      root.updateWorldMatrix(true, true);
      root.traverse((o) => {
        if (!o.isMesh || !o.geometry) return;
        let g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
        g = g.clone(); g.applyMatrix4(o.matrixWorld);
        if (!g.attributes.normal) g.computeVertexNormals();
        chunks.push(g);
      });
      let total = 0; for (const g of chunks) total += g.attributes.position.count;
      const positions = new Float32Array(total * 3), normals = new Float32Array(total * 3); let off = 0;
      for (const g of chunks) {
        positions.set(g.attributes.position.array, off * 3);
        normals.set(g.attributes.normal.array, off * 3);
        off += g.attributes.position.count;
      }
      return { positions, normals };
    }
    // Area-weighted surface points, with interpolated normals (used to estimate
    // per-cell curvature for the detail field).
    function samplePoints(surf, n) {
      const p = surf.positions, nr = surf.normals, triN = p.length / 9;
      const cum = new Float64Array(triN); let running = 0;
      for (let t = 0; t < triN; t++) {
        const o = t * 9;
        const abx=p[o+3]-p[o], aby=p[o+4]-p[o+1], abz=p[o+5]-p[o+2];
        const acx=p[o+6]-p[o], acy=p[o+7]-p[o+1], acz=p[o+8]-p[o+2];
        const cx=aby*acz-abz*acy, cy=abz*acx-abx*acz, cz=abx*acy-aby*acx;
        running += 0.5 * Math.hypot(cx, cy, cz); cum[t] = running;
      }
      const total = running;
      const pick = (r) => { let lo=0, hi=triN-1, x=r*total; while (lo<hi){ const m=(lo+hi)>>1; if (cum[m]<x) lo=m+1; else hi=m; } return lo; };
      const out = new Float32Array(n * 3), on = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const t = pick(Math.random()), o = t * 9;
        let u = Math.random(), v = Math.random(); if (u+v>1){u=1-u;v=1-v;} const w = 1-u-v;
        out[i*3]   = p[o]*w   + p[o+3]*u + p[o+6]*v;
        out[i*3+1] = p[o+1]*w + p[o+4]*u + p[o+7]*v;
        out[i*3+2] = p[o+2]*w + p[o+5]*u + p[o+8]*v;
        let nx = nr[o]*w + nr[o+3]*u + nr[o+6]*v, ny = nr[o+1]*w + nr[o+4]*u + nr[o+7]*v, nz = nr[o+2]*w + nr[o+5]*u + nr[o+8]*v;
        const nl = Math.hypot(nx,ny,nz) || 1; on[i*3]=nx/nl; on[i*3+1]=ny/nl; on[i*3+2]=nz/nl;
      }
      return { pts: out, nrm: on };
    }

    // ---- multi-level voxel occupancy ----
    // Each base cell is assigned a detail LEVEL (0..maxLevel-1) from a detail
    // field (surface curvature or height). Level L subdivides that cell into an
    // (L+1)³ grid, so detail ramps across several levels instead of a binary
    // coarse/fine split. The level threshold is dithered per base cell so the
    // boundary between levels breaks up instead of forming a hard seam.
    const cellHash = (a, b, c) => { let h = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791); return ((h >>> 0) % 1024) / 1024; };

    function voxelize() {
      const { pts, nrm } = samplePoints(surface, K);
      let minx=Infinity,miny=Infinity,minz=Infinity,maxx=-Infinity,maxy=-Infinity,maxz=-Infinity;
      for (let i = 0; i < K; i++) { const x=pts[i*3],y=pts[i*3+1],z=pts[i*3+2];
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; if(z<minz)minz=z; if(z>maxz)maxz=z; }
      const maxDim = Math.max(maxx-minx, maxy-miny, maxz-minz) || 1;
      const baseCell = maxDim / baseRes;
      const spanY = (maxy - miny) || 1;

      // pass 1: per base cell, accumulate mean normal (for curvature)
      const stats = new Map();
      for (let i = 0; i < K; i++) {
        const x=pts[i*3], y=pts[i*3+1], z=pts[i*3+2];
        const ix=Math.floor(x/baseCell), iy=Math.floor(y/baseCell), iz=Math.floor(z/baseCell);
        const k = ix + '_' + iy + '_' + iz; let e = stats.get(k);
        if (!e) { e = { ix, iy, iz, n: 0, nx: 0, ny: 0, nz: 0, level: 0 }; stats.set(k, e); }
        e.n++; e.nx += nrm[i*3]; e.ny += nrm[i*3+1]; e.nz += nrm[i*3+2];
      }
      // assign a detail level to each base cell
      for (const e of stats.values()) {
        let d;
        if (source === 'curvature') { const ml = Math.hypot(e.nx, e.ny, e.nz) / e.n; d = Math.min(1, (1 - ml) * CURV_GAIN); }
        else { const cy = (e.iy + 0.5) * baseCell; d = Math.pow((cy - miny) / spanY, 1.3); }
        e.level = Math.max(0, Math.min(maxLevel - 1, Math.floor(d * (maxLevel - 1) + cellHash(e.ix, e.iy, e.iz))));
      }
      // pass 2: bin each sample at its base cell's level resolution
      const cells = new Map();
      for (let i = 0; i < K; i++) {
        const x=pts[i*3], y=pts[i*3+1], z=pts[i*3+2];
        const bk = Math.floor(x/baseCell) + '_' + Math.floor(y/baseCell) + '_' + Math.floor(z/baseCell);
        const st = stats.get(bk); const lvl = st ? st.level : 0;
        const cell = baseCell / (lvl + 1);
        const ix=Math.floor(x/cell), iy=Math.floor(y/cell), iz=Math.floor(z/cell);
        const k = lvl + '|' + ix + '_' + iy + '_' + iz; let e = cells.get(k);
        if (!e) { e = { lvl, ix, iy, iz, n: 0 }; cells.set(k, e); } e.n++;
      }
      // emit, normalising occupancy per level (cell volumes differ by level).
      // In INTERLOCK mode each cell picks a shape from how many of its 6 face
      // neighbours are occupied: flat cells (few exposed faces) → rounded cube,
      // edges → sphere, tips/corners → diamond, so pieces interlock along the form.
      const byLevel = []; for (let L = 0; L < maxLevel; L++) byLevel.push([]);
      for (const c of cells.values()) byLevel[c.lvl].push(c);
      const list = [], conns = [], plugs = [];
      const joined = shapeMode === 'joined', packed = shapeMode === 'packed';
      for (let L = 0; L < maxLevel; L++) {
        const arr = byLevel[L]; if (!arr.length) continue;
        const counts = arr.map(c => c.n).sort((a, b) => a - b);
        const p90 = counts[Math.floor(counts.length * 0.9)] || 1;
        const cell = baseCell / (L + 1);
        const needSet = shapeMode === 'interlock' || joined;
        const set = needSet ? new Set(arr.map(c => c.ix + '_' + c.iy + '_' + c.iz)) : null;
        for (const c of arr) {
          const frac = c.n / p90; if (frac < cull) continue;
          const cov = Math.min(1, Math.max(0.12, Math.sqrt(frac)));
          const cx = (c.ix + 0.5) * cell, cy = (c.iy + 0.5) * cell, cz = (c.iz + 0.5) * cell;
          let shape = 0;
          if (set && shapeMode === 'interlock') {
            let solid = 0;
            if (set.has((c.ix+1)+'_'+c.iy+'_'+c.iz)) solid++;
            if (set.has((c.ix-1)+'_'+c.iy+'_'+c.iz)) solid++;
            if (set.has(c.ix+'_'+(c.iy+1)+'_'+c.iz)) solid++;
            if (set.has(c.ix+'_'+(c.iy-1)+'_'+c.iz)) solid++;
            if (set.has(c.ix+'_'+c.iy+'_'+(c.iz+1))) solid++;
            if (set.has(c.ix+'_'+c.iy+'_'+(c.iz-1))) solid++;
            const exposed = 6 - solid;
            shape = exposed <= 2 ? 0 : (exposed === 3 ? 1 : 2);
          }
          list.push(cx, cy, cz, cell * 0.95, cov, shape);
          // joined: bowtie connectors across shared faces with the +x/+y/+z neighbour
          if (joined) {
            const rad = cell * 0.26, len = cell;
            if (set.has((c.ix+1)+'_'+c.iy+'_'+c.iz)) conns.push(cx + 0.5*cell, cy, cz, len, rad, 0, cov);
            if (set.has(c.ix+'_'+(c.iy+1)+'_'+c.iz)) conns.push(cx, cy + 0.5*cell, cz, len, rad, 1, cov);
            if (set.has(c.ix+'_'+c.iy+'_'+(c.iz+1))) conns.push(cx, cy, cz + 0.5*cell, len, rad, 2, cov);
          }
        }
        // packed: place a concave plug at each grid corner surrounded by spheres
        if (packed) {
          const cmap = new Map();
          for (const c of arr) {
            for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) for (let dz = 0; dz < 2; dz++) {
              const kk = (c.ix+dx) + '_' + (c.iy+dy) + '_' + (c.iz+dz);
              cmap.set(kk, (cmap.get(kk) || 0) + 1);
            }
          }
          for (const [kk, cnt] of cmap) {
            if (cnt < 4) continue;                       // only corners well-surrounded by spheres
            const parts = kk.split('_');
            plugs.push(+parts[0]*cell, +parts[1]*cell, +parts[2]*cell, cell, Math.min(1, cnt / 8 + 0.2));
          }
        }
      }
      if (packed) buildPacked(list, plugs);
      else if (joined) buildJoined(list, conns);
      else buildInstances(list);

      document.getElementById('grid').textContent = baseRes + '³';
      document.getElementById('fine').textContent = maxLevel + ' · ' + source;
      document.getElementById('count').textContent = (list.length / 6).toLocaleString();
    }

    // ---- per-instance scalar material ----
    // The per-cell coverage scalar can drive transparency (alpha), a material
    // colour ramp (tint — a stand-in for "how much of material X"), or nothing
    // (solid). Opacity is injected per-instance into the standard material.
    function makeMaterial() {
      const tint = scalar === 'tint';
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.1, vertexColors: tint });
      if (!tint) mat.color.set(0x9fb4cc);
      mat.transparent = (scalar === 'alpha'); mat.depthWrite = true;
      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = 'attribute float instanceOpacity;\nvarying float vOpacity;\n' +
          shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vOpacity = instanceOpacity;');
        shader.fragmentShader = 'varying float vOpacity;\n' +
          shader.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n  gl_FragColor.a *= vOpacity;');
      };
      return mat;
    }
    // Concave plug — the true negative space between packed spheres. Start from a
    // unit sphere of directions and, for each direction, march out from the corner
    // until the ray first enters one of the 8 surrounding spheres (radius Rs at
    // ±0.5 in cell units). The resulting faces are concave spherical surfaces that
    // match each neighbouring sphere's curvature, so the plug seats flush; toward
    // the axis gaps (no sphere blocks) it spikes out to a cap where plugs meet.
    const PLUG_RS = 0.494;   // neighbour sphere radius in cell units (matches packed spheres)
    const PLUG_CAP = 0.5;    // max plug radius — plugs meet at face/edge midpoints
    function makeStarGeo(Rs) {
      const g = new THREE.IcosahedronGeometry(1, 4);   // unit directions
      const pos = g.attributes.position;
      const C = [];
      for (const sx of [0.5,-0.5]) for (const sy of [0.5,-0.5]) for (const sz of [0.5,-0.5]) C.push([sx,sy,sz]);
      for (let i = 0; i < pos.count; i++) {
        const ux = pos.getX(i), uy = pos.getY(i), uz = pos.getZ(i);   // already unit length
        let t = PLUG_CAP;
        for (const c of C) {
          const dot = ux*c[0] + uy*c[1] + uz*c[2];
          if (dot <= 0) continue;                                     // sphere behind this direction
          const disc = dot*dot - (c[0]*c[0]+c[1]*c[1]+c[2]*c[2] - Rs*Rs);
          if (disc <= 0) continue;                                    // ray misses this sphere
          const tt = dot - Math.sqrt(disc);                           // near intersection
          if (tt > 0 && tt < t) t = tt;
        }
        pos.setXYZ(i, ux*t, uy*t, uz*t);
      }
      pos.needsUpdate = true; g.computeVertexNormals();
      return g;
    }

    // 0 = rounded cube (flat), 1 = sphere (edge), 2 = diamond (tip)
    function makeShapeGeo(shape) {
      if (shape === 1) return new THREE.IcosahedronGeometry(0.52, 2);
      if (shape === 2) return new THREE.OctahedronGeometry(0.62, 0);
      return new RoundedBoxGeometry(1, 1, 1, 2, 0.18);
    }
    function clearInsts() {
      for (const im of insts) { scene.remove(im); im.geometry.dispose(); im.material.dispose(); }
      insts = [];
    }
    // COMPOSITE: one tessera = a centre sphere + 8 corner diamonds that nest
    // into the corners the sphere can't reach (the 3D version of "circle
    // inscribed in a square + corner fills"). The parts interlock within the
    // cell and can carry separate material (corners = accent), previewing the
    // base + accent face-plate idea. Rendered as 2 InstancedMeshes.
    const CORNERS = [];
    for (const dx of [-1, 1]) for (const dy of [-1, 1]) for (const dz of [-1, 1]) CORNERS.push([dx*0.30, dy*0.30, dz*0.30]);
    function buildComposite(list) {
      const recs = list.length / 6;
      const coreGeo = new THREE.IcosahedronGeometry(0.5, 2);
      const cornGeo = new THREE.OctahedronGeometry(0.5, 0);
      const core = new THREE.InstancedMesh(coreGeo, makeMaterial(), recs);
      const corn = new THREE.InstancedMesh(cornGeo, makeMaterial(), recs * 8);
      core.frustumCulled = corn.frustumCulled = false;
      const coreOp = new Float32Array(recs), cornOp = new Float32Array(recs * 8);
      const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(), col = new THREE.Color();
      let ci = 0;
      for (let i = 0; i < recs; i++) {
        const x=list[i*6], y=list[i*6+1], z=list[i*6+2], size=list[i*6+3], cov=list[i*6+4];
        p.set(x, y, z); s.setScalar(size * 0.66); m.compose(p, q, s); core.setMatrixAt(i, m);
        coreOp[i] = (scalar === 'alpha') ? cov : 1;
        if (scalar === 'tint') { col.copy(RAMP_LO).lerp(RAMP_HI, cov); core.setColorAt(i, col); }
        for (const d of CORNERS) {
          p.set(x + d[0]*size, y + d[1]*size, z + d[2]*size); s.setScalar(size * 0.5);
          m.compose(p, q, s); corn.setMatrixAt(ci, m);
          cornOp[ci] = (scalar === 'alpha') ? cov * 0.85 : 1;
          if (scalar === 'tint') corn.setColorAt(ci, ACCENT);
          ci++;
        }
      }
      coreGeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(coreOp, 1));
      cornGeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(cornOp, 1));
      core.instanceMatrix.needsUpdate = corn.instanceMatrix.needsUpdate = true;
      if (core.instanceColor) core.instanceColor.needsUpdate = true;
      if (corn.instanceColor) corn.instanceColor.needsUpdate = true;
      scene.add(core); scene.add(corn); insts.push(core, corn);
      document.getElementById('calls').textContent = '2';
    }

    // PACKED: a two-shape complementary dynamic — spheres at cell centres plus
    // concave star "plugs" at the grid corners they surround, so the plug nests
    // into the negative space where spheres meet. Two InstancedMeshes.
    function buildPacked(list, plugs) {
      clearInsts();
      const recs = list.length / 6;
      const sgeo = new THREE.IcosahedronGeometry(0.5, 2);
      const sm = new THREE.InstancedMesh(sgeo, makeMaterial(), recs);
      sm.frustumCulled = false;
      const sop = new Float32Array(recs);
      const m = new THREE.Matrix4(), p = new THREE.Vector3(), s = new THREE.Vector3(), I = new THREE.Quaternion();
      for (let i = 0; i < recs; i++) {
        const cov = list[i*6+4];
        p.set(list[i*6], list[i*6+1], list[i*6+2]); s.setScalar(list[i*6+3] * 1.04);
        m.compose(p, I, s); sm.setMatrixAt(i, m);
        sop[i] = (scalar === 'alpha') ? cov : 1;
      }
      sgeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(sop, 1));
      sm.instanceMatrix.needsUpdate = true; scene.add(sm); insts.push(sm);

      const pn = plugs.length / 5;
      if (pn > 0) {
        const pgeo = makeStarGeo(PLUG_RS);
        const pmat = makeMaterial(); pmat.side = THREE.DoubleSide;
        const pm = new THREE.InstancedMesh(pgeo, pmat, pn);
        pm.frustumCulled = false;
        const pop = new Float32Array(pn);
        for (let j = 0; j < pn; j++) {
          const cov = plugs[j*5+4];
          p.set(plugs[j*5], plugs[j*5+1], plugs[j*5+2]); s.setScalar(plugs[j*5+3]);
          m.compose(p, I, s); pm.setMatrixAt(j, m);
          pop[j] = (scalar === 'alpha') ? cov : 1;
        }
        pgeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(pop, 1));
        pm.instanceMatrix.needsUpdate = true; scene.add(pm); insts.push(pm);
      }
      document.getElementById('calls').textContent = String(insts.length);
    }

    // JOINED: rounded-box tesserae linked by bowtie/hourglass connectors across
    // shared faces — the interlocking joint from the sketch. Two InstancedMeshes
    // (boxes + connectors).
    const JOIN_AX = [[1,0,0],[0,1,0],[0,0,1]];
    function buildJoined(list, conns) {
      clearInsts();
      const recs = list.length / 6;
      const boxGeo = new RoundedBoxGeometry(1, 1, 1, 2, 0.16);
      const box = new THREE.InstancedMesh(boxGeo, makeMaterial(), recs);
      box.frustumCulled = false;
      const boxOp = new Float32Array(recs);
      const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
      const I = new THREE.Quaternion();
      for (let i = 0; i < recs; i++) {
        const cov = list[i*6+4];
        p.set(list[i*6], list[i*6+1], list[i*6+2]); s.setScalar(list[i*6+3] * 0.72);
        m.compose(p, I, s); box.setMatrixAt(i, m);
        boxOp[i] = (scalar === 'alpha') ? cov : 1;
      }
      boxGeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(boxOp, 1));
      box.instanceMatrix.needsUpdate = true;
      scene.add(box); insts.push(box);

      const cn = conns.length / 7;
      if (cn > 0) {
        const cgeo = new THREE.LatheGeometry(BOWTIE_PROFILE, 12);
        const cm = new THREE.InstancedMesh(cgeo, makeMaterial(), cn);
        cm.frustumCulled = false;
        const cop = new Float32Array(cn);
        const up = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3();
        for (let j = 0; j < cn; j++) {
          const ax = conns[j*7+5];
          dir.set(JOIN_AX[ax][0], JOIN_AX[ax][1], JOIN_AX[ax][2]); q.setFromUnitVectors(up, dir);
          s.set(conns[j*7+4], conns[j*7+3], conns[j*7+4]); p.set(conns[j*7], conns[j*7+1], conns[j*7+2]);
          m.compose(p, q, s); cm.setMatrixAt(j, m);
          cop[j] = (scalar === 'alpha') ? conns[j*7+6] : 1;
        }
        cgeo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(cop, 1));
        cm.instanceMatrix.needsUpdate = true;
        scene.add(cm); insts.push(cm);
      }
      document.getElementById('calls').textContent = String(insts.length);
    }

    function buildInstances(list) {
      clearInsts();
      if (shapeMode === 'composite') return buildComposite(list);
      const recs = list.length / 6;
      const groups = [[], [], []];                 // one bucket per shape family
      for (let i = 0; i < recs; i++) groups[list[i*6+5]].push(i);

      const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(), col = new THREE.Color();
      for (let shape = 0; shape < 3; shape++) {
        const ids = groups[shape]; if (!ids.length) continue;
        const geo = makeShapeGeo(shape);
        const im = new THREE.InstancedMesh(geo, makeMaterial(), ids.length);
        im.frustumCulled = false;
        const opac = new Float32Array(ids.length);
        for (let j = 0; j < ids.length; j++) {
          const i = ids[j], cov = list[i*6+4];
          p.set(list[i*6], list[i*6+1], list[i*6+2]); s.setScalar(list[i*6+3]);
          m.compose(p, q, s); im.setMatrixAt(j, m);
          opac[j] = (scalar === 'alpha') ? cov : 1;
          if (scalar === 'tint') { col.copy(RAMP_LO).lerp(RAMP_HI, cov); im.setColorAt(j, col); }
        }
        geo.setAttribute('instanceOpacity', new THREE.InstancedBufferAttribute(opac, 1));
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
        scene.add(im); insts.push(im);
      }
      document.getElementById('calls').textContent = String(insts.length || 1);
    }

    // ---- loading ----
    const loader = new GLTFLoader();
    function loadModel(name) {
      modelName = name;
      document.getElementById('model').textContent = 'loading ' + name + '…';
      loader.load(MODELS[name], (gltf) => {
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const sph = box.getBoundingSphere(new THREE.Sphere());
        center.copy(sph.center); radius = sph.radius || 1;
        surface = mergeSurface(gltf.scene);
        voxelize(); frameView();
        document.getElementById('model').textContent = name + ' (static)';
      }, undefined, () => { document.getElementById('model').textContent = name + ' — load failed'; });
    }

    // ---- controls ----
    function makeButtons(groupId, items, current, label, onPick) {
      const group = document.getElementById(groupId); const map = new Map();
      for (const it of items) {
        const b = document.createElement('button'); b.textContent = label(it);
        b.onclick = () => { onPick(it); for (const [val, btn] of map) btn.classList.toggle('active', val === it); };
        if (it === current) b.classList.add('active'); group.appendChild(b); map.set(it, b);
      }
    }
    const reVoxel = () => { if (surface) voxelize(); };
    makeButtons('model-group', Object.keys(MODELS), 'Soldier', m => m, m => loadModel(m));
    makeButtons('res-group', RES, baseRes, r => r + '³', r => { baseRes = r; reVoxel(); });
    makeButtons('sub-group', LEVELS, maxLevel, L => (L === 1 ? 'flat' : L + ' lvl'), L => { maxLevel = L; reVoxel(); });
    makeButtons('region-group', SOURCES, source, s => s, s => { source = s; reVoxel(); });
    makeButtons('shape-group', SHAPES, shapeMode, x => x, x => { shapeMode = x; reVoxel(); });
    makeButtons('thr-group', Object.keys(CULL), 'none', k => k, k => { cull = CULL[k]; reVoxel(); });
    makeButtons('opacity-group', SCALARS, scalar, o => o, o => {
      scalar = o; document.getElementById('op').textContent = o; reVoxel(); });

    (function viewButtons() {
      const g = document.getElementById('view-group');
      const reframe = document.createElement('button'); reframe.textContent = 'reframe'; reframe.onclick = () => frameView();
      const spin = document.createElement('button'); spin.textContent = 'auto-spin'; spin.classList.add('active');
      spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.classList.toggle('active', controls.autoRotate); };
      g.append(reframe, spin);
    })();

    // ---- loop ----
    const fpsEl = document.getElementById('fps');
    let acc = 0, frames = 0, smoothed = 0, lastT = performance.now();
    function tick(now) {
      acc += now - lastT; lastT = now; frames++;
      if (acc >= 250) {
        const fps = (frames*1000)/acc; smoothed = smoothed ? smoothed*0.7 + fps*0.3 : fps;
        fpsEl.textContent = smoothed.toFixed(0);
        fpsEl.className = 'v ' + (smoothed >= 50 ? 'fps-good' : smoothed >= 30 ? 'fps-mid' : 'fps-bad');
        acc = 0; frames = 0;
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight); controls.update();
    });

    loadModel('Soldier');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
